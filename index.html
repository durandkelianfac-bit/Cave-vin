<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cave">
<meta name="theme-color" content="#6b1630">
<title>Cave</title>
<style>
:root{
  --wine:#6b1630; --wine2:#85213f; --wine-d:#4a0e22;
  --rose:#f4d6d9; --rose2:#fbe9ea; --cream:#fdf4ea; --paper:#fff8f3;
  --ink:#2a1218; --muted:#a58a90; --sage:#b7d4a8; --gold:#f3c969;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,"SF Pro Rounded","SF Pro Text",system-ui,sans-serif;touch-action:manipulation}
body{min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
[hidden]{display:none!important}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;background:var(--paper)}

/* ---------- Accueil ---------- */
.hero{background:var(--wine);border-radius:0 0 64px 0;padding:calc(var(--safe-t) + 14px) 22px 40px;position:relative;min-height:330px;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:3}
.logo{font-weight:700;font-size:22px;color:var(--rose);letter-spacing:.2px}
.ic-row{display:flex;gap:10px}
.circle{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--rose)}
.circle.filled{background:rgba(244,214,217,.2)}
.circle svg{width:22px;height:22px}
.search{width:100%;margin-top:12px;border-radius:16px;border:0;padding:13px 16px;background:var(--rose2);position:relative;z-index:3}
.hero h1{margin:64px 0 0;font-size:62px;line-height:1;font-weight:800;letter-spacing:-2px;color:var(--rose);position:relative;z-index:2}
.hero-sub{margin-top:14px;color:var(--rose);opacity:.85;font-size:14px;position:relative;z-index:2}
.hero-bottle{position:absolute;right:8px;top:70px;z-index:1;transform:rotate(16deg);filter:drop-shadow(0 18px 18px rgba(0,0,0,.35))}
.hero-bottle svg{height:250px;width:auto;display:block}
.tabs{display:flex;gap:26px;overflow-x:auto;padding:26px 22px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding-top:32px;font-weight:800;font-size:20px;line-height:1;color:#c3adb1;white-space:nowrap}
.tab.on{color:var(--ink)}
.tab i{position:absolute;top:0;left:0;min-width:22px;height:22px;border-radius:11px;padding:0 6px;background:#dccbce;color:#fff;font:700 11px/22px system-ui;text-align:center;font-style:normal}
.tab.on i{background:#1b0b10}
#list{padding:8px 0 130px}
.card{position:relative;margin:16px 0 16px 64px;background:var(--wine);border-radius:30px 0 0 30px;
  padding:16px 14px 16px 46px;min-height:112px;display:flex;align-items:center;gap:10px;color:var(--rose)}
.card.empty{opacity:.55}
.cbottle{position:absolute;left:-36px;top:50%;transform:translateY(-50%) rotate(-6deg);filter:drop-shadow(0 8px 8px rgba(40,8,18,.35))}
.cbottle svg{height:122px;width:auto;display:block}
.cinfo{flex:1;min-width:0}
.cinfo h3{margin:0;font-size:18px;line-height:1.15;font-weight:800;color:var(--rose);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cinfo p{margin:3px 0 8px;font-size:12.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid rgba(244,214,217,.45);border-radius:10px;padding:3px 8px;font-size:11.5px;font-weight:600;color:var(--rose)}
.chip.st-ok{background:var(--sage);border-color:var(--sage);color:#233b1c}
.chip.st-soon{background:var(--gold);border-color:var(--gold);color:#4a3306}
.chip.st-past{background:#e58a8a;border-color:#e58a8a;color:#4a0e0e}
.chip.st-empty{opacity:.7}
.plus{width:52px;height:52px;border-radius:16px;background:var(--rose2);color:var(--wine);display:grid;place-items:center;flex:none}
.plus svg{width:24px;height:24px}
.plus:active{transform:scale(.94)}
.emptybox{margin:40px 28px;text-align:center;color:var(--muted)}
.emptybox b{display:block;color:var(--ink);font-size:20px;margin-bottom:8px}
.fabwrap{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;pointer-events:none;z-index:10;display:flex;justify-content:flex-end;padding:0 18px calc(18px + var(--safe-b))}
.fab{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--wine);color:var(--rose);border-radius:22px;padding:16px 22px;font-weight:800;font-size:16px;box-shadow:0 10px 24px rgba(107,22,48,.4)}
.fab svg{width:20px;height:20px}

/* ---------- Fiche ---------- */
.detail{position:fixed;left:0;right:0;top:0;bottom:0;max-width:480px;margin:0 auto;background:var(--wine);overflow-y:auto;z-index:20;overscroll-behavior:contain}
.dtop{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-t) + 14px) 14px 6px 14px}
.back{display:flex;align-items:center;gap:4px;color:var(--rose);font-weight:700;font-size:17px;padding:8px 10px}
.back svg{width:20px;height:20px}
.dgrid{display:grid;grid-template-columns:92px 1fr;gap:4px;align-items:start;margin-top:8px}
.strip{background:var(--paper);border-radius:0 30px 30px 0;padding:14px 0 14px 8px;max-height:440px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sitem{flex:none;height:96px;display:flex;align-items:center;justify-content:center;border-radius:28px 0 0 28px}
.sitem svg{height:76px;width:auto;display:block;filter:drop-shadow(0 4px 4px rgba(40,8,18,.25))}
.sitem.on{background:var(--wine)}
.sitem.on svg{height:84px}
.dmain{padding:0 18px 0 10px;color:var(--rose);min-width:0}
.dbottle{height:290px;display:flex;justify-content:center;align-items:center}
.dbottle svg{height:280px;width:auto;transform:rotate(9deg);filter:drop-shadow(0 22px 20px rgba(0,0,0,.4))}
.dmain h2{margin:6px 0 4px;font-size:27px;line-height:1.1;font-weight:800;color:var(--rose)}
.dsub{font-size:14px;opacity:.85;margin-bottom:12px}
.dmain .chips{margin-bottom:14px}
.dmain .desc{font-size:14px;line-height:1.5;opacity:.9;margin:0 0 14px}
.score{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
.score b{font-size:46px;line-height:1;font-weight:800;color:var(--rose)}
.score span{opacity:.75;font-size:14px}
.dpanel{background:var(--paper);border-radius:34px 34px 0 0;margin-top:26px;padding:26px 20px 30px;color:var(--ink);min-height:300px}
.dpanel h4{margin:22px 0 10px;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--wine2)}
.dpanel h4:first-child{margin-top:0}
.dpanel .chips .chip{border-color:#e6cfd2;color:var(--wine)}
.dpanel .chips .chip.hit{background:var(--wine);border-color:var(--wine);color:var(--rose)}
.win{position:relative;height:10px;border-radius:5px;background:#ecd9dc;margin:26px 4px 8px}
.win .seg{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--sage)}
.win .now{position:absolute;top:-6px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--wine);border:4px solid var(--paper);box-shadow:0 0 0 1px var(--wine)}
.winl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--rose2);border-radius:16px;padding:10px 12px}
.kv small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:2px}
.kv b{font-size:15px}
.tcard{background:#fff;border:1.5px solid #f0dde0;border-radius:22px;padding:14px 16px;margin-bottom:12px}
.thead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tscore{font-size:28px;font-weight:800;color:var(--wine)}
.tscore small{font-size:13px;color:var(--muted);font-weight:600}
.tmeta{font-size:12.5px;color:var(--muted)}
.tcard p{margin:8px 0 0;font-size:14px;line-height:1.45}
.tcard .chips{margin-top:8px}
.tdel{color:var(--muted);font-size:12px;margin-top:8px;text-decoration:underline}
.dbar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;padding:14px 18px calc(14px + var(--safe-b));background:linear-gradient(rgba(255,248,243,0),var(--paper) 28%)}
.btn{flex:1;background:var(--wine);color:var(--rose);border-radius:20px;padding:16px 20px;font-weight:800;font-size:16px;text-align:center}
.btn.ghost{background:var(--rose2);color:var(--wine)}
.stepper{display:flex;align-items:center;background:var(--rose2);border-radius:20px;color:var(--wine)}
.stepper button{width:44px;height:52px;font-size:22px;font-weight:800}
.stepper b{min-width:24px;text-align:center}

/* ---------- Feuilles ---------- */
.backdrop{position:fixed;inset:0;background:rgba(30,8,16,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:93dvh;overflow-y:auto;background:var(--cream);border-radius:32px 32px 0 0;z-index:41;transform:translateY(105%);transition:transform .3s;padding:10px 20px 0;overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet:before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:#dcc6ca;margin:0 auto 14px}
.sh{margin:0 0 14px;font-size:24px;font-weight:800;color:var(--wine)}
.form label,.lab{display:block;font-size:12.5px;font-weight:700;color:var(--wine2);margin-bottom:12px}
.form label small{font-weight:500;color:var(--muted)}
.form input,.form select,.form textarea{display:block;width:100%;margin-top:5px;border:0;background:var(--rose2);border-radius:14px;padding:12px 14px;font-weight:500;appearance:none;-webkit-appearance:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:.8fr 1fr 1.3fr;gap:10px}
.typ{background:var(--rose2);border-radius:18px;padding:12px 14px;margin:-2px 0 14px;font-size:13px}
.typ .chips{margin:6px 0}
.typ .chip{border-color:#e6cfd2;color:var(--wine)}
.sbar{position:sticky;bottom:0;display:flex;gap:10px;padding:14px 0 calc(16px + var(--safe-b));background:linear-gradient(rgba(253,244,234,0),var(--cream) 30%)}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--rose2);border-radius:18px;padding:4px;margin-bottom:16px}
.seg2 button{padding:11px;border-radius:14px;font-weight:800;color:var(--wine2)}
.seg2 button.on{background:var(--wine);color:var(--rose)}
.grp{background:#fff;border-radius:22px;padding:14px 16px;margin-bottom:12px}
.gh{display:flex;justify-content:space-between;align-items:baseline}
.gh b{font-size:16px;color:var(--wine)}
.gh span{font-weight:800;color:var(--wine2)}
.hint{margin:4px 0 4px;font-size:12.5px;color:var(--muted);line-height:1.4}
.srow{margin-top:6px}
.srow label{display:flex;justify-content:space-between;margin:6px 0 0;font-size:13.5px;font-weight:600;color:var(--ink)}
.srow label em{font-style:normal;color:var(--muted);font-weight:600}
.srow output{font-weight:800;color:var(--wine2);font-size:13px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:2px 0;padding:0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--c,var(--wine)) var(--p,0%),var(--c2,#ecd5d8) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:7px solid var(--c,var(--wine));margin-top:-10px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:#ecd5d8}
input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:var(--wine)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:7px solid var(--wine)}
.desc3{margin-top:10px;padding-top:6px;border-top:1px dashed #ecd5d8}
.aro{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.fam,.det{border:1.5px solid #ecd5d8;border-radius:12px;padding:7px 11px;font-size:13.5px;font-weight:600;color:var(--wine);background:#fff}
.fam.on,.det.on{background:var(--wine);border-color:var(--wine);color:var(--rose)}
.det{border-style:dashed}
.dets{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;padding:10px;background:var(--rose2);border-radius:14px;width:100%}
.tot{flex:1;display:flex;align-items:baseline;gap:6px;color:var(--wine)}
.tot b{font-size:40px;line-height:1;font-weight:800}
.tot span{font-size:13px;font-weight:700;color:var(--wine2)}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;margin:4px 0 8px}
.chk input{width:22px;height:22px;accent-color:var(--wine)}
textarea{resize:vertical}
.stat4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat4 div{background:var(--wine);color:var(--rose);border-radius:20px;padding:14px 16px}
.stat4 small{display:block;opacity:.75;font-size:12px}
.stat4 b{font-size:26px;font-weight:800}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13.5px}
.bar span:first-child{width:112px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{flex:1;height:10px;border-radius:5px;background:#ecd9dc;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--wine);border-radius:5px}
.bar span:last-child{width:28px;text-align:right;font-weight:800;color:var(--wine)}
.vb{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;margin-bottom:8px}
.vb.v2{background:#e3efe2;color:#2f6b34}.vb.v1{background:#f6e7d3;color:#8a5a14}
.srcb p{margin:0 0 7px;font-size:14px;line-height:1.45}.srcb p.s{margin-left:12px;color:var(--muted)}.srcb .shd{font-weight:700;color:var(--wine2)}
.cross{font-size:13.5px;background:rgba(0,0,0,.04);border-radius:10px;padding:8px 10px;margin:8px 0}
details.est{margin-top:14px}details.est summary{cursor:pointer;font-weight:700;color:var(--wine2);padding:8px 0}
.note a{color:var(--wine2)}
.note{font-size:12.5px;color:var(--muted);line-height:1.45;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,20px);background:#1b0b10;color:#fff;padding:11px 18px;border-radius:16px;font-size:14px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:.25s;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

.qcol{display:flex;flex-direction:column;align-items:center;gap:1px;flex:none}
.qcol b{font-size:24px;line-height:1;font-weight:800;color:var(--rose)}
.qcol small{font-size:10.5px;opacity:.8;margin-bottom:7px}
.qcol .plus{width:46px;height:46px;border-radius:14px}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;font-weight:700;font-size:14px}
.qrow .stepper button{height:42px}
.prof .pb{background:var(--rose2);border-radius:18px;padding:13px 14px;margin-bottom:10px}
.prof .pb>b{display:block;color:var(--wine);font-size:15px;margin-bottom:5px}
.prof .pb p{margin:0 0 8px;font-size:14px;line-height:1.45}
.prof .lvl{margin-top:9px}
.prof .lvl small{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.prof .chip{border-color:#e6cfd2;color:var(--wine);background:#fff}
.prof .kv div{background:#fff}
.fam.ty:after,.det.ty:after,.tdot:after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:7px;vertical-align:middle}
.tdot:after{margin-left:0}
.fam.on.ty:after,.det.on.ty:after{background:var(--gold)}
.aitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:18px;background:#fff;margin-bottom:8px}
.adot{width:14px;height:36px;border-radius:7px;flex:none}
.at{flex:1;min-width:0}
.at b{display:block;font-size:15px;color:var(--ink)}
.at small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aitem .chip{border-color:#e6cfd2;color:var(--wine);flex:none}
.tabs2{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.tabs2 button{padding:8px 14px;border-radius:14px;background:var(--rose2);font-weight:700;color:var(--wine2);white-space:nowrap}
.tabs2 button.on{background:var(--wine);color:var(--rose)}
.fiche{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px}
.fiche .fh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fiche p{margin:7px 0 0;font-size:14px;line-height:1.45}
.fiche .chips{margin-top:8px}
.fiche small{color:var(--muted)}
.felt{background:var(--rose2);border-radius:16px;padding:12px 14px;margin:10px 0}
.felt b{color:var(--wine2)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.sugg button{border:1.5px dashed #e6cfd2;border-radius:12px;padding:5px 10px;font-size:13px;color:var(--wine);background:#fff}
</style>
</head>
<body>
<div id="app">
  <section id="home">
    <div class="hero">
      <div class="topbar">
        <span></span>
        <div class="ic-row">
          <button class="circle" id="btnAoc" aria-label="Appellations"></button>
          <button class="circle" id="btnSearch" aria-label="Rechercher"></button>
          <button class="circle filled" id="btnStats" aria-label="Statistiques"></button>
        </div>
      </div>
      <input id="q" class="search" type="search" placeholder="Domaine, appellation, emplacement…" hidden>
      <h1>Ma cave</h1>
      <div class="hero-sub" id="heroSub"></div>
      <div class="hero-bottle" id="heroBottle"></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </section>
  <div class="fabwrap"><button class="fab" id="fab"></button></div>
  <section class="detail" id="detail" hidden></section>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ============ Utilitaires ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const eur=n=>(Math.round(n*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:2})+' €';
const IC={
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10a3 3 0 013 3v13H8a3 3 0 01-3-3V4z"/><path d="M5 17a3 3 0 013-3h10"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

/* ============ Logique cave ============ */
function status(b){
  if((+b.qty||0)<=0)return{k:'empty',t:'Épuisée'};
  const y=new Date().getFullYear(),f=parseInt(b.from,10),t=parseInt(b.to,10);
  if(!f&&!t)return{k:'na',t:'Fenêtre ?'};
  if(f&&y<f)return{k:'wait',t:'À attendre'};
  if(t&&y>t)return{k:'past',t:'Apogée passée'};
  if(t&&y>=t-1)return{k:'soon',t:'À boire vite'};
  return{k:'ok',t:'À boire'};
}
const titleOf=b=>b.name||b.appellation||b.domaine||'Sans nom';
const subOf=b=>[b.domaine,b.name?b.appellation:''].filter(Boolean).join(' · ');
function sorted(){
  const r={soon:0,ok:1,wait:2,na:3,past:4,empty:5};
  return S.bottles.slice().sort((a,b)=>(r[status(a).k]-r[status(b).k])||titleOf(a).localeCompare(titleOf(b),'fr'));
}
function filtered(){
  let l=sorted();
  if(ST.tab!=='all')l=l.filter(b=>b.color===ST.tab);
  const q=ST.q.trim().toLowerCase();
  if(q)l=l.filter(b=>[b.name,b.domaine,b.appellation,b.region,b.location,b.cepages,b.vintage].join(' ').toLowerCase().includes(q));
  return l;
}
const lastTasting=b=>(b.tastings||[]).slice().sort((x,y)=>String(y.date).localeCompare(String(x.date)))[0];
function typicalMatch(b,t){
  const a=aocOf(b.appellation);if(!a)return null;
  const sel=(t.nez||[]).concat(t.bou||[]);
  if(t.mode==='beg'){
    const fams=Array.from(new Set(typAll(a).map(x=>famOf[x])));
    return{hit:fams.filter(f=>sel.indexOf(f)>-1).length,total:fams.length};
  }
  return{hit:typAll(a).filter(x=>sel.indexOf(x)>-1).length,total:typAll(a).length};
}

function renderHome(){
  const all=S.bottles,qty=all.reduce((a,b)=>a+(+b.qty||0),0);
  const drink=all.filter(b=>{const k=status(b).k;return k==='ok'||k==='soon';}).reduce((a,b)=>a+(+b.qty||0),0);
  $('#heroSub').textContent=qty?qty+' bouteille'+(qty>1?'s':'')+' · '+drink+' à boire maintenant':'Ta cave est vide pour l\'instant';
  const feat=sorted().find(b=>status(b).k==='soon')||sorted().find(b=>status(b).k==='ok')||sorted()[0];
  const hb=$('#heroBottle');
  hb.innerHTML=bottleSVG(feat?feat.color:'R',feat?feat.vintage:'');
  hb.onclick=feat?()=>openDetail(feat.id):null;
  $('#tabs').innerHTML=TABS.map(t=>{
    const n=t[0]==='all'?qty:all.filter(b=>b.color===t[0]).reduce((a,b)=>a+(+b.qty||0),0);
    return '<button class="tab'+(ST.tab===t[0]?' on':'')+'" data-t="'+t[0]+'"><i>'+n+'</i>'+t[1]+'</button>';
  }).join('');
  renderList();
}
function renderList(){
  const l=filtered(),box=$('#list');
  if(!S.bottles.length){
    box.innerHTML='<div class="emptybox"><b>Ta cave est vide</b>Ajoute ta première bouteille avec le bouton en bas à droite.<br><br><button class="btn ghost" id="demo" style="display:inline-block;flex:none">Voir 4 bouteilles d\'exemple</button></div>';
    return;
  }
  if(!l.length){box.innerHTML='<div class="emptybox"><b>Aucun résultat</b>Essaie un autre filtre ou une autre recherche.</div>';return;}

    return '<article class="card'+(s.k==='empty'?' empty':'')+'" data-id="'+b.id+'"><div class="cbottle">'+bottleSVG(b.color,b.vintage)+'</div>'

  }).join('');
}

$('#detail').addEventListener('click',e=>{
  const b=get(ST.open);if(!b)return;
  if(e.target.closest('#dBack'))return closeDetail();
  if(e.target.closest('#dEdit'))return openForm(b.id);
  if(e.target.closest('#dDel')){if(confirm('Supprimer « '+titleOf(b)+' » et ses dégustations ?')){S.bottles=S.bottles.filter(x=>x.id!==b.id);save();closeDetail();toast('Bouteille supprimée');}return;}
  if(e.target.closest('#dTaste'))return openTasting(b.id);
  if(e.target.closest('#dAddFiche')){FR.after=()=>{if(ST.open)renderDetail();};return openFiche(null,{domaine:b.domaine,appellation:b.appellation,cuvee:b.name,vintage:b.vintage});}
  const fe=e.target.closest('[data-fedit]');if(fe){FR.after=()=>{if(ST.open)renderDetail();};return openFiche(fe.dataset.fedit);}
  if(e.target.closest('#qMinus')){b.qty=Math.max(0,(+b.qty||0)-1);save();return renderDetail();}
  if(e.target.closest('#qPlus')){b.qty=(+b.qty||0)+1;save();return renderDetail();}
  const si=e.target.closest('.sitem');if(si&&si.dataset.id!==b.id){ST.open=si.dataset.id;$('#detail').scrollTop=0;return renderDetail();}
  const td=e.target.closest('[data-tdel]');
  if(td&&confirm('Supprimer cette dégustation ?')){b.tastings=(b.tastings||[]).filter(x=>x.id!==td.dataset.tdel);save();renderDetail();}
});

/* ============ Formulaire bouteille ============ */
function openForm(id,preApp){
  const b=id?get(id):null,v=b||{qty:1,color:'R',appellation:preApp||''};
  const doms=Array.from(new Set(S.bottles.map(x=>x.domaine).concat(S.domaines.map(x=>x.domaine),HV.map(x=>x.domaine)).filter(Boolean))).sort();
  const regs=Array.from(new Set(AOC.map(a=>a.region).concat(S.bottles.map(x=>x.region).filter(Boolean)))).sort();
  openSheet('<h3 class="sh">'+(b?'Modifier la bouteille':'Ajouter une bouteille')+'</h3><div class="form">'
  +'<label>Domaine<input id="f-dom" list="dl-dom" value="'+esc(v.domaine)+'" placeholder="Nom du domaine" autocomplete="off"></label>'
  +'<div class="sugg" id="f-known"></div>'
  +'<label>Cuvée ou nom <small>(facultatif)</small><input id="f-name" value="'+esc(v.name)+'" autocomplete="off"></label>'
  +'<label>Appellation<input id="f-app" list="dl-app" value="'+esc(v.appellation)+'" placeholder="Commence à taper : Chablis, Pomerol…" autocomplete="off"></label>'
  +'<div class="typ" id="f-typ" hidden></div>'
  +'<div class="row2"><label>Millésime<input id="f-vin" inputmode="numeric" maxlength="4" value="'+esc(v.vintage)+'" placeholder="2019 (vide = NV)"></label>'
  +'<label>Couleur<select id="f-col">'+Object.keys(CNAME).map(k=>'<option value="'+k+'"'+(v.color===k?' selected':'')+'>'+CNAME[k]+'</option>').join('')+'</select></label></div>'
  +'<div class="row2"><label>Région<input id="f-reg" list="dl-reg" value="'+esc(v.region)+'"></label><label>Cépages<input id="f-cep" value="'+esc(v.cepages)+'"></label></div>'
  +'<div class="row3"><label>Quantité<input id="f-qty" type="number" inputmode="numeric" min="0" value="'+(v.qty==null?1:v.qty)+'"></label><label>Prix (€)<input id="f-prix" inputmode="decimal" value="'+(v.price||'')+'"></label><label>Emplacement <small>(facultatif)</small><input id="f-loc" value="'+esc(v.location)+'" placeholder="Casier A2"></label></div>'
  +'<div class="row2"><label>À boire dès<input id="f-from" inputmode="numeric" maxlength="4" value="'+esc(v.from)+'"></label><label>Jusqu\'à<input id="f-to" inputmode="numeric" maxlength="4" value="'+esc(v.to)+'"></label></div>'
  +'<label>Notes<textarea id="f-notes" rows="3">'+esc(v.notes)+'</textarea></label></div>'
  +'<datalist id="dl-dom">'+doms.map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist>'
  +'<datalist id="dl-app">'+AOC.map(a=>'<option value="'+esc(a.name)+'">').join('')+'</datalist>'
  +'<datalist id="dl-reg">'+regs.map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist>'
  +'<div class="sbar"><button class="btn ghost" data-close>Annuler</button><button class="btn" id="f-save">Enregistrer</button></div>');
  const auto={col:!b,reg:!b,cep:!b,from:!b,to:!b};
  const el={col:$('#f-col'),reg:$('#f-reg'),cep:$('#f-cep'),from:$('#f-from'),to:$('#f-to')};
  Object.keys(el).forEach(k=>el[k].addEventListener('input',()=>{auto[k]=false;}));
  const put=(k,val)=>{if(auto[k]||!el[k].value){el[k].value=val;auto[k]=true;}};
  function refresh(){
    const a=aocOf($('#f-app').value),box=$('#f-typ');
    if(!a){box.hidden=true;return;}
    put('col',a.color);put('reg',a.region);put('cep',a.cepages);
    const vin=parseInt($('#f-vin').value,10);
    if(vin>1900){put('from',String(vin+a.g0));put('to',String(vin+a.g1));}
    box.hidden=false;
    box.innerHTML='<b>Profil typique</b><div class="chips">'+a.aromas.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>Cépages : '+esc(a.cepages)+' · garde habituelle : '+a.g0+' à '+a.g1+' ans après le millésime (fenêtre proposée, à ajuster).';
  }
  $('#f-app').addEventListener('input',refresh);$('#f-app').addEventListener('change',refresh);$('#f-vin').addEventListener('input',refresh);
  let KN=[];
  function known(){
    const d=nrmD($('#f-dom').value),box=$('#f-known');
    KN=d?HV.filter(f=>nrmD(f.domaine)===d).slice(0,12):[];
    box.innerHTML=KN.length?'<small style="width:100%;color:var(--muted)">Cuvées connues du guide (touche pour remplir) :</small>'+KN.map((f,i)=>'<button type="button" data-k="'+i+'">'+esc((f.cuvee||'Cuvée principale')+' '+f.vintage+' · '+f.appellation)+'</button>').join(''):'';
  }
  $('#f-dom').addEventListener('input',known);$('#f-dom').addEventListener('change',known);
  $('#f-known').addEventListener('click',e=>{const k=e.target.closest('[data-k]');if(!k)return;const f=KN[+k.dataset.k];
    $('#f-name').value=f.cuvee;$('#f-app').value=f.appellation;$('#f-vin').value=f.vintage;
    const a=aocOf(f.appellation);$('#f-col').value=f.color;auto.col=false;if(a){auto.reg=true;auto.cep=true;}refresh();});
  known();refresh();
  $('#f-save').addEventListener('click',()=>{
    const g=i=>$('#'+i).value.trim();
    const o={id:b?b.id:uid(),domaine:g('f-dom'),name:g('f-name'),appellation:g('f-app'),vintage:g('f-vin').replace(/\D/g,'').slice(0,4),color:g('f-col'),
      region:g('f-reg'),cepages:g('f-cep'),qty:Math.max(0,parseInt(g('f-qty'),10)||0),price:parseFloat(g('f-prix').replace(',','.'))||0,
      location:g('f-loc'),from:g('f-from').replace(/\D/g,'').slice(0,4),to:g('f-to').replace(/\D/g,'').slice(0,4),notes:g('f-notes'),tastings:b?(b.tastings||[]):[]};
    if(!o.domaine&&!o.name&&!o.appellation){toast('Indique au moins un domaine ou une appellation');return;}
    if(b)S.bottles[S.bottles.indexOf(b)]=o;else S.bottles.push(o);
    save();closeSheet();renderHome();if(ST.open)renderDetail();
    toast(b?'Bouteille modifiée':'Bouteille ajoutée');
  });
}

/* ============ Dégustation ============ */
let T=null;
function sCol(r){return r<=0?null:r<.5?['#c0392b','rgba(192,57,43,.2)']:r<.65?['#e07b1a','rgba(224,123,26,.2)']:r<.8?['#cfae12','rgba(207,174,18,.22)']:['#3f8f4a','rgba(63,143,74,.2)'];}
function sStyle(r){const c=sCol(r);return c?'--c:'+c[0]+';--c2:'+c[1]+';':'';}
function sApply(el,r){const c=sCol(r);if(c){el.style.setProperty('--c',c[0]);el.style.setProperty('--c2',c[1]);}else{el.style.removeProperty('--c');el.style.removeProperty('--c2');}}
function slider(k,max,val){return '<input type="range" min="0" max="'+max+'" step="1" value="'+val+'" data-k="'+k+'" data-max="'+max+'" style="--p:'+(val/max*100)+'%;'+sStyle(val/max)+'">';}
function openTasting(id){
  const b=get(id);if(!b)return;
  T={id:id,mode:'beg',date:new Date().toISOString().slice(0,10),sc:{beg:{},exp:{}},desc:{aci:2,cor:2,tan:2},nez:[],bou:[],open:{nez:null,bou:null},notes:'',drink:(+b.qty||0)>0};
  openSheet('<h3 class="sh">Déguster</h3><div class="note" style="margin-top:-8px">'+esc(titleOf(b))+' · '+esc(b.vintage||'NV')+'</div>'
  +'<div class="seg2" id="tmode"><button data-m="beg" class="on">Débutant</button><button data-m="exp">Expert</button></div>'
  +'<label class="lab">Date<input type="date" id="t-date" value="'+T.date+'" style="display:block;width:100%;margin-top:5px;border:0;background:var(--rose2);border-radius:14px;padding:12px 14px"></label>'
  +'<div id="tbody"></div>'
  +'<div class="grp"><div class="gh"><b>Mes notes</b></div><textarea id="t-notes" rows="3" placeholder="Occasion, accord mets-vins, ressenti…" style="width:100%;margin-top:8px;border:0;background:var(--rose2);border-radius:14px;padding:12px 14px"></textarea></div>'
  +((+b.qty||0)>0?'<label class="chk"><input type="checkbox" id="t-drink" checked>Retirer 1 bouteille de la cave</label>':'')
  +'<div class="sbar"><div class="tot"><b id="tTot">0</b><span id="tLab">/100</span></div><button class="btn" id="t-save" style="flex:none">Enregistrer</button></div>');
  renderTBody();
  $('#tmode').addEventListener('click',e=>{const m=e.target.closest('button');if(!m)return;T.mode=m.dataset.m;$$('#tmode button').forEach(x=>x.classList.toggle('on',x===m));T.open={nez:null,bou:null};renderTBody();});
  $('#tbody').addEventListener('input',e=>{
    const r=e.target;if(r.type!=='range')return;
    const k=r.dataset.k;r.style.setProperty('--p',(r.value/r.dataset.max*100)+'%');sApply(r,r.value/r.dataset.max);
    if(k.indexOf('d_')===0){T.desc[k.slice(2)]=+r.value;const o=r.parentNode.querySelector('output');if(o)o.textContent=r.value+'/5';return;}
    T.sc[T.mode][k]=+r.value;
    const o=r.parentNode.querySelector('output');if(o){o.textContent=r.value+'/'+r.dataset.max;const cc=sCol(r.value/r.dataset.max);o.style.color=cc?cc[0]:'';}
    updTot();
  });
  $('#tbody').addEventListener('click',e=>{
    const f=e.target.closest('.fam'),d=e.target.closest('.det');
    if(f){
      const w=f.dataset.w,fam=f.dataset.f;
      if(T.mode==='beg'){const i=T[w].indexOf(fam);if(i>-1)T[w].splice(i,1);else T[w].push(fam);}
      else T.open[w]=(T.open[w]===fam?null:fam);
      renderAro(w);return;
    }
    if(d){const w=d.dataset.w,x=d.dataset.d,i=T[w].indexOf(x);if(i>-1)T[w].splice(i,1);else T[w].push(x);renderAro(w);}
  });
  $('#t-save').addEventListener('click',()=>{
    const b=get(T.id);if(!b)return;
    const total=calc(T.mode,T.sc[T.mode]);
    if(total<=0){toast('Déplace au moins un curseur pour noter');return;}
    const t={id:uid(),date:$('#t-date').value||T.date,mode:T.mode,scores:Object.assign({},T.sc[T.mode]),total:total,
      desc:T.mode==='beg'?Object.assign({},T.desc):null,nez:T.nez.slice(),bou:T.bou.slice(),notes:$('#t-notes').value.trim()};
    b.tastings=(b.tastings||[]).concat(t);
    const dr=$('#t-drink');if(dr&&dr.checked)b.qty=Math.max(0,(+b.qty||0)-1);
    save();closeSheet();renderHome();renderDetail();toast('Dégustation enregistrée : '+total+'/100');
  });
}
function renderTBody(){
  const m=T.mode,sc=T.sc[m];let h='';
  if(m==='beg'){
    h=BEG.map(c=>'<div class="grp"><div class="gh"><b>'+c.t+'</b><output style="font-weight:800;color:var(--wine2)">'+(sc[c.id]||0)+'/'+c.max+'</output></div><p class="hint">'+c.h+'</p>'+slider(c.id,c.max,sc[c.id]||0)
      +(c.id==='bou'?'<div class="desc3"><p class="hint"><b>Pour décrire (non noté)</b></p>'+DESC3.map(x=>'<div class="srow"><label>'+x[1]+' <output>'+T.desc[x[0]]+'/5</output></label><p class="hint" style="margin:0">'+x[2]+'</p>'+slider('d_'+x[0],5,T.desc[x[0]])+'</div>').join('')+'</div>':'')+'</div>').join('');
  }else{
    h=EXP.map(g=>'<div class="grp"><div class="gh"><b>'+g.t+'</b><span style="font-weight:800;color:var(--wine2)">'+g.items.reduce((a,i)=>a+i[2],0)+' pts</span></div>'
      +g.items.map(i=>'<div class="srow"><label>'+i[1]+' <output>'+(sc[i[0]]||0)+'/'+i[2]+'</output></label>'+slider(i[0],i[2],sc[i[0]]||0)+'</div>').join('')+'</div>').join('');
  }
  h+='<div class="grp"><div class="gh"><b>Arômes au nez</b></div><p class="hint">'+(m==='beg'?'Touche les familles que tu reconnais.':'Touche une famille, puis précise les arômes.')+(aocOf((get(T.id)||{}).appellation)?' <span class="tdot"></span> = arôme typique de l\'appellation.':'')+'</p><div class="aro" id="aro-nez"></div></div>'
    +'<div class="grp"><div class="gh"><b>Arômes en bouche</b></div><p class="hint">Ce que tu retrouves au goût, y compris au retour en bouche.</p><div class="aro" id="aro-bou"></div></div>';
  $('#tbody').innerHTML=h;renderAro('nez');renderAro('bou');updTot();
}
function renderAro(w){
  const sel=T[w],m=T.mode;let h='';
  const ta=aocOf((get(T.id)||{}).appellation),tl=ta?(w==='nez'?ta.aromas:ta.ar.bo):[],tf=tl.map(x=>famOf[x]);
  WHEEL.forEach(x=>{
    const on=m==='beg'?sel.indexOf(x[0])>-1:x[1].some(d=>sel.indexOf(d)>-1)||T.open[w]===x[0];
    h+='<button type="button" class="fam'+(on?' on':'')+((m==='beg'?tf.indexOf(x[0])>-1:x[1].some(d=>tl.indexOf(d)>-1))?' ty':'')+'" data-w="'+w+'" data-f="'+esc(x[0])+'">'+esc(x[0])+'</button>';
    if(m==='exp'&&T.open[w]===x[0])h+='<div class="dets">'+x[1].map(d=>'<button type="button" class="det'+(sel.indexOf(d)>-1?' on':'')+(tl.indexOf(d)>-1?' ty':'')+'" data-w="'+w+'" data-d="'+esc(d)+'">'+esc(d)+'</button>').join('')+'</div>';
  });
  $('#aro-'+w).innerHTML=h;
}
function updTot(){const t=calc(T.mode,T.sc[T.mode]);$('#tTot').textContent=t;const tc=sCol(t/100);$('#tTot').style.color=tc?tc[0]:'';$('#tLab').textContent='/100 · '+label(t);}

/* ============ Statistiques & sauvegarde ============ */
function bars(map){
  const e=Object.keys(map).map(k=>[k,map[k]]).sort((a,b)=>b[1]-a[1]),mx=e.length?e[0][1]:1;
  return e.length?e.map(x=>'<div class="bar"><span>'+esc(x[0])+'</span><span class="tr"><i style="width:'+(x[1]/mx*100)+'%"></i></span><span>'+x[1]+'</span></div>').join(''):'<p class="note">Rien à afficher.</p>';
}
function openStats(){
  const B=S.bottles,q=b=>+b.qty||0,qty=B.reduce((a,b)=>a+q(b),0);
  const val=B.reduce((a,b)=>a+q(b)*(+b.price||0),0);
  const drink=B.filter(b=>{const k=status(b).k;return k==='ok'||k==='soon';}).reduce((a,b)=>a+q(b),0);
  const reg={},col={};B.forEach(b=>{const r=b.region||'Autre';reg[r]=(reg[r]||0)+q(b);col[CNAME[b.color]]=(col[CNAME[b.color]]||0)+q(b);});
  const top=B.map(b=>({b:b,t:lastTasting(b)})).filter(x=>x.t).sort((a,b)=>b.t.total-a.t.total).slice(0,3);
  openSheet('<h3 class="sh">Ma cave en chiffres</h3>'
  +'<div class="stat4"><div><small>Bouteilles</small><b>'+qty+'</b></div><div><small>Références</small><b>'+B.length+'</b></div><div><small>Valeur estimée</small><b>'+eur(val)+'</b></div><div><small>À boire maintenant</small><b>'+drink+'</b></div></div>'
  +'<div class="grp"><div class="gh"><b>Par couleur</b></div>'+bars(col)+'</div>'
  +'<div class="grp"><div class="gh"><b>Par région</b></div>'+bars(reg)+'</div>'
  +(top.length?'<div class="grp"><div class="gh"><b>Mes mieux notées</b></div>'+top.map(x=>'<div class="bar"><span style="width:auto;flex:1">'+esc(titleOf(x.b))+'</span><span style="width:auto">'+x.t.total+'/100</span></div>').join('')+'</div>':'')
  +'<div class="grp"><div class="gh"><b>Sauvegarde</b></div><p class="note">Tes données restent sur ton iPhone. iOS peut parfois vider le stockage d\'un site : exporte ta cave de temps en temps et garde le fichier dans Fichiers.</p>'
  +'<div style="display:flex;gap:10px"><button class="btn" id="sExp">Exporter</button><button class="btn ghost" id="sImp">Importer</button></div><input type="file" id="sFile" accept="application/json,.json" hidden></div>'
  +'<div class="sbar"><button class="btn ghost" data-close>Fermer</button></div>');
  $('#sExp').addEventListener('click',exportData);
  $('#sImp').addEventListener('click',()=>$('#sFile').click());
  $('#sFile').addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const p=JSON.parse(r.result);if(!p||!Array.isArray(p.bottles))throw 0;
        if(confirm('Remplacer la cave actuelle par la sauvegarde ('+p.bottles.length+' références) ?')){S=p;if(!Array.isArray(S.domaines))S.domaines=[];save();closeSheet();renderHome();toast('Sauvegarde importée');}
      }catch(err){toast('Fichier non reconnu');}
    };
    r.readAsText(f);
  });
}
async function exportData(){
  const blob=new Blob([JSON.stringify({v:1,date:new Date().toISOString(),bottles:S.bottles},null,1)],{type:'application/json'});
  try{
    const file=new File([blob],'cave-sauvegarde.json',{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Sauvegarde de ma cave'});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cave-sauvegarde.json';document.body.appendChild(a);a.click();a.remove();
}

/* ============ Profil détaillé & base d'appellations ============ */
function typAll(a){return Array.from(new Set(a.aromas.concat(a.ar.bo)));}
const LV=[['Arômes primaires (le raisin)',['Fruits rouges','Fruits noirs','Agrumes','Fruits blancs','Fruits exotiques','Floral','Végétal','Minéral','Épicé']],
  ['Arômes secondaires (fermentation, élevage)',['Beurré et brioché','Boisé']],
  ['Arômes tertiaires (vieillissement)',['Torréfié','Sous-bois et animal','Fruits secs et miel']]];
const chipsH=l=>'<div class="chips">'+l.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>';
function structBars(sv){
  return [['Acidité',sv[0]],['Tanins',sv[1]],['Corps',sv[2]],['Alcool',sv[3]],['Sucrosité',sv[4]]].filter(r=>r[1]>0)
    .map(r=>'<div class="bar"><span>'+r[0]+'</span><span class="tr"><i style="width:'+(r[1]/5*100)+'%"></i></span><span>'+r[1]+'/5</span></div>').join('');
}
const VER={"PG":{"513":{"h":"<p><b>Couleurs produites :<\/b> blanc, rouge et rosé.<\/p><p><b>Cépages :<\/b> pinot (noir) et sauvignon.<\/p><p><b>Robe :<\/b><\/p><p><b>Blanc :<\/b> or pâle.<\/p><p><b>Rouge :<\/b> rubis vif.<\/p><p><b>Rosé :<\/b> tire vers le gris.<\/p><p><b>Nez (arômes) :<\/b><\/p><p><b>Blanc :<\/b> agrumes (orange, pamplemousse, citron), menthe, fougère, acacia. Sur les terres calcaires, notes tubéreuses ou de narcisse ; sur les sols à silex, notes de genêt ou de pierre à fusil.<\/p><p><b>Rouge :<\/b> griotte, cerise, venaison. Certains vignerons l'élèvent en fût de chêne.<\/p><p><b>Rosé :<\/b> pêche, discrète.<\/p><p><b>Bouche :<\/b><\/p><p><b>Blanc :<\/b> orange, fleur d'oranger, coing, cassis, pomme, menthe, miel, épices. Le style varie selon le terroir : plutôt charpenté sur terres argilo-calcaires, léger et élégant sur les caillottes, ferme et structuré sur les sols à silex.<\/p><p><b>Rouge :<\/b> structure souple, tanins fondus, cerise et violette en rétro-olfaction.<\/p><p><b>Rosé :<\/b> frais et fruité.<\/p><p><b>Potentiel de garde :<\/b> 1 à 5 ans (indication générale, sans distinction par couleur).<\/p><p><b>Température de service :<\/b><\/p><p><b>Blanc :<\/b> 12 °C<\/p><p><b>Rosé :<\/b> 12 °C<\/p><p><b>Rouge :<\/b> 14 °C<\/p><p><b>Accords mets-vins :<\/b> volaille, fromages (crottin de Chavignol, Salers), charcuterie, entrées, fruits de mer, poisson en sauce (brochet). La page ne précise pas l'association à une couleur en particulier.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/513/sancerre"},"12":{"h":"<p><b>Couleurs produites :<\/b> rouge uniquement.<\/p><p><b>Cépages :<\/b> cabernet franc, cabernet-sauvignon et merlot. Le cabernet-sauvignon domine l'assemblage, ce que traduit le bouquet.<\/p><p><b>Robe :<\/b> dense et profonde, allant du rubis foncé au grenat, avec parfois des reflets rouge sombre.<\/p><p><b>Nez (arômes) :<\/b> cerise griotte et petits fruits rouges, auxquels s'ajoutent des notes de fumée, de vanille et de cuir. Le cassis rappelle le cabernet-sauvignon. L'élevage apporte torréfaction, épices, réglisse et vanille.<\/p><p><b>Bouche :<\/b> corsée, puissante et charpentée. Jeune, le vin présente des tanins fermes. Avec le temps, les tanins s'arrondissent et le vin gagne en finesse tout en gardant sa puissance.<\/p><p><b>Potentiel de garde :<\/b> 10 à 20 ans, davantage pour certains crus et les grands millésimes.<\/p><p><b>Température de service :<\/b> 17 à 18 °C pour le rouge.<\/p><p><b>Accords mets-vins :<\/b> fricassée de champignons, viande rouge, gibier et gigot d'agneau. La page cite aussi les poissons fins comme accord possible, ainsi que le gigot d'agneau rôti et les tournedos au beurre de truffe dans ses recettes liées à l'appellation.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/12/pauillac"},"18":{"h":"<p><b>Couleurs produites :<\/b> blanc (liquoreux)<\/p><p><b>Cépages :<\/b> Muscadelle, Sauvignon et Sémillon<\/p><p><b>Robe :<\/b> or vieux, virant à l'ambré, puis à une teinte thé avec les décennies<\/p><p><b>Nez :<\/b> note rôtie apportée par le botrytis, amande, coing, agrumes, prunelle, abricot et pêche<\/p><p><b>Bouche :<\/b> ample, grasse, onctueuse et puissante, avec des notes confites et rôties, du miel, de la cire d'abeille, des fleurs blanches et des fruits blancs ou jaunes. Les notes grillées de barrique apportent de l'élégance aux plus grands.<\/p><p><b>Potentiel de garde :<\/b> 20 ans et plus, jusqu'à 100 ans pour les plus grands crus<\/p><p><b>Température de service :<\/b> 8 à 9 °C<\/p><p><b>Accords mets-vins :<\/b> foie gras (en terrine ou poêlé), poulet rôti, viandes blanches à la crème, canard aux pêches, poissons fins à la crème, roquefort, et desserts comme la salade de fruits, la charlotte aux pommes ou la tarte à l'ananas<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/18/sauternes"},"19":{"h":"<p><b>Couleurs produites :<\/b> rouge uniquement (vins tranquilles).<\/p><p><b>Cépages :<\/b> cabernet franc, cabernet-sauvignon, merlot et petit verdot.<\/p><p><b>Robe :<\/b> teinte intense, entre rubis carminé et pourpre, avec des reflets sombres. Elle évolue vers des rouges profonds avec le temps.<\/p><p><b>Nez :<\/b> bouquet riche et soutenu. Le cabernet apporte des fruits mûrs, comme le \"fruits mûrs (cassis)\". Le merlot ajoute des notes florales de violette. L'élevage en bois neuf apporte des arômes de torréfaction, d'épices et de réglisse.<\/p><p><b>Bouche :<\/b> structure puissante et grande longueur. Après une dizaine d'années de garde, le vin développe un bouquet complexe et des tanins fondus, pour un bel équilibre.<\/p><p><b>Potentiel de garde :<\/b> 10 à 20 ans, davantage pour certains crus et les grands millésimes.<\/p><p><b>Température de service :<\/b> 17 à 18 °C pour le rouge.<\/p><p><b>Accords mets-vins :<\/b> civet de lièvre et gibier à plumes, comme le faisan ou le pigeon aux petits pois.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/19/saint-estephe"},"22":{"h":"<p><b>Couleurs produites<\/b> : blanc, rosé et rouge.<\/p><p><b>Cépages<\/b> : le chardonnay (pour le blanc) et le pinot noir (pour le rouge et le rosé) sont les principaux. La page cite aussi le gamay pour certaines appellations régionales voisines.<\/p><p><b>Robe<\/b><\/p><p><i>Rouge<\/i> : pourpre quand il est jeune, puis rubis plus profond en vieillissant, avec des reflets vifs et brillants.<\/p><p><i>Rosé<\/i> : rose vif, assez intense.<\/p><p><i>Blanc<\/i> : limpide et cristallin, jaune doré légèrement vert.<\/p><p><b>Nez (arômes)<\/b><\/p><p><i>Rouge<\/i> : fruits rouges et noirs (fraise, cerise, cassis, myrtille), puis fruits cuits ou confits avec l'âge. Notes épicées, réglissées, animales, boisées et de cuir.<\/p><p><i>Rosé<\/i> : fraise des bois, groseille et fruits exotiques.<\/p><p><i>Blanc<\/i> : fleurs blanches, champignon, amande, noisette, épices, beurre, toast et parfois miel.<\/p><p><b>Bouche<\/b><\/p><p><i>Rouge<\/i> : vivant et structuré, souple et rond, avec des tanins et un fruit qui s'équilibrent. Il gagne en volume après quatre à cinq ans.<\/p><p><i>Rosé<\/i> : vif et fruité.<\/p><p><i>Blanc<\/i> : ample sans être lourd, fin, aromatique et fruité, peu charpenté, avec une bonne persistance pour les bouteilles de qualité.<\/p><p><b>Potentiel de garde<\/b> : 2 à 5 ans pour le rouge et le blanc, et à boire jeune pour le rosé. Le texte indique aussi qu'un rouge peut tenir huit à dix ans, voire davantage.<\/p><p><b>Température de service<\/b><\/p><p>Blanc : 10 à 12 °C<\/p><p>Rosé : 10 à 12 °C<\/p><p>Rouge : 12 à 14 °C<\/p><p><b>Accords mets-vins<\/b> : viandes rouges (pavé de charolais, entrecôte forestière), canard au poivre vert, gibier, andouillette, fromages (époisses, soumaintrain, camembert), salade tiède de rougets, tourte chaude, poisson fin, crustacés, volaille et viandes blanches. La page ne précise pas d'accords par couleur.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/22/bourgogne"},"28":{"h":"<p><b>Couleurs produites :<\/b> blanc, rosé et rouge.<\/p><p><b>Cépages :<\/b> cinsault, clairette, grenache (noir et blanc), mourvèdre, roussanne (aussi appelée bergeron), shiraz et syrah.<\/p><p><b>Robe :<\/b> rouge rubis quand il est jeune, qui fonce avec le vieillissement ; rosé d'un rose soutenu ; blanc or pâle à reflets verts.<\/p><p><b>Nez :<\/b> rouges aux arômes de fruits rouges (cassis, cerise) dès le jeune âge, puis de fruits cuits ou confits (figue) avec la garde, ainsi que des notes épicées, de garrigue, fumées, parfois de cuir et de gibier. Rosés aux agrumes, surtout le pamplemousse. Blancs floraux (acacia, genêt) avec une touche d'agrume.<\/p><p><b>Bouche :<\/b> rouges puissants et riches mais fins, à la trame tannique qui permet la garde. Rosés parfumés, marqués par le terroir et la garrigue. Blancs gras, frais et persistants.<\/p><p><b>Potentiel de garde :<\/b> rouges de 3 à 10 ans ; blancs et rosés de 1 à 2 ans.<\/p><p><b>Température de service :<\/b> blanc et rosé de 8 à 10 °C ; rouge de 14 à 16 °C.<\/p><p><b>Accords mets-vins :<\/b> agneau, viandes rouges grillées, poisson et charcuterie.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/28/vacqueyras"},"30":{"h":"<p><b>Couleurs produites :<\/b> rouge uniquement.<\/p><p><b>Cépages :<\/b> cabernet franc, cabernet-sauvignon, côt (malbec), merlot et petit verdot.<\/p><p><b>Robe :<\/b> d'un rubis foncé dans sa jeunesse, qui reste profonde pendant longtemps et paraît presque noire après 10 à 12 ans.<\/p><p><b>Nez :<\/b> bouquet complexe mêlant violette, fruits noirs (myrtille, mûre, griotte, pruneau), tabac brun, cacao, vanille et caramel. Avec l'âge, il développe des notes de gibier, de truffe et de cuir.<\/p><p><b>Bouche :<\/b> riche, charnue et élégante. Les tanins fermes et puissants assurent la garde, et le boisé de qualité adoucit l'ensemble. Avec le temps, la trame devient plus délicate et enveloppée, avec une charpente tannique toujours présente mais sans agressivité.<\/p><p><b>Potentiel de garde :<\/b> 10 à 20 ans, davantage pour certains crus et les grands millésimes.<\/p><p><b>Température de service :<\/b> 17 à 18 °C pour les rouges.<\/p><p><b>Accords mets-vins :<\/b> viandes rouges ou blanches, volailles, gibier à plumes et fromages.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/30/saint-julien"},"558":{"h":"<p><b>Couleurs :<\/b> rouge et rosé. Les vins blancs ne sont pas admis dans l'appellation.<\/p><p><b>Cépages :<\/b> les principaux sont la syrah, le grenache et le mourvèdre. Les cépages accessoires sont le carignan, le cinsault, la counoise et le morrastel, auxquels s'ajoute le grenache gris pour les rosés. Rouges et rosés doivent associer au moins deux cépages, la syrah étant majoritaire (au moins 50 % pour les rouges, 30 % pour les rosés).<\/p><p><b>Robe :<\/b> rouge sombre et dense, avec des reflets violets dans les jeunes vins. Rosé le plus souvent rose tendre, mais la teinte varie selon la vinification.<\/p><p><b>Nez :<\/b> rouge à dominante de fruits noirs (myrtille, cassis), avec réglisse, violette, épices et garrigue, et parfois des notes vanillées ou toastées si le vin a été élevé en barrique. Rosé à dominante de petits fruits rouges, avec parfois des notes florales, d'agrumes et épicées.<\/p><p><b>Bouche :<\/b> rouge ronde et généreuse, portée par des tanins denses et fins et une fraîcheur qui allonge la finale, parfois un peu ferme en finale sans être astringente. Rosé tonique et fruité : la syrah apporte la fraîcheur, le grenache la rondeur, le mourvèdre la force épicée et le cinsault la délicatesse.<\/p><p><b>Potentiel de garde :<\/b> rouge de 4 à 8 ans ; rosé à boire dans l'année.<\/p><p><b>Température de service :<\/b> absent (le titre de cette rubrique figure sur la page, mais aucune information n'y est donnée).<\/p><p><b>Accords mets-vins :<\/b> pour les rouges, viandes rouges et gibier rôtis (gigot, pièce de bœuf) ou en sauce, civets et daubes. Pour les rosés, légumes farcis, ratatouille, pizzas, calamars farcis, poissons et gambas à la plancha, grillades et brochettes.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/558/pic-saint-loup"},"2611":{"h":"<p class=\"shd\">Mondeuse<\/p><p><b>Couleur :<\/b> rouge.<\/p><p><b>Cépage :<\/b> mondeuse, qui était majoritaire dans la région avant la crise phylloxérique.<\/p><p><b>Robe :<\/b> pourpre. Les vins les plus typés, issus d'Arbin, montrent des reflets cerise noire.<\/p><p><b>Nez :<\/b> fraise, framboise et cassis. Les expressions florales (violette, iris) et épicées se développent avec le vieillissement.<\/p><p><b>Bouche :<\/b> tanins soyeux et arômes intenses en rétro-olfaction.<\/p><p><b>Potentiel de garde :<\/b> 2 à 6 ans pour les rouges de l'appellation. La page ne le précise pas pour la mondeuse seule.<\/p><p><b>Température de service :<\/b> 16 à 18 °C.<\/p><p><b>Accords mets-vins :<\/b> les fiches de la sélection citent un tournedos Rossini, un gâteau au chocolat (Arbin Le Coq), un civet de biche aux airelles (Cave de Cruet), ainsi que viandes en sauce, daube et civet (Domaine du Vieux Pressoir). La page propose aussi une recette de bruschetta à la figue rôtie et à la mondeuse.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/261/savoie-vin-de"},"55":{"h":"<p><b>Couleurs produites :<\/b> rouge uniquement.<\/p><p><b>Cépages principaux :<\/b> cabernet franc, cabernet-sauvignon et merlot.<\/p><p><b>Robe :<\/b> teinte intense, rubis à grenat chez les jeunes vins, qui gardent leur couleur longtemps en vieillissant.<\/p><p><b>Nez :<\/b> dès la jeunesse, fruits rouges comme la cerise et la groseille, avec des touches épicées (cannelle) et de torréfaction. Avec l'âge, apparaissent des notes de sous-bois, de champignon et de clou de girofle.<\/p><p><b>Bouche :<\/b> vin riche, ample et bien charpenté, souple et complexe, à la finale fine et persistante. Les tanins s'arrondissent avec le temps pour donner une texture chaleureuse et suave.<\/p><p><b>Potentiel de garde :<\/b> 10 à 20 ans, davantage pour certains crus et les grands millésimes.<\/p><p><b>Température de service (rouge) :<\/b> 17 à 18 °C.<\/p><p><b>Accords mets-vins :<\/b> viandes rouges et blanches, volaille, gibier et fromages.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/55/margaux"},"93":{"h":"<p><b>Couleurs produites :<\/b> Blanc uniquement. La page indique que l'appellation ne produit que des vins blancs tranquilles. Certains produits affichés dans la section « Vins de Alsace riesling » sont en réalité des gewurztraminer, pinot gris ou pinot noir, ce qui contredit cette information.<\/p><p><b>Cépages :<\/b> Riesling, cépage principal de l'appellation.<\/p><p><b>Robe :<\/b> Limpide et brillante, de couleur jaune. Elle tire vers le vert dans la jeunesse et devient plus dorée avec la maturité.<\/p><p><b>Nez (arômes) :<\/b> Arômes floraux et terpéniques, parfois proches de la fleur de pêcher ou du tilleul. Avec le vieillissement, le vin développe des notes minérales.<\/p><p><b>Bouche :<\/b> Vive, avec une acidité équilibrée liée à la maturation tardive du raisin. Lorsque le rendement est bien maîtrisé, le vin est puissant, bien structuré et persistant.<\/p><p><b>Potentiel de garde :<\/b> 2 à 10 ans.<\/p><p><b>Température de service :<\/b> 8 à 10 °C.<\/p><p><b>Accords mets-vins :<\/b> Fruits de mer, terrine de poisson, saint-pierre à l'oseille, truite au bleu, faisan au chou, coq au riesling, civet de lièvre, gratin dauphinois et gâteau aux noix.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/93/alsace-riesling"},"95":{"h":"<p><b>Couleurs produites :<\/b> blanc uniquement.<\/p><p><b>Cépages :<\/b> gewurztraminer, cépage principal de l'appellation.<\/p><p><b>Robe :<\/b> intense, avec une teinte rosée liée à la pigmentation des baies du cépage.<\/p><p><b>Nez (arômes) :<\/b> puissants, avec des notes florales (rose) et de fruits exotiques (litchi).<\/p><p><b>Bouche :<\/b> vins corsés, souvent très alcoolisés (jusqu'à environ 14 % vol. et plus) avec une acidité assez faible. On y trouve des arômes de muscat, de fruits exotiques, parfois de réglisse ou de fumé. Avec le temps, le vin peut prendre des accents de cuir. Il est généralement puissant, ample, structuré et onctueux.<\/p><p><b>Potentiel de garde :<\/b> 2 à 10 ans.<\/p><p><b>Température de service :<\/b> 10 à 12 °C.<\/p><p><b>Accords mets-vins :<\/b> apéritif, foie gras, fromages (munster, livarot, roquefort), kouglof et tarte aux fruits.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/95/alsace-gewurztraminer"},"96":{"h":"<p><b>Couleurs produites<\/b> : blanc uniquement.<\/p><p><b>Cépages<\/b> : pinot gris, le cépage principal de cette appellation.<\/p><p><b>Robe<\/b> : jaune au début, avec des reflets verts dans la jeunesse du vin, qui évolue vers une teinte dorée.<\/p><p><b>Nez<\/b> : après quelques années de bouteille, il développe des arômes de vieillissement (notes fumées, sous-bois, champignon, miel concentré) qui passent devant les arômes primaires du cépage.<\/p><p><b>Bouche<\/b> : puissante et opulente. L'acidité s'estompe derrière l'alcool et le sucre, mais la douceur reste équilibrée par une structure étoffée, ce qui donne une persistance remarquable.<\/p><p><b>Potentiel de garde<\/b> : 3 à 10 ans.<\/p><p><b>Température de service<\/b> : 10 à 14 °C.<\/p><p><b>Accords mets-vins<\/b> : asperges, choucroute, poisson de rivière, volaille (oie, chapon) et fromage (munster).<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/96/alsace-pinot-gris"},"97":{"h":"<p><b>Couleurs produites :<\/b> rosé et rouge.<\/p><p><b>Cépages :<\/b> pinot noir, présenté comme le principal cépage de l'appellation.<\/p><p><b>Robe :<\/b> du rosé clair au rouge grenat soutenu. La production classique est rubis à intensité moyenne et tend vers des teintes tuilées, légèrement orangées, avec l'âge.<\/p><p><b>Nez :<\/b> petits fruits rouges, avec des notes de cassis et de framboise. Les vins élevés en foudre ou en fût ajoutent une touche boisée ou vanillée. Avec le vieillissement, apparaissent des arômes de sous-bois et des nuances animales.<\/p><p><b>Bouche :<\/b> peu coloré, le pinot noir gagne des tanins grâce à la macération, d'où une belle structure, une grande persistance et une bonne aptitude au vieillissement.<\/p><p><b>Potentiel de garde :<\/b> rouge de 2 à 10 ans ; rosé à boire jeune.<\/p><p><b>Température de service :<\/b> rosé entre 8 et 10 °C ; rouge entre 10 et 14 °C.<\/p><p><b>Accords mets-vins :<\/b> grillades, palette de porc fumée, baeckeoffe et fromages (comté, brie, gruyère, cantal). La page cite aussi d'autres plats (coq au vin, civet de lapin, truite au vin rouge, rillettes de porc, pâté en croûte, etc.), mais les fiches recettes affichent un texte de remplissage, donc leur contenu n'est pas fiable.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/97/alsace-pinot-noir"},"100":{"h":"<p><b>Couleurs produites :<\/b> rouge, blanc et rosé.<\/p><p><b>Cépages :<\/b> principalement le gamay (noir, vinifié en grains entiers) et le chardonnay (blanc).<\/p><p><b>Robe :<\/b> un beaujolais idéal est « rouge vif, intense, limpide et brillant », aux nuances allant du pourpre au rubis, parfois grenat. Des reflets violets signalent la jeunesse.<\/p><p><b>Nez :<\/b> fruité intense, dominé par la framboise, le cassis, la groseille et la fraise. Les vins plus subtils montrent des touches florales et végétales. Les beaujolais nouveaux présentent des notes de banane mûre et de bonbon anglais.<\/p><p><b>Bouche :<\/b> arômes fruités, persistants dans les meilleures bouteilles. Le vin est généralement vif et tendre, parfois charnu. Sa durée de vie est courte. Les primeurs se consomment dans les trois mois suivant la récolte, et avant la fin du printemps suivant.<\/p><p><b>Potentiel de garde :<\/b> 1 à 2 ans.<\/p><p><b>Température de service :<\/b> absent (le titre de la section figure sur la page, mais aucun contenu n'y est associé).<\/p><p><b>Accords mets-vins :<\/b> la page cite des plats associés au beaujolais, sans description détaillée (les textes des recettes sont des espaces réservés) : andouillette grillée, chou farci à l'agneau, crumble aux framboises, feuilleté aux épinards et au chèvre, hachis parmentier, jambon cru, œufs en meurette et risotto aux champignons.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/100/beaujolais"},"101":{"h":"<p><b>Couleurs produites :<\/b> blanc, rosé et rouge.<\/p><p><b>Cépages :<\/b> gamay (principal, pour les rouges) ; chardonnay pour les rares blancs.<\/p><p><b>Robe :<\/b> claire pour les vins issus de sables granitiques et vinifiés en primeur ; plus sombre pour ceux de vieilles vignes sur sols schisteux, vinifiés plus longuement.<\/p><p><b>Nez :<\/b> fruits rouges et fleurs des champs, selon l'origine. Cassis, fraise des bois et framboise sont fréquents, parfois banane. Les terroirs élevés donnent des notes florales comme le genêt ou la violette.<\/p><p><b>Bouche :<\/b> souplesse, finesse et fruité. Peu tanniques et peu acides, avec une bonne persistance aromatique.<\/p><p><b>Potentiel de garde :<\/b> rouge de 2 à 4 ans ; blanc et rosé de 1 à 2 ans.<\/p><p><b>Température de service :<\/b> 10 °C pour le blanc et le rosé, 13 °C pour le rouge.<\/p><p><b>Accords mets-vins :<\/b> charcuterie, gratin et viande blanche.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/101/beaujolais-villages"},"102":{"h":"<p><b>Couleurs produites :<\/b> rouge uniquement.<\/p><p><b>Cépages :<\/b> gamay, cépage principal de l'appellation.<\/p><p><b>Robe :<\/b> rouge rubis, plus violacée sur les terroirs granitiques (La Chaize, Saburin) et plus sombre dans la partie est (Pierreux, Buisantes).<\/p><p><b>Nez :<\/b> arômes fruités, où dominent la fraise et la framboise.<\/p><p><b>Bouche :<\/b> souple, charnue et fine. Son origine granitique la rend précoce, avec un plaisir de dégustation possible dès le printemps suivant la récolte.<\/p><p><b>Potentiel de garde :<\/b> 2 à 3 ans.<\/p><p><b>Température de service :<\/b> 14 °C pour les rouges.<\/p><p><b>Accords mets-vins :<\/b> viandes blanches, volaille, foie de veau, gibier à plumes, pâtes et fromages.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/102/brouilly"},"103":{"h":"<p><b>Couleur produite :<\/b> rouge.<\/p><p><b>Cépage :<\/b> gamay, indiqué comme cépage principal.<\/p><p><b>Robe :<\/b> rouge foncé, profond et intense, tirant vers le grenat.<\/p><p><b>Nez :<\/b> fruits rouges (type fraise ou framboise), notes florales (violette, iris, pivoine), touches minérales et poivrées.<\/p><p><b>Bouche :<\/b> attaque vive et structure marquée, avec des tanins qui permettent un vieillissement. Avec les années, le vin gagne en rondeur et en ampleur.<\/p><p><b>Potentiel de garde :<\/b> 3 à 6 ans.<\/p><p><b>Température de service :<\/b> 14 °C pour le rouge.<\/p><p><b>Accords mets-vins :<\/b> charcuterie (rillettes d'oie, terrine de lièvre), volaille (canard, pintade), hachis parmentier, paupiettes de veau, gibier (lapin, chevreuil).<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/103/cote-de-brouilly"},"104":{"h":"<p><b>Couleurs produites :<\/b> rouge uniquement.<\/p><p><b>Cépages :<\/b> gamay noir, cépage principal.<\/p><p><b>Robe :<\/b> une cuvaison souvent supérieure à dix jours donne une couleur soutenue, d'un rouge tirant sur le violet. Avec le vieillissement, elle prend une teinte grenat profonde.<\/p><p><b>Nez :<\/b> arômes fruités et floraux, accompagnés de notes vanillées et épicées issues du bois. La rose et surtout la pivoine dominent souvent les premières années.<\/p><p><b>Bouche :<\/b> attaque nette, acidité peu marquée, tanins discrets qui soutiennent un profil charnu et fruité. Avec l'âge, des notes bourguignonnes apparaissent, et le vin reste racé jusqu'à huit à dix ans environ.<\/p><p><b>Potentiel de garde :<\/b> 4 à 8 ans, davantage pour les grands millésimes.<\/p><p><b>Température de service :<\/b> 14 à 15 °C.<\/p><p><b>Accords mets-vins :<\/b> saucisson chaud, volaille, petit salé, blanquette de veau.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/104/chenas"},"105":{"h":"<p><b>Couleurs produites :<\/b> rouge uniquement.<\/p><p><b>Cépages :<\/b> Gamay, le cépage principal.<\/p><p><b>Robe :<\/b> Légère, d'un rouge rubis.<\/p><p><b>Nez :<\/b> Arômes floraux évoquant la violette et l'iris, et petits fruits rouges, surtout la framboise et la fraise des bois.<\/p><p><b>Bouche :<\/b> Vin peu tannique, tendre et très fin, aux saveurs fruitées persistantes. Certaines bouteilles peuvent vieillir une dizaine d'années, mais il exprime surtout son charme durant ses trois premières années.<\/p><p><b>Potentiel de garde :<\/b> 2 à 5 ans.<\/p><p><b>Température de service :<\/b> 13 °C pour le rouge.<\/p><p><b>Accords mets-vins :<\/b> Charcuterie, foie de veau, pieds de porc, endives au jambon et poulet.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/105/chiroubles"},"106":{"h":"<p><b>Couleurs produites :<\/b> rouge uniquement.<\/p><p><b>Cépages :<\/b> gamay.<\/p><p><b>Robe :<\/b> rouge violacé à ses débuts, qui évolue vers des teintes carmin et rubis en vieillissant. Elle est plus vive sur les coteaux légers et plus sombre sur les terrains profonds.<\/p><p><b>Nez :<\/b> arômes délicats de fleurs (violette, pivoine, iris) et de petits fruits rouges, comme la framboise. Certaines cuvées dévoilent aussi de la mûre sauvage ou du cassis.<\/p><p><b>Bouche :<\/b> attaque franche et peu agressive, acidité discrète, tanins fins. Les saveurs fruitées persistent avec légèreté et élégance. Certaines parcelles de granite dur donnent des vins très concentrés.<\/p><p><b>Potentiel de garde :<\/b> 2 à 5 ans.<\/p><p><b>Température de service :<\/b> 13 à 15 °C pour les rouges.<\/p><p><b>Accords mets-vins :<\/b> viande blanche, volaille, gigot et andouillette à la beaujolaise.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/106/fleurie"},"107":{"h":"<p><b>Couleurs produites :<\/b> rouge uniquement.<\/p><p><b>Cépages :<\/b> gamay, le cépage principal de l'appellation.<\/p><p><b>Robe :<\/b> violacée pendant les premiers mois, puis une teinte plus sombre qui persiste avec le temps.<\/p><p><b>Nez :<\/b> arômes floraux (pivoine, violette) et fruités (framboise, fraise, cassis, groseille). Certains millésimes évoquent la pêche de vigne. Notes minérales et épicées en complément.<\/p><p><b>Bouche :<\/b> une vivacité qui équilibre la richesse tannique, une structure rustique et une personnalité affirmée. Le vin se conserve plusieurs années et gagne en complexité en vieillissant.<\/p><p><b>Potentiel de garde :<\/b> 3 à 7 ans.<\/p><p><b>Température de service :<\/b> 13 à 15 °C.<\/p><p><b>Accords mets-vins :<\/b> viandes rouges, gibier, coq au vin, volaille en sauce et fromage (neufchâtel).<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/107/julienas"},"108":{"h":"<p><b>Couleurs produites :<\/b> rouge uniquement.<\/p><p><b>Cépages :<\/b> Gamay.<\/p><p><b>Robe :<\/b> rouge soutenu, de teinte grenat et profonde une fois le vin arrivé à maturité.<\/p><p><b>Nez :<\/b> arômes de kirsch, de fruits mûrs à noyau et d'eau-de-vie de fruits, typiques de cette appellation. Certaines cuvées présentent des notes minérales.<\/p><p><b>Bouche :<\/b> attaque nette, avec une matière qui remplit rapidement la bouche. Le vin est corsé et robuste, et ses meilleures cuvées gagnent en bouquet avec l'âge. Le page emploie le verbe « morgonner » pour désigner cette aptitude au vieillissement.<\/p><p><b>Potentiel de garde :<\/b> 3 à 10 ans.<\/p><p><b>Température de service :<\/b> 13 à 15 °C.<\/p><p><b>Accords mets-vins :<\/b> terrine, gigot d'agneau, gibier à plumes (faisan, canard sauvage) et fromages.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/108/morgon"},"109":{"h":"<p><b>Couleurs produites :<\/b> rouge uniquement.<\/p><p><b>Cépages :<\/b> gamay.<\/p><p><b>Robe :<\/b> rouge violacé, qui passe avec le temps d'un grenat sombre à un rubis profond.<\/p><p><b>Nez (arômes) :<\/b> jeune, fruits comme la cerise mûre et fleurs comme la violette. Avec l'âge, notes de rose fanée et d'iris, puis plus épicées (truffe, musc, venaison, ambre gris), discrètes et légères.<\/p><p><b>Bouche :<\/b> équilibrée, tanins fins, arômes persistants. Charnue, veloutée, souvent minérale, avec parfois une touche boisée issue de l'élevage. Elle gagne en race avec le temps.<\/p><p><b>Potentiel de garde :<\/b> 3 à 10 ans.<\/p><p><b>Température de service :<\/b> 15 °C pour le rouge.<\/p><p><b>Accords mets-vins :<\/b> viandes rouges, gibier et fromages (munster, époisses, camembert).<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/109/moulin-a-vent"},"110":{"h":"<p><b>Régnié : caractéristiques (d'après la page)<\/b><\/p><p><b>Couleurs produites :<\/b> rouge uniquement.<\/p><p><b>Cépages :<\/b> gamay.<\/p><p><b>Robe :<\/b> jeune, elle affiche des reflets violacés, puis prend un rouge vif et brillant.<\/p><p><b>Nez :<\/b> dominé par les fruits rouges, surtout la groseille et la framboise. Certaines cuvées développent des notes de violette.<\/p><p><b>Bouche :<\/b> vinifié à la manière beaujolaise avec une cuvaison prolongée de 8 à 12 jours, le régnié offre une structure tannique plus ferme et une longue finale fruitée.<\/p><p><b>Potentiel de garde :<\/b> 3 à 5 ans.<\/p><p><b>Température de service :<\/b> 14 °C pour le rouge.<\/p><p><b>Accords mets-vins :<\/b> terrine, charcuterie et viande blanche.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/110/regnie"},"111":{"h":"<p><b>Couleur produite :<\/b> rouge.<\/p><p><b>Cépage :<\/b> gamay, le cépage principal de l'appellation.<\/p><p><b>Robe :<\/b> rouge rubis assez soutenu, avec des reflets violacés.<\/p><p><b>Nez :<\/b> arômes de pêche et d'abricot, parfois très marqués dans la première année, accompagnés de petits fruits rouges comme le cassis et la framboise. Après deux ou trois ans de garde, les notes deviennent plus épicées.<\/p><p><b>Bouche :<\/b> une cuvaison courte (8 à 10 jours) donne des vins tendres, fruités et floraux, prêts à boire environ 18 mois après la vendange. Une macération plus longue donne des vins plus structurés, un peu rudes jeunes, qui s'expriment pleinement après 3 à 4 ans.<\/p><p><b>Potentiel de garde :<\/b> 1 à 4 ans.<\/p><p><b>Température de service (rouge) :<\/b> 14 °C.<\/p><p><b>Accords mets-vins :<\/b> gibier à plume et viandes rouges.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/111/saint-amour"},"113":{"h":"<p><b>Couleurs produites :<\/b> rouge (couleur principale de l'appellation). Le page mentionne aussi des bordeaux blancs, rosés et clairets issus de l'appellation régionale.<\/p><p><b>Cépages :<\/b> cabernet-sauvignon, carmenère, côt (malbec), malbec, merlot et petit verdot. Les assemblages sont dominés par le merlot ou le cabernet-sauvignon.<\/p><p><b>Robe :<\/b> rouge bordeaux, avec un grenat peu intense et des reflets brillants.<\/p><p><b>Nez :<\/b> arômes de fruits, parfois de cassis (typique du cabernet) ou de violette (typique du merlot).<\/p><p><b>Bouche :<\/b> souple et fine, soutenue par de jolis tanins, avec un corps rond et suave.<\/p><p><b>Potentiel de garde :<\/b> 1 à 2 ans.<\/p><p><b>Température de service :<\/b> absent (le titre de la rubrique figure sur la page, mais sans contenu).<\/p><p><b>Accords mets-vins :<\/b> fruits de mer, flammekueche, charcuterie, escargots et crabe.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/113/bordeaux"},"117":{"h":"<p><b>Couleurs produites :<\/b> rouge et blanc (ce dernier en moelleux).<\/p><p><b>Cépages :<\/b> cabernet franc, cabernet-sauvignon, carmenère, côt (malbec), merlot et petit verdot.<\/p><p><b>Robe :<\/b> rouge sombre aux reflets brillants et vifs ; blanc moelleux doré, aux reflets scintillants.<\/p><p><b>Nez :<\/b> rouges aux arômes de fruits rouges et noirs (cassis, framboise) issus des cabernets. Le merlot, souvent majoritaire, apporte des notes florales de violette, puis de cuir et de champignon avec l'âge. Touches boisées, vanillées et épicées. Blancs moelleux : fleurs blanches, fruits exotiques surmûris ou confits, parfois miel et notes grillées.<\/p><p><b>Bouche :<\/b> rouges concentrés et complexes, à la structure tannique puissante qui s'assouplit avec le temps. Blancs moelleux : matière riche et onctueuse, finale persistante aux notes confites et miellées.<\/p><p><b>Potentiel de garde :<\/b> rouge de 3 à 5 ans ; blanc moelleux de 3 à 7 ans.<\/p><p><b>Température de service :<\/b> rouge 16 °C ; blanc 10 à 12 °C.<\/p><p><b>Accords mets-vins :<\/b> pavé de bœuf, rôti de porc, champignons, lapin rôti, gibier, escalope de foie gras, langoustines au basilic, fromages à pâte persillée, tarte aux fruits jaunes, salade de fruits.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/117/bordeaux-superieur"},"127":{"h":"<p><b>Couleurs produites :<\/b> rouge uniquement.<\/p><p><b>Cépages :<\/b> cabernet franc, cabernet-sauvignon, côt (malbec), merlot. Le merlot et le cabernet franc sont les cépages traditionnels de l'appellation.<\/p><p><b>Robe :<\/b> entre le rubis et le rouge foncé, avec des reflets grenat.<\/p><p><b>Nez :<\/b> puissant, avec des arômes marqués de violette (dus au merlot) et de truffe. La palette va des fruits rouges au cuir noble, avec des notes animales.<\/p><p><b>Bouche :<\/b> riche et complexe. Jeune, elle a une charpente puissante et une persistance remarquable. Avec le temps, elle devient grasse, onctueuse et soyeuse, avec des tanins souples et veloutés.<\/p><p><b>Potentiel de garde :<\/b> 7 à 20 ans, davantage pour les grands millésimes.<\/p><p><b>Température de service :<\/b> 17 à 18 °C pour le rouge.<\/p><p><b>Accords mets-vins :<\/b> presque tous les plats, en particulier la viande rouge, le gibier et les fromages secs.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/127/pomerol"},"129":{"h":"<p><b>Couleur produite :<\/b> rouge uniquement.<\/p><p><b>Cépages :<\/b> cabernet franc, cabernet-sauvignon et merlot. Le merlot domine nettement, complété par le cabernet franc (appelé « bouchet » localement) et, plus modestement, le cabernet-sauvignon.<\/p><p><b>Robe :<\/b> rubis dans leur jeunesse, puis grenat soutenu après quelques années de garde.<\/p><p><b>Nez :<\/b> à l'état jeune, fruits rouges frais comme la groseille ou la fraise des bois, surtout sur les millésimes bien mûrs. Après élevage en fût, épices et une touche discrète de vanille. Avec le temps, fleurs, cacao, fumée, cuir et notes grillées.<\/p><p><b>Bouche :<\/b> ample, avec un grain marqué, et une diversité liée au terroir. Les tanins solides s'arrondissent avec le temps et, dans les bons millésimes, le vin gagne une chair savoureuse.<\/p><p><b>Potentiel de garde :<\/b> 2 à 6 ans.<\/p><p><b>Température de service :<\/b> 16 à 17 °C pour le rouge.<\/p><p><b>Accords mets-vins :<\/b> charcuterie, selle d'agneau provençale, pintadeau aux girolles, gigue de chevreuil « grand veneur », escalopes à la basquaise. La page cite aussi, parmi ses recettes associées, le canard à l'antillaise, le civet de lapin fermier, les cuisses de pintade aux cèpes et le tartare classique.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/129/saint-emilion"},"136":{"h":"<p><b>Couleurs produites<\/b> : Principalement des vins blancs secs. Le guide mentionne aussi des rouges dans sa sélection, mais sous l'étiquette régionale « Bordelais ».<\/p><p><b>Cépages<\/b> : Sauvignon (le plus important), sémillon et muscadelle. Le colombard apparaît dans certaines descriptions de cuvées.<\/p><p><b>Robe<\/b> : Elle varie beaucoup, mais la couleur la plus typique est un « or pâle ».<\/p><p><b>Nez<\/b> : Parfums fruités et floraux, apportés par le sémillon et le sauvignon. Certains crus développent des notes de fleurs, d'agrumes et de fruits exotiques.<\/p><p><b>Bouche<\/b> : Elle dépend du terroir. Les sols argilo-calcaires donnent équilibre et étoffe. Les sols argilo-siliceux donnent un vin ample et coulant. Les boulbènes donnent un palais délicat et léger, avec une grande fraîcheur florale.<\/p><p><b>Potentiel de garde<\/b> : Absent pour l'appellation. Une seule fiche de rouge (Château Haut-Meyreau, Libre 2023) conseille d'attendre un peu avant de le boire.<\/p><p><b>Température de service<\/b> : Absent. Le titre de la rubrique figure sur la page, mais aucun contenu n'y est associé.<\/p><p><b>Accords mets-vins<\/b> : Hors-d'œuvre, fruits de mer et poisson grillé. Le guide cite aussi, parmi ses recettes, le plateau de fruits de mer et la sole meunière.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/136/entre-deux-mers"},"142":{"h":"<p><b>Couleurs produites :<\/b> rouge et blanc.<\/p><p><b>Cépages :<\/b> cabernet franc, cabernet-sauvignon, côt (malbec), merlot et petit verdot pour les rouges ; sauvignon, sémillon et muscadelle pour les blancs. La page indique aussi que le malbec et le côt sont traités comme des pages distinctes.<\/p><p><b>Robe<\/b><\/p><p><i>Rouge :<\/i> profonde, tirant sur le rouge avec des reflets violets, ou une teinte cerise noire.<\/p><p><i>Blanc :<\/i> dorée et brillante, parfois presque incolore, ou à reflets verts.<\/p><p><b>Nez (arômes)<\/b><\/p><p><i>Rouge :<\/i> jeune, fruits rouges bien mûrs et notes florales (violette), avec fumée, pain grillé et cuir. En vieillissant, fruits cuits ou secs, confiture, cacao, café.<\/p><p><i>Blanc :<\/i> pain grillé, citron, fruits exotiques et noisette.<\/p><p><b>Bouche<\/b><\/p><p><i>Rouge :<\/i> charpentée mais équilibrée et élégante. Jeune, elle montre des arômes de fruits, de sous-bois et de terre chaude ; avec l'âge, elle évolue vers le gibier et le cacao.<\/p><p><i>Blanc :<\/i> concentré et complexe, à la fois onctueux et très frais, avec un très bon équilibre.<\/p><p><b>Potentiel de garde<\/b><\/p><p><i>Rouge :<\/i> 7 à 20 ans, davantage pour certains crus et les grands millésimes.<\/p><p><i>Blanc :<\/i> 2 à 5 ans, jusqu'à 10-15 ans pour certains crus et les grands millésimes.<\/p><p><b>Température de service<\/b><\/p><p><i>Rouge :<\/i> 17 à 18 °C.<\/p><p><i>Blanc :<\/i> 10 à 12 °C.<\/p><p><b>Accords mets-vins<\/b><\/p><p><i>Rouge :<\/i> gibier à plume, viandes rouges ou blanches, fricassée de champignons.<\/p><p><i>Blanc :<\/i> crustacés, poissons en sauce, fromages à pâte dure.<\/p><p><i>Remarque : la page ne précise pas explicitement la couleur associée à chaque accord ; l'attribution ci-dessus est une déduction probable.<\/i><\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/142/pessac-leognan"},"145":{"h":"<p><b>Couleurs produites :<\/b> rouge uniquement.<\/p><p><b>Cépages :<\/b> cabernet franc, cabernet-sauvignon, côt (malbec), malbec, merlot et petit verdot.<\/p><p><b>Robe :<\/b> rouge profond et sombre, qui peut tirer vers des teintes pourpres ou grenat.<\/p><p><b>Nez :<\/b> large palette de fruits rouges, fruits cuits, confits ou secs, confiture, chocolat et cacao, épices, réglisse et sous-bois, avec des notes grillées, torréfiées ou de toast.<\/p><p><b>Bouche :<\/b><\/p><p>Vins issus de graves : puissants et corsés, souvent tanniques dans leur jeunesse, à attendre entre 5 et 10 ans ou plus.<\/p><p>Vins issus de sols argilo-calcaires : plus fins, élégants et subtils, bons à boire vers 3 à 4 ans, avec une garde de 6 à 10 ans.<\/p><p><b>Potentiel de garde :<\/b> 5 à 15 ans.<\/p><p><b>Température de service :<\/b> 17 à 18 °C pour le rouge.<\/p><p><b>Accords mets-vins :<\/b> foie gras chaud aux pommes, viandes rouges ou blanches, gibier à poil ou à plume, fromages (emmental, mimolette, saint-nectaire, coulommiers) et tarte aux fruits rouges.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/145/medoc"},"146":{"h":"<p><b>Couleurs produites :<\/b> rouge uniquement.<\/p><p><b>Cépages :<\/b> cabernet franc, cabernet-sauvignon, côt (malbec), merlot et petit verdot. Certaines notes de dégustation mentionnent aussi du carménère en petite proportion.<\/p><p><b>Robe :<\/b> intense, entre rubis, bordeaux et grenat. Elle reste vive en vieillissant.<\/p><p><b>Nez :<\/b> notes de cassis, arômes torréfiés (café, grillé) et épicés, fruits rouges mûrs, avec vanille et boisé brûlé apportés par le bois.<\/p><p><b>Bouche :<\/b> jeune, le vin est très tannique, et certains ne se goûtent qu'après quelques années. Il devient ensuite souple et charnu, avec les arômes du nez. Le profil varie selon l'origine.<\/p><p><b>Potentiel de garde :<\/b> 5 à 15 ans, parfois davantage pour certains crus.<\/p><p><b>Température de service :<\/b> 17 à 18 °C pour le rouge.<\/p><p><b>Accords mets-vins :<\/b> viandes rouges ou blanches, volailles, gibier et fromages.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/146/haut-medoc"}

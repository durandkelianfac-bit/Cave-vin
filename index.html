 notes végétales ou une odeur de pierre à fusil (silex).<\/p><p><b>Bouche :<\/b> Sur silex, les vins sont fermes et structurés. Sur cris, ils sont élégants et parfumés, et leurs arômes se développent plus vite. Sur marnes, ils sont pleins et fermes, et évoluent plus lentement.<\/p><p><b>Potentiel de garde :<\/b> Environ 1 à 5 ans.<\/p><p><b>Température de service :<\/b> 12 °C.<\/p><p><b>Accords mets-vins :<\/b> Fruits de mer, tomates farcies, poisson fumé ou poisson en sauce (brochet de Loire), volaille et crottin de Chavignol.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/509/pouilly-fume"},"511":{"h":"<p><b>Couleurs produites :<\/b> blanc uniquement.<\/p><p><b>Cépages :<\/b> sauvignon, seul cépage de l'appellation.<\/p><p><b>Robe :<\/b> dorée et pâle.<\/p><p><b>Nez :<\/b> notes de buis, de bourgeon de cassis et de fleurs blanches, sur des terroirs graveleux.<\/p><p><b>Bouche :<\/b> palette large allant des épices à la pomme mûre, en passant par le cassis et le miel. Fraîcheur et finesse, avec une structure souple.<\/p><p><b>Potentiel de garde :<\/b> 2 ans.<\/p><p><b>Température de service :<\/b> 12 °C.<\/p><p><b>Accords mets-vins :<\/b> fruits de mer, poissons (sole grillée, saumon à l'oseille), mouclade, et fromages de chèvre (crottin de Chavignol, pyramide de Valençay).<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/511/quincy"}},"SRC":{"Bourgogne (rouge)":{"i":22},"Bourgogne (blanc)":{"i":22},"Chablis":{"i":169},"Chablis Premier Cru":{"i":170},"Meursault":{"i":224},"Puligny-Montrachet":{"i":226},"Chassagne-Montrachet (blanc)":{"i":233},"Gevrey-Chambertin":{"i":175},"Nuits-Saint-Georges":{"i":208},"Pommard":{"i":219},"Volnay":{"i":220},"Beaune (rouge)":{"i":217},"Santenay (rouge)":{"i":235},"Mercurey (rouge)":{"i":241},"Givry (rouge)":{"i":242},"Rully (blanc)":{"i":240},"Mâcon-Villages":{"i":245},"Viré-Clessé":{"i":953},"Saint-Véran":{"i":252},"Pouilly-Fuissé":{"i":248},"Crémant de Bourgogne":{"i":167},"Be const HV=HV_RAW.map((r,i)=>({id:'hv'+i,builtin:true,domaine:r[0],cuvee:r[1],vintage:String(r[2]),appellation:r[3],color:r[4],nez:r[5],bouche:r[6],finale:r[7],garde:r[8],service:r[9],source:'Guide Hachette des Vins 2027',url:'https://www.hachette-vins.com/guide-vins/les-vins/'+r[10].split('/')[1]+'/'+r[10].split('/')[0]+'/'}));

function baseSeg(on){return '<div class="seg2" id="bseg" style="margin-bottom:14px"><button data-b="app" class="'+(on==='app'?'on':'')+'">Appellations</button><button data-b="dom" class="'+(on==='dom'?'on':'')+'">Domaines</button></div>';}
function bindSeg(){const x=$('#bseg');if(!x)return;x.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.b==='dom')openDomList();else openAocList();});}
function fichesOf(b){
  const d=nrmD(b.domaine);if(!d)return [];
  return S.domaines.concat(HV).filter(f=>nrmD(f.domaine)===d).map(f=>{let sc=1;
    if(f.appellation&&b.appellation&&appNrm(f.appellation)===appNrm(b.appellation))sc+=1;
    if(f.cuvee){if(nrm(f.cuvee)===nrm(b.name))sc+=2;else sc-=5;}
    if(f.vintage){if(String(f.vintage)===String(b.vintage))sc+=2;else sc-=5;}
    return{f:f,sc:sc};}).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).map(x=>x.f);
}
function feltOf(dom){
  const d=nrmD(dom),bs=S.bottles.filter(b=>nrmD(b.domaine)===d),nz={},bo={};let n=0,sum=0;const rows=[];
  bs.forEach(b=>(b.tastings||[]).forEach(t=>{n++;sum+=t.total;(t.nez||[]).forEach(x=>nz[x]=(nz[x]||0)+1);(t.bou||[]).forEach(x=>bo[x]=(bo[x]||0)+1);}));
  bs.forEach(b=>{const t=lastTasting(b);if(t)rows.push([titleOf(b)+(b.vintage?' '+b.vintage:''),t.total]);});
  const top=m=>Object.keys(m).sort((a,b)=>m[b]-m[a]).slice(0,6);
  return{n:n,avg:n?Math.round(sum/n):0,nez:top(nz),bou:top(bo),rows:rows};
}
function feltHTML(f){

}

   +(f.nez&&f.nez.length?'<p><b>Nez</b></p>'+chipsH(f.nez):'')
   +(f.bouche?'<p><b>Bouche</b> : '+esc(f.bouche)+'</p>':'')
   +(f.finale?'<p><b>Finale</b> : '+esc(f.finale)+'</p>':'')
   +(f.garde?'<p><b>Garde conseillée</b> : '+esc(f.garde)+(f.service?' · <b>Service</b> : '+esc(f.service):'')+'</p>':'')
   +(f.notes?'<p>'+esc(f.notes)+'</p>':'')
   +'<p><small>Source : '+(f.url?'<a href="'+f.url+'" target="_blank" rel="noopener">'+esc(f.source)+'</a> (résumé reformulé)':(f.source?esc(f.source):'non précisée'))+'</small></p></div>';
}
function domBlock(b){
  if(!b.domaine)return '';
  const fs=fichesOf(b);
  return '<h4>Domaine · '+esc(b.domaine)+'</h4>'
   +(fs.length?fs.map(ficheHTML).join(''):'<p class="note">Pas encore de fiche pour ce domaine. Ajoute son profil (nez, bouche…) pour le retrouver ici.</p>')
   +feltHTML(feltOf(b.domaine))
   +'<button class="btn ghost" id="dAddFiche" style="margin:4px 0 6px">Ajouter une fiche du domaine</button>';
}
function openFiche(id,pre){
  const f=id?S.domaines.find(x=>x.id===id):null,v=f||pre||{};
  const doms=Array.from(new Set(S.bottles.map(x=>x.domaine).concat(S.domaines.map(x=>x.domaine)).filter(Boolean))).sort();
  openSheet('<h3 class="sh">'+(f?'Modifier la fiche':'Fiche domaine')+'</h3><div class="form">'
   +'<label>Domaine<input id="g-dom" list="dl-gdom" value="'+esc(v.domaine)+'" autocomplete="off"></label>'
   +'<label>Appellation<input id="g-app" list="dl-gapp" value="'+esc(v.appellation)+'" autocomplete="off"></label>'
   +'<div class="row2"><label>Cuvée <small>(facultatif)</small><input id="g-cuv" value="'+esc(v.cuvee)+'" autocomplete="off"></label><label>Millésime <small>(facultatif)</small><input id="g-vin" inputmode="numeric" maxlength="4" value="'+esc(v.vintage)+'"></label></div>'
   +'<label>Arômes au nez <small>(séparés par des virgules)</small><input id="g-nez" value="'+esc((v.nez||[]).join(', '))+'" autocomplete="off"></label><div class="sugg" id="g-sugg"></div>'
   +'<label>Bouche<textarea id="g-bou" rows="2">'+esc(v.bouche)+'</textarea></label>'
   +'<label>Finale<input id="g-fin" value="'+esc(v.finale)+'"></label>'
   +'<label>Notes<textarea id="g-notes" rows="2">'+esc(v.notes)+'</textarea></label>'
   +'<label>Source <small>(site du domaine, guide, dégustation perso…)</small><input id="g-src" value="'+esc(v.source)+'" autocomplete="off"></label></div>'
   +'<datalist id="dl-gdom">'+doms.map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist><datalist id="dl-gapp">'+AOC.map(a=>'<option value="'+esc(a.name)+'">').join('')+'</datalist>'
   +'<div class="sbar">'+(f?'<button class="btn ghost" id="g-del" style="flex:none">Supprimer</button>':'<button class="btn ghost" data-close>Annuler</button>')+'<button class="btn" id="g-save">Enregistrer</button></div>');
  const sg=()=>{const a=aocOf($('#g-app').value),box=$('#g-sugg');if(!a){box.innerHTML='';return;}box.innerHTML='<small style="width:100%;color:var(--muted)">Arômes typiques de l\'appellation (touche pour ajouter si tu les retrouves) :</small>'+a.aromas.map(x=>'<button type="button" data-a="'+esc(x)+'">'+esc(x)+'</button>').join('');};
  $('#g-app').addEventListener('input',sg);sg();
  $('#g-sugg').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const i=$('#g-nez'),l=i.value.split(',').map(x=>x.trim()).filter(Boolean);if(l.indexOf(b.dataset.a)<0)l.push(b.dataset.a);i.value=l.join(', ');});
  const done=()=>{closeSheet();const fn=FR.after;FR.after=null;if(fn)fn();else if(!ST.open)openDomList();};
  if(f)$('#g-del').addEventListener('click',()=>{if(confirm('Supprimer cette fiche ?')){S.domaines=S.domaines.filter(x=>x.id!==f.id);save();done();toast('Fiche supprimée');}});
  $('#g-save').addEventListener('click',()=>{
    const g=i=>$('#'+i).value.trim();
    if(!g('g-dom')){toast('Indique le domaine');return;}
    const o={id:f?f.id:uid(),domaine:g('g-dom'),appellation:g('g-app'),cuvee:g('g-cuv'),vintage:g('g-vin').replace(/\D/g,'').slice(0,4),
      nez:g('g-nez').split(',').map(x=>x.trim()).filter(Boolean),bouche:g('g-bou'),finale:g('g-fin'),notes:g('g-notes'),source:g('g-src')};
    if(f)S.domaines[S.domaines.indexOf(f)]=o;else S.domaines.push(o);
    save();done();toast('Fiche enregistrée');
  });
}
function openDomList(){
  const names={};
  S.domaines.concat(HV).forEach(f=>{const k=nrmD(f.domaine);(names[k]=names[k]||{n:f.domaine,f:0,b:0}).f++;});
  S.bottles.forEach(b=>{if(!b.domaine)return;const k=nrmD(b.domaine);(names[k]=names[k]||{n:b.domaine,f:0,b:0}).b++;});
  const l=Object.keys(names).map(k=>names[k]).sort((a,b)=>a.n.localeCompare(b.n,'fr'));
  openSheet(baseSeg('dom')+'<h3 class="sh">Domaines</h3><p class="note" style="margin-top:-8px">Une fiche par domaine, avec en option la cuvée et le millésime : nez, bouche, finale. Ton ressenti s\'ajoute automatiquement à partir de tes dégustations.</p>'
   +'<div class="form"><input id="dq" type="search" placeholder="Chercher un domaine…" style="margin-bottom:10px"></div><div class="sbar" style="position:static;padding:0 0 12px;background:none"><button class="btn" id="dNew">Nouvelle fiche domaine</button></div><div id="dl2">'
   +(l.length?l.map(x=>'<button class="aitem" data-d="'+esc(x.n)+'"><span class="adot" style="background:var(--wine)"></span><span class="at"><b>'+esc(x.n)+'</b><small>'+x.f+' fiche'+(x.f>1?'s':'')+' · '+x.b+' référence'+(x.b>1?'s':'')+' en cave</small></span></button>').join(''):'<p class="note">Aucun domaine pour l\'instant. Crée une fiche ou ajoute une bouteille avec son domaine.</p>')
   +'</div><div class="sbar"><button class="btn ghost" data-close>Fermer</button></div>');
  bindSeg();
  $('#dq').addEventListener('input',e=>{const q=nrm(e.target.value);$$('#dl2 .aitem').forEach(i=>{i.hidden=!!q&&nrm(i.dataset.d).indexOf(q)<0;});});
  $('#dNew').addEventListener('click',()=>{FR.after=null;openFiche(null);});
  $$('#dl2 .aitem').forEach(i=>i.addEventListener('click',()=>openDomDetail(i.dataset.d)));
}
function openDomDetail(name){
  const d=nrmD(name),fs=S.domaines.concat(HV).filter(f=>nrmD(f.domaine)===d);
  openSheet('<h3 class="sh">'+esc(name)+'</h3>'
   +(fs.length?fs.map(ficheHTML).join(''):'<p class="note">Aucune fiche pour ce domaine pour l\'instant.</p>')
   +feltHTML(feltOf(name))
   +'<div class="sbar"><button class="btn ghost" id="dBack2">Retour</button><button class="btn" id="dAdd2">Ajouter une fiche</button></div>');
  $('#dBack2').addEventListener('click',openDomList);
  $('#dAdd2').addEventListener('click',()=>{FR.after=()=>openDomDetail(name);openFiche(null,{domaine:name});});
  $$('[data-fedit]').forEach(b=>b.addEventListener('click',()=>{FR.after=()=>openDomDetail(name);openFiche(b.dataset.fedit);}));
}
const AQ={q:'',col:'all',reg:'all'};
function renderAocItems(){
  const q=AQ.q.trim().toLowerCase();
  const l=AOC.filter(a=>(AQ.col==='all'||a.color===AQ.col)&&(AQ.reg==='all'||a.region===AQ.reg)&&(!q||(a.name+' '+a.region+' '+a.cepages+' '+a.aromas.join(' ')).toLowerCase().includes(q)));
  $('#aql').innerHTML=l.length?l.map(a=>'<button class="aitem" data-n="'+esc(a.name)+'"><span class="adot" style="background:'+BC[a.color][1]+'"></span><span class="at"><b>'+esc(a.name)+'</b><small>'+esc(a.region)+' · '+esc(a.cepages)+'</small></span><span class="chip">'+CNAME[a.color]+'</span></button>').join(''):'<p class="note">Aucune appellation trouvée.</p>';
}
function openAocList(){
  const regs=Array.from(new Set(AOC.map(a=>a.region))).sort((x,y)=>x.localeCompare(y,'fr'));
  openSheet(baseSeg('app')+'<h3 class="sh">Appellations françaises</h3><p class="note" style="margin-top:-8px">'+AOC.length+' appellations avec leur profil typique : œil, nez, bouche, finale, accords.</p>'
   +'<div class="form"><input id="aq" type="search" placeholder="Chercher : Chablis, Pinot noir, Rhône, cerise…" value="'+esc(AQ.q)+'" style="margin-bottom:10px">'
   +'<select id="aqr" style="margin-bottom:12px"><option value="all">Toutes les régions</option>'+regs.map(r=>'<option value="'+esc(r)+'"'+(AQ.reg===r?' selected':'')+'>'+esc(r)+'</option>').join('')+'</select></div>'
   +'<div class="tabs2" id="aqc">'+TABS.map(t=>'<button data-c="'+t[0]+'" class="'+(AQ.col===t[0]?'on':'')+'">'+t[1]+'</button>').join('')+'</div>'
   +'<div id="aql"></div><div class="sbar"><button class="btn ghost" data-close>Fermer</button></div>');
  bindSeg();
  $('#aq').addEventListener('input',e=>{AQ.q=e.target.value;renderAocItems();});
  $('#aqr').addEventListener('change',e=>{AQ.reg=e.target.value;renderAocItems();});
  $('#aqc').addEventListener('click',e=>{const c=e.target.closest('button');if(!c)return;AQ.col=c.dataset.c;$$('#aqc button').forEach(x=>x.classList.toggle('on',x===c));renderAocItems();});
  $('#aql').addEventListener('click',e=>{const i=e.target.closest('.aitem');if(i)openAocDetail(i.dataset.n);});
  renderAocItems();
}
function openAocDetail(name){
  const a=aocOf(name);if(!a)return;
  openSheet('<h3 class="sh">'+esc(a.name)+'</h3><div class="note" style="margin-top:-8px">'+esc(a.region)+' · '+CNAME[a.color]+' · '+esc(a.cepages)+'</div>'
   +profileHTML(a)
   +'<div class="sbar"><button class="btn ghost" id="aBack">Retour</button><button class="btn" id="aAdd">Ajouter à ma cave</button></div>');
  $('#aBack').addEventListener('click',()=>openAocList());
  $('#aAdd').addEventListener('click',()=>openForm(null,a.name));
}

/* ============ Exemples ============ */
function loadDemo(){
  const mk=(dom,app,vin,qty,price,loc)=>{
    const a=aocOf(app);
    return{id:uid(),domaine:dom,name:'',appellation:app,vintage:String(vin),color:a.color,region:a.region,cepages:a.cepages,qty:qty,price:price,location:loc,
      from:String(vin+a.g0),to:String(vin+a.g1),notes:'Exemple à supprimer',tastings:[]};
  };
  S.bottles=[mk('Domaine Exemple','Pouilly-Fuissé',2021,3,24,'Casier A1'),mk('Domaine Exemple','Gevrey-Chambertin',2019,2,48,'Casier B2'),
    mk('Domaine Exemple','Côtes de Provence (rosé)',2025,6,11,'Casier C1'),mk('Domaine Exemple','Chinon (rouge)',2020,4,13,'Casier B1')];
  save();renderHome();toast('4 exemples ajoutés (supprimables)');
}

renderHome();
})();
</script>

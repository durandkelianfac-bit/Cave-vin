    const e=idx[k];
    if(seen[k]){e.fs.forEach(f=>{const t=out.find(o=>appKey(o.name)===k&&o.color===f.color)||out.find(o=>appKey(o.name)===k);t.fs.push(f);});}
    else{const c={};e.fs.forEach(f=>{if(f.color)c[f.color]=(c[f.color]||0)+1;});const col=Object.keys(c).sort((x,y)=>c[y]-c[x])[0]||'R';extra.push({name:e.n,region:'Autres appellations et IGP',color:col,cepages:'',aromas:[],prof:false,fs:e.fs});}
  });
  extra.sort((x,y)=>x.name.localeCompare(y.name,'fr'));
  const all=out.concat(extra);
  all.forEach(o=>{o.nd=new Set(o.fs.map(f=>nrmD(f.domaine))).size;o.hay=nrm(o.name+' '+o.region+' '+o.cepages+' '+o.aromas.join(' ')+' '+Array.from(new Set(o.fs.map(f=>f.domaine))).join(' '));});
  return all;
}
function renderAocItems(){
  const q=nrm(AQ.q);
  const l=AL.filter(a=>(AQ.col==='all'||a.color===AQ.col)&&(AQ.reg==='all'||a.region===AQ.reg)&&(!AQ.fo||a.fs.length)&&(!q||a.hay.indexOf(q)>=0));
  $('#aql').innerHTML=l.length?l.map(a=>'<button class="aitem" data-n="'+esc(a.name)+'"><span class="adot" style="background:'+BC[a.color][1]+'"></span><span class="at"><b>'+esc(a.name)+'</b><small>'+(a.prof?esc(a.region)+' · '+esc(a.cepages):'Pas de profil détaillé')+(a.fs.length?' · '+a.nd+' domaine'+(a.nd>1?'s':'')+', '+a.fs.length+' fiche'+(a.fs.length>1?'s':''):'')+'</small></span><span class="chip">'+CNAME[a.color]+'</span></button>').join(''):'<p class="note">Aucune appellation trouvée.</p>';
}
function openAocList(){
  AL=aocItems();
  const regs=Array.from(new Set(AL.map(a=>a.region))).sort((x,y)=>x.localeCompare(y,'fr'));
  const nf=AL.reduce((n,a)=>n+a.fs.length,0);
  openSheet(baseSeg('app')+'<h3 class="sh">Appellations françaises</h3><p class="note" style="margin-top:-8px">'+AL.length+' appellations, dont '+AOC.length+' avec leur profil détaillé (œil, nez, bouche, finale, accords). Les '+nf+' fiches de domaines sont rangées dans chaque appellation, par domaine puis par millésime. Cherche aussi par nom de domaine.</p>'
   +'<div class="form"><input id="aq" type="search" placeholder="Chercher : Chablis, Pinot noir, Rhône, un domaine…" value="'+esc(AQ.q)+'" style="margin-bottom:10px">'
   +'<select id="aqr" style="margin-bottom:12px"><option value="all">Toutes les régions</option>'+regs.map(r=>'<option value="'+esc(r)+'"'+(AQ.reg===r?' selected':'')+'>'+esc(r)+'</option>').join('')+'</select></div>'
   +'<div class="tabs2" id="aqc">'+TABS.map(t=>'<button data-c="'+t[0]+'" class="'+(AQ.col===t[0]?'on':'')+'">'+t[1]+'</button>').join('')+'</div>'
   +'<button class="fo'+(AQ.fo?' on':'')+'" id="aqf">Seulement les appellations avec fiches de domaines</button>'
   +'<div id="aql"></div><div class="sbar"><button class="btn ghost" data-close>Fermer</button></div>');
  bindSeg();
  $('#aq').addEventListener('input',e=>{AQ.q=e.target.value;renderAocItems();});
  $('#aqr').addEventListener('change',e=>{AQ.reg=e.target.value;renderAocItems();});
  $('#aqc').addEventListener('click',e=>{const c=e.target.closest('button');if(!c)return;AQ.col=c.dataset.c;$$('#aqc button').forEach(x=>x.classList.toggle('on',x===c));renderAocItems();});
  $('#aqf').addEventListener('click',e=>{AQ.fo=!AQ.fo;e.currentTarget.classList.toggle('on',AQ.fo);renderAocItems();});
  $('#aql').addEventListener('click',e=>{const i=e.target.closest('.aitem');if(i)openAocDetail(i.dataset.n);});
  renderAocItems();
}
function groupFiches(fs){
  const g={};
  fs.forEach(f=>{const k=nrmD(f.domaine);(g[k]=g[k]||{n:f.domaine,fs:[]}).fs.push(f);});
  return Object.keys(g).map(k=>g[k]).sort((a,b)=>a.n.localeCompare(b.n,'fr')).map(d=>{
    d.fs.sort((a,b)=>String(b.vintage||'').localeCompare(String(a.vintage||''))||String(a.cuvee||'').localeCompare(String(b.cuvee||''),'fr'));
    return '<div class="pgrp" data-n="'+esc(nrmD(d.n))+'"><h5 class="pgd">'+esc(d.n)+' <small>'+d.fs.length+' fiche'+(d.fs.length>1?'s':'')+'</small></h5>'
     +d.fs.map(f=>'<details class="pgf" data-v="'+esc(f.vintage||'')+'" data-c="'+esc(nrm(f.cuvee))+'"><summary><b>'+esc(f.vintage||'—')+'</b><span>'+esc(f.cuvee||'Cuvée principale')+'</span></summary>'+ficheHTML(f)+'</details>').join('')+'</div>';
  }).join('');
}
function openAocDetail(name){
  const it=aocItems().find(o=>o.name===name);if(!it)return;
  const a=it.prof?aocOf(name):null;
  const vs=Array.from(new Set(it.fs.map(f=>String(f.vintage||'')).filter(Boolean))).sort().reverse();
  openSheet('<h3 class="sh">'+esc(it.name)+'</h3><div class="note" style="margin-top:-8px">'+esc(it.region)+' · '+CNAME[it.color]+(it.cepages?' · '+esc(it.cepages):'')+'</div>'
   +(a?profileHTML(a):'<p class="note">Le profil détaillé de cette appellation n\'est pas encore rédigé. Les fiches de domaines ci-dessous donnent déjà les arômes relevés.</p>')
   +'<h3 class="pgh">Domaines et millésimes<small>'+it.nd+' domaine'+(it.nd>1?'s':'')+' · '+it.fs.length+' fiche'+(it.fs.length>1?'s':'')+' (classées par domaine, puis par millésime)</small></h3>'
   +(it.fs.length?'<div class="form pgbar"><input id="pgq" type="search" placeholder="Chercher un domaine, une cuvée…"><select id="pgv"><option value="">Tous millésimes</option>'+vs.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')+'</select></div><div id="pgl">'+groupFiches(it.fs)+'</div>':'<p class="note">Pas encore de fiche de domaine pour cette appellation.</p>')
   +'<div class="sbar"><button class="btn ghost" id="aBack">Retour</button><button class="btn" id="aAdd">Ajouter à ma cave</button></div>');
  $('#aBack').addEventListener('click',()=>openAocList());
  $('#aAdd').addEventListener('click',()=>openForm(null,it.name));
  const flt=()=>{const q=nrm($('#pgq').value),v=$('#pgv').value;
    $$('#pgl .pgrp').forEach(g=>{let n=0;const dm=g.dataset.n.indexOf(q)>=0;
      g.querySelectorAll('details.pgf').forEach(d=>{const ok=(!v||d.dataset.v===v)&&(!q||dm||d.dataset.c.indexOf(q)>=0);d.hidden=!ok;if(ok)n++;});
      g.hidden=!n;});};
  if(it.fs.length){$('#pgq').addEventListener('input',flt);$('#pgv').addEventListener('change',flt);}
  $$('[data-fedit]').forEach(b=>b.addEventListener('click',()=>{FR.after=()=>openAocDetail(name);openFiche(b.dataset.fedit);}));
}

renderHome();

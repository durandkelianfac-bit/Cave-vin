b>Potentiel de garde :<\/b> 3 à 15 ans.<\/p><p><b>Température de service :<\/b> 14 à 16 °C.<\/p><p><b>Accords mets-vins :<\/b> coq au vin, daube de bœuf, sandre au vin rouge, chaource.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/175/gevrey-chambertin"},"208":{"h":"<p><b>Couleurs produites :<\/b> blanc et rouge, la production rouge étant largement majoritaire.<\/p><p><b>Cépages :<\/b> pinot noir (quasi exclusif) et chardonnay (présent en petite quantité, notamment dans les premiers crus Clos Arlot, Les Perrières et Les Porrets Saint-Georges).<\/p><p><b>Robe :<\/b> rouge sombre et intense, aux reflets pourpres parfois tirant sur le mauve, net et lumineux.<\/p><p><b>Nez :<\/b> notes de rose et de réglisse. Les vins jeunes évoquent les fruits rouges et noirs (cerise, fraise, cassis), tandis que les vins plus âgés développent des arômes de cuir, de fourrure, de truffe, de gibier et d'épices. Les fruits macérés, comme le pruneau, sont fréquents.<\/p><p><b>Bouche :<\/b> d'abord vigoureuse, corsée et assez tannique, avec du corps et de la mâche. La maturité apporte de la rondeur et du moelleux. Certains premiers crus, comme Les Damodes, Les Didiers, Les Corvées Paget et Les Saint-Georges, sont plus tendres et peuvent être bus jeunes.<\/p><p><b>Potentiel de garde :<\/b> rouge de 5 à 15 ans ; blanc de 2 à 5 ans.<\/p><p><b>Température de service :<\/b> blanc entre 12 et 14 °C ; rouge entre 14 et 15 °C.<\/p><p><b>Accords mets-vins :<\/b> jambon à la crème, viandes blanches, gibier et fromages comme l'Époisses ou le Langres.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/208/nuits-saint-georges"},"217":{"h":"<p><b>Couleurs produites :<\/b> rouge et blanc. L'appellation produit surtout des rouges, issus du pinot noir.<\/p><p><b>Cépages :<\/b> Chardonnay (blanc) et Pinot (rouge, en pinot noir).<\/p><p class=\"shd\">Rouge<\/p><p><b>Robe :<\/b> brillante et vive, d'un rouge lumineux et écarlate, sans tirer vers le pourpre sombre.<\/p><p><b>Nez :<\/b> fruits noirs (cassis, mûre), fruits rouges (cerise, groseille), sous-bois, humus, truffe, cuir, fourrure, et épices qui apparaissent avec l'âge.<\/p><p><b>Bouche :<\/b> croquante et fraîche dans la jeunesse, avec un goût de raisin frais. Les vins sont robustes, corsés et épicés, sans être minces ni trop capiteux. Ceux de Savigny sont plus puissants et fermes, ceux de Pommard plus ronds et souples.<\/p><p><b>Potentiel de garde :<\/b> 5 à 10 ans, parfois jusqu'à 20 ans pour les grands millésimes.<\/p><p><b>Température de service :<\/b> 16 à 18 °C.<\/p><p class=\"shd\">Blanc<\/p><p><b>Robe :<\/b> or clair et discret, surtout quand le vin est jeune.<\/p><p><b>Nez :<\/b> amande amère, fruits secs, fougère, fleurs blanches, notes végétales, parfois beurre et miel, et cannelle.<\/p><p><b>Bouche :<\/b> page peu détaillée. Les blancs sont rares et se boivent jeunes, pour profiter du fruit.<\/p><p><b>Potentiel de garde :<\/b> 3 à 5 ans.<\/p><p><b>Température de service :<\/b> 12 à 14 °C.<\/p><p class=\"shd\">Accords mets-vins (non séparés par couleur sur la page)<\/p><p>Volaille rôtie, gibier, fromages comme le reblochon ou le brie.<\/p><p>Fruits de mer, tourtes et pâtés chauds, charcuterie fine, poisson.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/217/beaune"},"219":{"h":"<p><b>Couleurs produites :<\/b> uniquement des vins rouges.<\/p><p><b>Cépages :<\/b> pinot noir.<\/p><p><b>Robe :<\/b> rouge profond, tirant vers le pourpre foncé, avec parfois des reflets mauves.<\/p><p><b>Nez :<\/b> fruits noirs (mûre, myrtille), groseille, cerise concentrée, prune mûre ou confite. À maturité : cuir, poivre ou poivron, chocolat. Croûte de pain frais et réglisse peuvent aussi apparaître.<\/p><p><b>Bouche :<\/b> fermée dans la jeunesse, elle s'épanouit après quatre ou cinq ans. Elle offre une structure souple, un caractère charnu, de la richesse et de la puissance, avec un fruit marqué et de la mâche.<\/p><p><b>Potentiel de garde :<\/b> 5 à 10 ans.<\/p><p><b>Température de service :<\/b> 14 à 15 °C pour le rouge.<\/p><p><b>Accords mets-vins :<\/b> râble ou civet de lièvre, côte de bœuf, entrecôte vigneronne, gibier, fromages comme le munster ou le livarot.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/219/pommard"},"220":{"h":"<p><b>Couleur produite :<\/b> rouge.<\/p><p><b>Cépages :<\/b> pinot (noir).<\/p><p><b>Robe :<\/b> brillante, rouge vif, pouvant aller jusqu'au grenat foncé, avec souvent des reflets rubis.<\/p><p><b>Nez :<\/b> arômes frais et légers, tirant vers le végétal et le floral (violette, rose), avec des notes de fruits rouges (framboise, groseille) et de fruits noirs (mûre).<\/p><p><b>Bouche :<\/b> légère et fruitée. Le vin est décrit comme « un réel séducteur grâce à sa bouche légère, fruitée ». Les premiers crus sont généralement plus concentrés et plus élégants.<\/p><p><b>Potentiel de garde :<\/b> 3 à 8 ans.<\/p><p><b>Température de service :<\/b> 15 à 16 °C.<\/p><p><b>Accords mets-vins :<\/b> viande rôtie, volaille (canard rôti, caille farcie) et filet mignon.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/220/volnay"},"224":{"h":"<p><b>Couleurs produites :<\/b> blanc et rouge. Le blanc est la production dominante.<\/p><p><b>Cépages :<\/b> chardonnay (blancs) et pinot (rouges).<\/p><p><b>Robe :<\/b> dorée, qui fonce vers l'ambré avec l'âge. Elle est brillante et claire, parfois teintée de reflets gris.<\/p><p><b>Nez :<\/b> arômes de chardonnay mûr marqués par le terroir, avec des fleurs blanches (aubépine), des agrumes (citron), de l'abricot et des fruits exotiques (mangue, papaye). On trouve aussi des fruits secs (noisette, amande), du tilleul et du beurre. Avec le temps apparaissent la truffe et le pain grillé.<\/p><p><b>Bouche :<\/b> vin assez corsé, long et structuré, à la texture soyeuse. Elle associe une noisette fraîche et le miel, avec une finale sur la mirabelle.<\/p><p><b>Potentiel de garde :<\/b> blanc de 8 à 15 ans ; rouge de 5 à 10 ans.<\/p><p><b>Température de service :<\/b> blanc entre 12 et 14 °C ; rouge à 15 °C.<\/p><p><b>Accords mets-vins :<\/b><\/p><p class=\"s\">Viandes rouges grillées ou rôties.<\/p><p class=\"s\">Foie gras, fruits de mer, quenelles de brochet, poisson.<\/p><p class=\"s\">Fromages : Munster, Époisses, Roquefort ou bleu de Bresse.<\/p><p class=\"s\">Tarte Tatin, avec un vin âgé.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/224/meursault"},"226":{"h":"<p><b>Couleurs produites :<\/b> blanc et rouge.<\/p><p><b>Cépages :<\/b> Chardonnay (blanc) et Pinot (la page ne précise pas la variété pour le rouge).<\/p><p><b>Robe :<\/b><\/p><p><b>Blanc :<\/b> doré, brillant, avec des reflets verts. La teinte gagne en intensité et en profondeur avec l'âge.<\/p><p><b>Rouge :<\/b> limpide et nette, d'un pourpre assez vif dans sa jeunesse, qui fonce avec le temps.<\/p><p><b>Nez :<\/b><\/p><p><b>Blanc :<\/b> fougère, aubépine, raisin mûr, pâte d'amande, noisette, ambre, citronnelle, pomme verte. Notes minérales (silex, pierre à fusil) et lactiques (beurre) fréquentes. Le miel apparaît souvent après quelques années de garde.<\/p><p><b>Rouge :<\/b> fraise, cassis, petits fruits rouges et noirs. Avec l'âge, des accents de cuir, de musc et de fourrure.<\/p><p><b>Bouche :<\/b><\/p><p><b>Blanc :<\/b> le corps et le bouquet se fondent avec l'âge, avec une concentration remarquable.<\/p><p><b>Rouge :<\/b> tendre et fruité, devenant charnu après quelques années.<\/p><p><b>Potentiel de garde :<\/b> blanc de 5 à 15 ans ; rouge de 4 à 12 ans.<\/p><p><b>Température de service :<\/b> blanc entre 12 et 14 °C ; rouge entre 14 et 16 °C.<\/p><p><b>Accords mets-vins :<\/b><\/p><p>Viandes et fromages : filet mignon, viande grillée ou rôtie, comté, Cîteaux.<\/p><p>Plats : vol-au-vent, pauchouse de la Saône, quenelles de brochet, jambon à la crème, poularde de Bresse à la crème et aux morilles.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/226/puligny-montrachet"},"233":{"h":"<p><b>Couleurs produites :<\/b> blanc et rouge.<\/p><p><b>Cépages :<\/b> chardonnay (blanc) et pinot noir (rouge).<\/p><p><b>Blanc<\/b><\/p><p><b>Robe :<\/b> or pâle à reflets verts, aspect laqué ou doré.<\/p><p><b>Nez :<\/b> fleurs blanches (chèvrefeuille), verveine, noisette, notes minérales de silex, toasté du fût, beurre frais, miel, parfois poire mûre.<\/p><p><b>Bouche :<\/b> attaque vive et fraîche qui gagne en gras avec quelques années de garde. Les premiers crus sont décrits comme plus opulents.<\/p><p><b>Potentiel de garde :<\/b> 3 à 12 ans.<\/p><p><b>Température de service :<\/b> 13 à 15 °C.<\/p><p><b>Rouge<\/b><\/p><p><b>Robe :<\/b> rouge vif à reflets violets, presque noire par endroits.<\/p><p><b>Nez :<\/b> griotte, noyau de cerise, framboise, fraise des bois, groseille, avec une touche animale et épicée.<\/p><p><b>Bouche :<\/b> chair généreuse, tanins parfois austères dans la jeunesse, vin concentré et complexe.<\/p><p><b>Potentiel de garde :<\/b> 5 à 15 ans.<\/p><p><b>Température de service :<\/b> 14 à 16 °C.<\/p><p><b>Accords mets-vins<\/b> (la page ne les distingue pas selon la couleur)<\/p><p><b>Viandes et gibier :<\/b> gigot de mouton, tournedos béarnaise, coq au vin, civet de lièvre.<\/p><p><b>Fromages :<\/b> époisses, soumaintrain, morbier, ainsi que chèvre et comté.<\/p><p><b>Autres plats :<\/b> vol-au-vent, poisson, coquilles Saint-Jacques, volaille de Bresse à la crème.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/233/chassagne-montrachet"},"235":{"h":"<p><b>Couleurs produites :<\/b> rouge et blanc.<\/p><p><b>Cépages :<\/b> chardonnay (blanc) et pinot (rouge, pinot noir).<\/p><p><b>Robe :<\/b><\/p><p><i>Rouge :<\/i> rouge sombre virant au noir, à reflets de cerise ou de tulipe noire, rubis violacé, parfois d'un rose-pivoine très soutenu.<\/p><p><i>Blanc :<\/i> jaune pâle qui évolue vers l'or et des reflets verts.<\/p><p><b>Nez :<\/b><\/p><p><i>Rouge :<\/i> petits fruits rouges et noirs (framboise, groseille, myrtille), épices (poivre, cannelle), violette, menthe, réglisse, notes balsamiques et parfois champignon. Avec l'âge, cuir et fruits confits (pruneau).<\/p><p><i>Blanc :<\/i> fleurs blanches, agrumes, amande douce et pain grillé.<\/p><p><b>Bouche :<\/b><\/p><p><i>Rouge :<\/i> peut être souple, tendre et rond dès l'ouverture, puis charpenté, sérieux et accompli.<\/p><p><i>Blanc :<\/i> vigoureux et corsé, avec une expression bouquetée (noisette, fougère).<\/p><p><b>Potentiel de garde :<\/b> 5 à 10 ans, jusqu'à 25 ans pour les grands millésimes.<\/p><p><b>Température de service :<\/b> blanc 12 à 14 °C ; rouge 14 °C.<\/p><p><b>Accords mets-vins :<\/b><\/p><p><i>Rouge :<\/i> rôti de veau, canard au poivre vert, coq au vin, gibier, fromages (morbier, pont-l'évêque, chaource).<\/p><p><i>Blanc :<\/i> fruits de mer et poissons, par exemple une truite aux amandes.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/235/santenay"},"240":{"h":"<p><b>Couleurs produites :<\/b> blanc et rouge.<\/p><p><b>Cépages :<\/b> chardonnay et pinot noir, en parts égales.<\/p><p><b>Robe :<\/b><\/p><p>Blanc : doré à reflets verts, qui tourne vers un jaune soutenu avec l'âge.<\/p><p>Rouge : rubis ou grenat profond.<\/p><p><b>Nez :<\/b><\/p><p>Blanc : fleurs blanches (acacia, chèvrefeuille, sureau), pêche blanche, citron, silex, miel et toast beurré. Avec le temps apparaissent des notes de coing et de fruits secs.<\/p><p>Rouge : fruits noirs (cassis, mûre) et rouges (bigarreau), réglisse, lilas et rose. Il évolue vers le fruit cuit, avec des nuances de kirsch et de poivre.<\/p><p><b>Bouche :<\/b><\/p><p>Blanc : très fruité, rond mais ferme, avec de la chair et de la longueur.<\/p><p>Rouge : tanins qui ne masquent ni le fruit ni le relief, légère astringence et longue persistance. Il demande un peu de garde, sans excès.<\/p><p><b>Potentiel de garde :<\/b> blanc 3 ans ; rouge 4 à 5 ans.<\/p><p><b>Température de service :<\/b> blanc 12 à 14 °C ; rouge 14 à 16 °C.<\/p><p><b>Accords mets-vins :<\/b><\/p><p>Gibier à plume, canard à l'orange, reblochon (rouge et blanc, selon la page).<\/p><p>Andouillette, cuisses de grenouilles, brochet au beurre blanc, moules et coquilles Saint-Jacques, volaille à la crème.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/240/rully"},"241":{"h":"<p><b>Couleurs produites :<\/b> rouge (majoritaire) et blanc.<\/p><p><b>Cépages :<\/b> Chardonnay (blanc) et Pinot (rouge).<\/p><p><b>Robe :<\/b><\/p><p><i>Rouge :<\/i> souvent profonde, presque sombre, avec des nuances violacées et grenat foncé.<\/p><p><i>Blanc :<\/i> dorée, plus ou moins pâle, avec des reflets verts.<\/p><p><b>Nez :<\/b><\/p><p><i>Rouge :<\/i> fruits rouges croquants (framboise, fraise, cerise). Avec l'âge, notes de sous-bois, de cuir et de gibier.<\/p><p><i>Blanc :<\/i> floral, avec menthe, tilleul, amande fraîche et noisette.<\/p><p><b>Bouche :<\/b><\/p><p><i>Rouge :<\/i> vin complet et charpenté, à la texture ferme. Les tanins peuvent être légèrement amers, mais cette amertume s'atténue avec le temps.<\/p><p><i>Blanc :<\/i> rond, proche des blancs de la Côte de Beaune.<\/p><p><b>Potentiel de garde :<\/b> 3 à 6 ans.<\/p><p><b>Température de service :<\/b> blanc entre 12 et 14 °C ; rouge 15 °C.<\/p><p><b>Accords mets-vins :<\/b><\/p><p>Veau aux carottes, bœuf bourguignon, fromage de Langres.<\/p><p>Entrées, fruits de mer, fromages à pâte pressée.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/241/mercurey"},"242":{"h":"<p><b>Couleurs produites :<\/b> blanc et rouge. Le rouge domine.<\/p><p><b>Cépages :<\/b> chardonnay (blanc) et pinot (noir, pour le rouge).<\/p><p><b>Robe :<\/b> rouge brillante, aux teintes carmin ou pourpre, souvent avec des reflets violacés. Blanc limpide et vif, d'un or clair. Une teinte jaune indique plutôt la maturité.<\/p><p><b>Nez :<\/b> rouge évoquant la violette, la fraise et la mûre, avec parfois des notes réglissées, animales ou fauves, et des épices comme le clou de girofle. Blanc miellé et citronné, rappelant le tilleul, le lys et les fruits secs comme la noisette.<\/p><p><b>Bouche :<\/b> rouge épicé et assez tannique jeune, puis plus souple avec l'âge, souvent dégusté après 3 à 5 ans. Blanc fin et harmonieux, entre moelleux et acidité, qui se conserve bien.<\/p><p><b>Potentiel de garde :<\/b> rouge de 5 à 8 ans ; blanc de 3 à 6 ans.<\/p><p><b>Température de service :<\/b> blanc 11 à 13 °C ; rouge 14 à 15 °C.<\/p><p><b>Accords mets-vins :<\/b><\/p><p class=\"s\">Rouge : charcuterie, œufs en meurette, terrine de gibier, canard aux cerises, poulet grillé.<\/p><p class=\"s\">Blanc : moules à la crème, bisque de homard, poisson au beurre blanc.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/242/givry"},"245":{"h":"<p><b>Couleurs produites :<\/b> blanc, rosé et rouge.<\/p><p><b>Cépages :<\/b> chardonnay, gamay et pinot.<\/p><p><b>Robe :<\/b> tirant entre l'or jaune et la paille, parfois vers l'or blanc ou un ton cendré.<\/p><p><b>Nez :<\/b> arômes floraux (genêt, acacia, chèvrefeuille), complétés par la fougère, la verveine, la citronnelle et les agrumes.<\/p><p><b>Bouche :<\/b> vin frais et sec, fruité en bouche, à la fois rond et suave, avec un bon support acide qui lui permet une petite garde.<\/p><p><b>Potentiel de garde :<\/b> rouge de 3 à 5 ans, rosé d'environ 1 an, blanc de 2 à 4 ans.<\/p><p><b>Température de service :<\/b> blanc et rosé entre 11 et 13 °C, rouge entre 13 et 14 °C.<\/p><p><b>Accords mets-vins :<\/b> charcuterie, andouille aux haricots, petit salé aux lentilles, bœuf gros sel, fromages (reblochon, tomme, abondance, chèvre), entrées, cuisses de grenouilles, escargots, jambon persillé, poisson poché (vin jeune) ou cuisiné (vin plus mûr), andouillette et poulet de Bresse à la crème.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/245/macon-et-macon-villages"},"248":{"h":"<p><b>Couleurs produites :<\/b> blanc uniquement.<\/p><p><b>Cépages :<\/b> chardonnay.<\/p><p><b>Robe :<\/b> de l'or pâle, parfois teinté de gris ou de jaune pastel. Elle est souvent d'un or plus soutenu, limpide et brillante.<\/p><p><b>Nez :<\/b> minéral, avec des notes de noisette et d'amande, d'agrumes (citron, pamplemousse, ananas) et de fruits blancs comme la pêche. On y trouve aussi de la fougère, du tilleul, du miel, de la mie de pain et de la brioche au beurre.<\/p><p><b>Bouche :<\/b> un vin souvent ample et corsé, porté par une bonne richesse en alcool naturel. Il est élégant et raffiné, et laisse fréquemment une légère amertume en finale, que la page présente comme une caractéristique normale.<\/p><p><b>Potentiel de garde :<\/b> 5 à 10 ans.<\/p><p><b>Température de service :<\/b> 12 à 14 °C pour le blanc.<\/p><p><b>Accords mets-vins :<\/b> la page cite notamment la blanquette de veau, les cailles au raisin et à la crème, les feuilletés au fromage, les gambas au curry, les noix de Saint-Jacques sautées, le porc au maïs et les Saint-Jacques aux champignons et au parmesan. Les dégustations de certains vins suggèrent aussi le homard grillé, le turbot au beurre blanc et les ris de veau aux morilles.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/248/pouilly-fuisse"},"252":{"h":"<p><b>Couleurs produites :<\/b> blanc uniquement.<\/p><p><b>Cépages :<\/b> chardonnay.<\/p><p><b>Robe :<\/b> limpide, d'un or pâle à reflets verts. Un élevage sous bois lui donne une teinte plus proche du bouton d'or.<\/p><p><b>Nez :<\/b> arômes de fruits (pêche, poire) associés à l'acacia, à la fougère et au chèvrefeuille. On trouve aussi des notes d'amande fraîche, de noisette et de beurre. Le miel, les fruits exotiques et les agrumes apparaissent surtout dans les vins les plus mûrs.<\/p><p><b>Bouche :<\/b> vin sec et rond, souvent minéral, avec une note de silex. Il est vif et équilibré entre le gras et l'acidité. Une sensation muscatée apparaît parfois en finale.<\/p><p><b>Potentiel de garde :<\/b> 5 à 7 ans.<\/p><p><b>Température de service :<\/b> 11 à 13 °C.<\/p><p><b>Accords mets-vins :<\/b> huîtres gratinées, andouillette au vin blanc, blanquette de veau, fricassée de veau aux girolles, et fromages de chèvre (saint-marcellin, bouton de culotte, crottin). Le site cite aussi des plats comme le porc au maïs, la potée bourguignonne et le risotto aux crevettes.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/252/saint-veran"},"253":{"h":"<p><b>Couleurs produites :<\/b> blanc et rosé (vins effervescents).<\/p><p><b>Cépages :<\/b> chardonnay, meunier, petit meslier, pinot et pinot meunier. Le texte mentionne aussi le pinot noir.<\/p><p><b>Robe :<\/b> avec une majorité de chardonnay, le brut est or paille à or brillant, à reflets verts. Avec une majorité de cépages noirs, il tire vers l'or blanc, parfois avec une touche de rose. Avec l'âge, le jaune s'accentue.<\/p><p><b>Nez :<\/b> les pinots apportent surtout des fruits, et le chardonnay des agrumes, des fleurs et des notes de pain grillé. Le page cite aussi beurre, brioche, citron, pomme, poire, fleurs blanches et miel.<\/p><p><b>Bouche :<\/b> les cépages noirs donnent le fruité, et les cépages blancs la finesse et la nervosité. Le chef de cave cherche l'équilibre.<\/p><p><b>Potentiel de garde :<\/b><\/p><p>Brut sans année : à boire jeune.<\/p><p>Blanc de blancs : 4 à 10 ans.<\/p><p>Millésimés et cuvées spéciales : jusqu'à 10 ans et plus.<\/p><p><b>Température de service :<\/b> 8 °C, pour le blanc comme pour le rosé.<\/p><p><b>Accords mets-vins :<\/b> apéritif, feuilletés, poisson (dont saumon fumé), foie gras et viande blanche.<\/p><p><b>Blanc de blancs :<\/b> il est défini comme issu du seul chardonnay. Sa garde est de 4 à 10 ans. La page ne donne pas de description aromatique propre à ce type, seulement celle du chardonnay en général.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/253/champagne"},"256":{"h":"<p><b>Couleurs produites :<\/b> blanc (sec), rosé, rouge, et vin jaune (savagnin élevé sous voile). Le vin de paille est aussi mentionné, sans couleur précisée.<\/p><p><b>Cépages :<\/b> chardonnay, heida, naturé, paien, pinot, ploussard, poulsard, savagnin, trousseau.<\/p><p><b>Robe :<\/b><\/p><p><i>Rouge (poulsard)<\/i> : claire, du rosé léger au rubis quand le vin est jeune, puis évolution vers la pelure d'oignon.<\/p><p><i>Blanc (savagnin)<\/i> : couleur or.<\/p><p><i>Blanc (chardonnay présent)<\/i> : reflets verts.<\/p><p><i>Vin jaune<\/i> : absent.<\/p><p><b>Nez :<\/b><\/p><p><i>Rouge et rosé<\/i> : fruité dominant de petits fruits rouges, souvent avec une touche sauvage.<\/p><p><i>Blanc<\/i> : noix sèche et pomme verte.<\/p><p><i>Vin jaune<\/i> : absent.<\/p><p><b>Bouche :<\/b><\/p><p><i>Rouge et rosé<\/i> : fruitée, peu tannique, plus ou moins légère selon la cuvaison, avec souvent une note acidulée et une persistance durable.<\/p><p><i>Savagnin (vin jaune)<\/i> : noix et écorce d'orange, bouche opulente mais équilibrée, très longue.<\/p><p><b>Potentiel de garde :<\/b><\/p><p>Rouge : 3 à 5 ans<\/p><p>Rosé : à boire jeune<\/p><p>Blanc sec : 3 ans<\/p><p>Vin jaune : 50 ans<\/p><p>Vin de paille : plus de 10 ans<\/p><p><b>Température de service :<\/b><\/p><p>Blanc : 12 °C<\/p><p>Rosé : 12 °C<\/p><p>Rouge : 15 °C<\/p><p>Vin jaune : absent<\/p><p><b>Accords mets-vins :<\/b> poisson et viande blanche à la crème, sans distinction par couleur. Pour le vin jaune, absent.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/256/arbois"},"257":{"h":"<p><b>Couleurs produites<\/b> : blanc uniquement.<\/p><p><b>Cépages<\/b> : Heida, Naturé, Paien et Savagnin.<\/p><p><b>Robe<\/b> : or soutenu, qui peut tirer vers l'ambré avec le temps.<\/p><p><b>Nez<\/b> : parfum typé rappelant la noix, dû surtout à l'éthanal ; on y trouve aussi la pomme verte, la noisette et l'amande, qui apportent de la fraîcheur.<\/p><p><b>Bouche<\/b> : riche et épicée (muscade, cannelle), avec la noix en fil conducteur. Le vin est sec, vif, et son degré alcoolique est assez élevé.<\/p><p><b>Potentiel de garde<\/b> : 50 à 100 ans.<\/p><p><b>Température de service<\/b> : 16 à 18 °C.<\/p><p><b>Accords mets-vins<\/b> : homard à l'américaine, truite, coq au vin jaune aux morilles, viandes blanches, fromages comme le gruyère et le comté, et gâteau au chocolat et aux noix.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/257/chateau-chalon"},"258":{"h":"<p><b>Couleurs produites :<\/b> blanc, rosé et rouge. Les vins jaunes et les vins de paille sont aussi produits, mais ce sont des types de vins blancs particuliers, non des couleurs distinctes. Les blancs dominent en volume.<\/p><p><b>Cépages :<\/b> chardonnay, savagnin (surtout pour le vin jaune), heida, naturé, paien, pinot, ploussard, poulsard et trousseau.<\/p><p><b>Robe :<\/b><\/p><p>Rouges jeunes : cerise à reflets violacés, qui tirent vers l'orangé en vieillissant.<\/p><p>Blancs jeunes : jaune pâle. Les assemblages chardonnay-savagnin deviennent dorés.<\/p><p>Vin jaune : or éclatant.<\/p><p>Vin de paille : couleur de paille dorée.<\/p><p><b>Nez (arômes) :<\/b><\/p><p>Rouges : fruits rouges et cassis.<\/p><p>Chardonnay jeune : notes fraîches et florales. Après élevage en fût : miel, noisette, amande grillée.<\/p><p>Savagnin mûr : touche aromatique supplémentaire.<\/p><p>Vin jaune : noix, abricot sec, épices.<\/p><p>Vin de paille : fruits exotiques et fruits secs.<\/p><p><b>Bouche :<\/b><\/p><p>Rouges : tanniques et aromatiques.<\/p><p>Chardonnay jeune : fruitée et vive.<\/p><p>Savagnin : plus ronde, sur fond de noix et d'amande. Le caractère s'accentue avec la part de savagnin.<\/p><p>Vin jaune : riche et bien structuré, il demande de longues années pour s'épanouir.<\/p><p>Vin de paille : rond et équilibré entre sucre et alcool, avec des notes de coing, d'abricot et parfois de cire.<\/p><p><b>Potentiel de garde :<\/b><\/p><p>Blanc sec : environ 3 ans.<\/p><p>Rouge : 3 à 5 ans.<\/p><p>Rosé : à boire jeune.<\/p><p>Vin jaune : jusqu'à 50 ans.<\/p><p>Vin de paille : plus de 10 ans.<\/p><p><b>Température de service :<\/b><\/p><p>Blanc : la page indique « 06 °C » et « 16 à 18 °C », sans précision claire. La valeur de 6 °C semble être une coquille, mais je ne peux pas la confirmer.<\/p><p>Rouge : 15 °C.<\/p><p><b>Accords mets-vins :<\/b><\/p><p>Sur la page, la liste de recettes compatibles comprend notamment la raclette, la tartiflette, la daube de porc au curry, le coq au riesling, les soufflés au foie gras ou au chocolat, la crème brûlée, la brandade de morue, le haddock et les soupes de courgette ou de potimarron.<\/p><p>Les notes de dégustation proposent aussi des accords plus précis : escargots en feuilleté pour le vin jaune, coquilles Saint-Jacques au safran pour un savagnin élevé longtemps sous voile, coquillages et crustacés pour un savagnin ouillé, chocolat noir pour le vin de paille, et gibier pour un rouge au pinot noir.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/258/cotes-du-jura"},"261":{"h":"<p class=\"shd\">Apremont (Jacquère)<\/p><p><b>Couleur :<\/b> blanc.<\/p><p><b>Cépage :<\/b> jacquère, cépage blanc local le plus répandu de la région.<\/p><p><b>Robe :<\/b> absente pour la jacquère. La page indique seulement des reflets paille pour les vins blancs en général.<\/p><p><b>Nez :<\/b> la fiche de l'Apremont Fleur de Jacquère 2025 évoque l'aubépine et le jasmin. Pour les blancs en général, la page cite les fleurs blanches, les fruits exotiques et la mirabelle.<\/p><p><b>Bouche :<\/b> absente pour l'Apremont en particulier. Pour la jacquère en général, la page décrit un vin léger, frais et friand dès sa jeunesse. La fiche de l'Apremont 2025 parle d'une bouche vive et longue.<\/p><p><b>Potentiel de garde :<\/b> absent pour la jacquère. La page indique 2 ans pour les blancs de l'appellation.<\/p><p><b>Température de service :<\/b> 10 à 12 °C.<\/p><p><b>Accords mets-vins :<\/b> la fiche de l'Apremont 2025 cite les poissons de lac, la truite meunière et le lavaret à la crème. Les accords généraux de l'appellation ne sont pas propres à la jacquère.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/261/savoie-vin-de"},"262":{"h":"<p><b>Couleurs produites :<\/b> blanc uniquement (vins blancs secs).<\/p><p><b>Cépages :<\/b> altesse, appelé aussi roussette.<\/p><p><b>Robe :<\/b> jaune doré pâle, proche de la couleur paille.<\/p><p><b>Nez :<\/b> frais et ouvert, avec des notes grillées et des arômes de noisette, de noix et de fruits secs.<\/p><p><b>Bouche :<\/b> attaque franche et vive, finale assez longue, saveurs de fruits secs et de noix fraîche.<\/p><p><b>Potentiel de garde :<\/b> 2 à 5 ans.<\/p><p><b>Température de service :<\/b> 10 à 12 °C.<\/p><p><b>Accords mets-vins :<\/b> poisson, écrevisses, viandes blanches comme l'escalope de veau panée, et fromages comme le beaufort ou le reblochon.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/262/roussette-de-savoie"},"268":{"h":"<p><b>Couleurs produites :<\/b> rouge, rosé et blanc. Le vignoble est surtout tourné vers le rouge.<\/p><p><b>Cépages :<\/b> carignan, cinsault, grenache (noir, blanc et poilu), lledoner pelut, macabeu (aussi appelé maccabéo), malvoisie, marsanne, mourvèdre, roussanne (ou bergeron), shiraz, syrah.<\/p><p><b>Robe :<\/b><\/p><p><i>Rouge :<\/i> très soutenue, rouge foncé jeune, presque noire quand la syrah et les vieux carignans dominent. Elle prend des teintes ambrées avec l'âge, pour les grands millésimes.<\/p><p><i>Rosé :<\/i> tirant sur le violine pour les vins de saignée.<\/p><p><i>Blanc :<\/i> jaune pâle à reflets verts quand il est jeune, jaune doré s'il a été élevé en barrique.<\/p><p><b>Nez :<\/b><\/p><p><i>Rouge :<\/i> fruits noirs (cassis, mûre), puis poivre, épices et réglisse avec la garde. Notes de garrigue (thym, romarin). Après élevage : cuir (surtout pour le mourvèdre), café, cacao, sous-bois et gibier.<\/p><p><i>Rosé :<\/i> fruit intense.<\/p><p><i>Blanc :<\/i> fleurs blanches et fruits exotiques, toujours dans la finesse.<\/p><p><b>Bouche :<\/b><\/p><p><i>Rouge :<\/i> généralement puissant et charpenté, avec des tanins solides sur les sols argilo-calcaires et les terrasses de galets. Plus tendre sur les grès (région de Fontfroide), plus fin sur les schistes (bassin de Durban). En altitude, il gagne en élégance tannique et en vivacité. Le carignan est souvent la base des meilleures cuvées.<\/p><p><i>Rosé :<\/i> velouté, fin et aromatiquement puissant.<\/p><p><i>Blanc :<\/i> peu acide, gras et onctueux.<\/p><p><b>Potentiel de garde :<\/b><\/p><p>Rouge : 2 à 5 ans, parfois plus de 10 ans pour les grands millésimes.<\/p><p>Rosé : à boire jeune.<\/p><p>Blanc : 1 à 3 ans.<\/p><p><b>Température de service :<\/b> blanc et rosé à 12 °C ; rouge entre 14 et 18 °C.<\/p><p><b>Accords mets-vins :<\/b><\/p><p>Grillades de bœuf, fricassée de cèpes, fromage de type livarot.<\/p><p>Charcuterie, artichauts à la barigoule, pissaladière.<\/p><p>Moules farcies, calamars, poisson grillé, poulet au citron, fromages de chèvre frais.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/268/corbieres"},"270":{"h":"<p><b>Couleurs produites :<\/b> rouge, rosé et blanc.<\/p><p><b>Cépages :<\/b><\/p><p><b>Rouge :<\/b> carignan et cinsault (limités à 40 %), complétés par grenache noir, syrah, lladoner et mourvèdre.<\/p><p><b>Blanc :<\/b> surtout grenache blanc, clairette et bourboulenc.<\/p><p><b>Rosé :<\/b> la page ne précise pas de cépages pour cette couleur.<\/p><p><b>Robe :<\/b><\/p><p><b>Rouge :<\/b> rouge carmin, parfois profond après une longue macération. Plus clair sur les sols à potentiel légèrement plus élevé.<\/p><p><b>Rosé :<\/b> rose pâle et brillant.<\/p><p><b>Blanc :<\/b> jaune paille doré et brillant.<\/p><p><b>Nez (arômes) :<\/b><\/p><p><b>Rouge :<\/b> fruits rouges (framboise, cassis) dans les vins jeunes, avec épices et poivre pour le carignan et la syrah vinifiés en macération carbonique. Après 3 à 4 ans : cuir, fruits secs, amandes grillées. Près des garrigues : laurier sauce.<\/p><p><b>Rosé :<\/b> fleurs très intenses (acacia) et fruits rouges (cerise burlat).<\/p><p><b>Blanc :<\/b> abricot, agrumes, infusion de garrigue, épices et miel.<\/p><p><b>Bouche :<\/b><\/p><p><b>Rouge :<\/b> puissante et un peu fermée les premières années, puis elle s'ouvre et révèle une belle structure. Les vins issus de schistes sont plus minéraux, avec des tanins plus fins.<\/p><p><b>Rosé :<\/b> ronde, ample, souple et douce.<\/p><p><b>Blanc :<\/b> savoureuse et fraîche, avec ampleur et suavité.<\/p><p><b>Potentiel de garde :<\/b><\/p><p><b>Rouge :<\/b> 2 à 4 ans, jusqu'à 8 à 10 ans pour les grands millésimes.<\/p><p><b>Rosé :<\/b> 1 à 3 ans.<\/p><p><b>Blanc :<\/b> 1 à 3 ans.<\/p><p><b>Température de service :<\/b><\/p><p><b>Rouge :<\/b> 15 à 17 °C.<\/p><p><b>Rosé :<\/b> 8 à 10 °C.<\/p><p><b>Blanc :<\/b> 10 à 12 °C.<\/p><p><b>Accords mets-vins<\/b> (la page ne les attribue pas par couleur) :<\/p><p>Viandes rouges ou blanches, charcuterie, tomates farcies, calamars, artichauts à la barigoule et cuisine nord-africaine.<\/p><p>Poissons : brandade de morue, rougets poêlés, bouillabaisse et bourride.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/270/languedoc"},"271":{"h":"<p><b>Couleurs produites<\/b> : rouge, blanc et rosé.<\/p><p><b>Cépages<\/b> : carignan, cinsault, grenache (noir et blanc), malvoisie, marsanne, mourvèdre, roussanne (aussi appelée bergeron), shiraz et syrah. Le page précise que l'assemblage de plusieurs cépages donne les vins les plus complets.<\/p><p><b>Robe<\/b> :<\/p><p>Rouges : teinte soutenue, à reflets violacés dans leur jeunesse, qui évoluent vers des nuances pourpres.<\/p><p>Rosés : claire et vive.<\/p><p>Blancs : jaune paille.<\/p><p><b>Nez (arômes)<\/b> :<\/p><p>Rouges : notes grillées, fumées ou de café torréfié, avec des petits fruits rouges et des épices douces comme la vanille. Ils sont à leur apogée entre deux et cinq ans, puis apparaissent des notes de cuir et animales.<\/p><p>Rosés : nez fin et floral, parfois avec une touche de pêche.<\/p><p>Blancs : arômes d'abricot intenses, typiques de la roussanne à faibles rendements.<\/p><p><b>Bouche<\/b> :<\/p><p>Rouges : amples et ronds, puissants, avec des tanins fondus et fins à maturité, et une persistance aromatique notable.<\/p><p>Rosés : équilibre centré sur la rondeur.<\/p><p>Blancs : onctueux, riches et gras.<\/p><p><b>Potentiel de garde<\/b> : rouges de 4 à 5 ans ; rosés et blancs à boire jeunes.<\/p><p><b>Température de service<\/b> : blancs et rosés de 10 à 12 °C ; rouges de 16 à 18 °C.<\/p><p><b>Accords mets-vins<\/b> : le texte mentionne les tielles sétoises, la charcuterie et les escargots, mais il est partiellement brouillé. Les recettes liées à la page citent aussi Faugères parmi les appellations compatibles, pour des plats comme le gigot d'agneau rôti, le ragoût de bœuf aux épices ou les travers de porc laqués.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/271/faugeres"},"273":{"h":"<p><b>Couleurs produites :<\/b> rouge, rosé et blanc.<\/p><p><b>Cépages :<\/b> principalement carignan, cinsault, grenache (noir et blanc), grenache poilu, lladoner pelut, macabeu (maccabéo), malvoisie, marsanne, mourvèdre, picpoul, piquepoul (picpoule), roussanne (bergeron), shiraz et syrah.<\/p><p><b>Robe :<\/b><\/p><p>Rouge : rubis ou grenat intense, qui vire vers des teintes tuilées avec l'âge.<\/p><p>Rosé : couleur tuilée.<\/p><p>Blanc : brillante, claire et lumineuse.<\/p><p><b>Nez (arômes) :<\/b><\/p><p>Rouge jeune : cassis et violette, souvent quand la syrah domine, avec des épices, de la vanille et de la cannelle.<\/p><p>Rosé : arômes de garrigue et fruits variés (fraise, grenadine, cassis).<\/p><p>Blanc : fruits blancs comme la pêche, et fruits exotiques comme l'ananas, l'orange ou le pamplemousse.<\/p><p><b>Bouche :<\/b><\/p><p>Rouge : généralement puissante et charpentée. Les vins issus de syrah sur terrasses caillouteuses sont plus élégants et fruités, à boire assez tôt. Ceux des pentes de la Montagne Noire gagnent en puissance et s'ouvrent après environ deux ans.<\/p><p>Rosé : fraîche mais assez puissante, avec une finale longue.<\/p><p>Blanc : attaque franche, finale marquée par la vanille, le miel et une note muscatée.<\/p><p><b>Potentiel de garde :<\/b><\/p><p>Rouge : 2 à 4 ans, jusqu'à 8 à 10 ans pour les grands millésimes.<\/p><p>Rosé et blanc : à boire jeunes.<\/p><p><b>Température de service :<\/b><\/p><p>Blanc : 10 à 12 °C.<\/p><p>Rosé : 10 à 12 °C.<\/p><p>Rouge : 15 à 17 °C.<\/p><p><b>Accords mets-vins :<\/b> médaillon de bœuf aux girolles, gibier, cuisine exotique, plats épicés, fruits de mer et poisson.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/273/minervois"},"274":{"h":"<p><b>Couleurs produites :<\/b> Principalement des rouges, mais l'appellation produit aussi des rosés et, plus rarement, des blancs.<\/p><p><b>Cépages :<\/b> Carignan, cinsault, grenache (noir et blanc), grenache poilu, lledoner pelut, malvoisie, marsanne, mourvèdre, roussanne (aussi appelée bergeron), shiraz et syrah.<\/p><p><b>Robe :<\/b><\/p><p><i>Rouges des schistes :<\/i> sombres et denses quand l'extraction est poussée.<\/p><p><i>Rouges argilo-calcaires :<\/i> d'un beau rouge, avec de légers reflets violets quand ils sont jeunes.<\/p><p><i>Rosés :<\/i> du rose vif à une teinte plus pâle.<\/p><p><i>Blancs :<\/i> jaune intense.<\/p><p><b>Nez (arômes) :<\/b><\/p><p><i>Rouges des schistes :<\/i> notes empyreumatiques, du léger fumé au café torréfié, voire au cacao selon les millésimes.<\/p><p><i>Rouges argilo-calcaires :<\/i> fruits frais, touche florale de violette, fruits confits sur les cuvées très mûres, puis garrigue, laurier, ciste et épices. L'élevage en bois ajoute vanille et réglisse.<\/p><p><i>Rosés :<\/i> discrets et fruités, parfois une note de bonbon anglais.<\/p><p><i>Blancs :<\/i> fleurs blanches, apportées par le grenache.<\/p><p><b>Bouche :<\/b><\/p><p><i>Rouges des schistes :<\/i> faible acidité, pH souvent supérieur à 4. Tanins mûrs dès la deuxième année, avec un velouté qui tient environ cinq ans.<\/p><p><i>Rouges argilo-calcaires :<\/i> gras, rondeur et trame tannique importante. Évolution lente, garde possible jusqu'à dix ans pour les meilleures cuvées.<\/p><p><i>Rosés :<\/i> rondeur et bon équilibre acide, à consommer dans les deux ans.<\/p><p><i>Blancs :<\/i> fraîcheur et légèreté.<\/p><p><b>Potentiel de garde :<\/b> Rouges : 4 à 5 ans. Rosés et blancs : à boire jeunes. (La section sur la bouche évoque toutefois jusqu'à dix ans pour les meilleures cuvées argilo-calcaires, ce qui n'est pas cohérent avec ce chiffre.)<\/p><p><b>Température de service :<\/b> Blanc : 10 °C. Rosé : 10 °C. Rouge : 16 à 18 °C.<\/p><p><b>Accords mets-vins :<\/b> Viandes et gibier en sauce ou à la broche pour les vins les plus corsés. Viandes rouges et volailles pour les plus légers et gouleyants. Salades composées et charcuteries, y compris fumées.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/274/saint-chinian"},"281":{"h":"<p><b>Couleurs produites :<\/b> blanc, rosé et rouge. Le rosé est la couleur dominante de l'appellation.<\/p><p><b>Cépages :<\/b> Cabernet-sauvignon, Carignan, Cinsault, Clairette, Grenache, Mourvèdre, Rolle (vermentino), Sémillon, Shiraz, Syrah, Tibouren, Ugni blanc et Vermentino.<\/p><p><b>Robe :<\/b><\/p><p><b>Rosé :<\/b> robe limpide et fluide, du rose pâle au rose franc, en passant par l'orange clair, le saumon et le rose pivoine.<\/p><p><b>Rouge :<\/b> pourpre à reflets violets dans la jeunesse, qui tire vers le rubis avec l'élevage.<\/p><p><b>Blanc :<\/b> jaune pâle, brillant, à reflets verts.<\/p><p><b>Nez :<\/b><\/p><p><b>Rosé :<\/b> intense ou discret, pouvant être fruité, floral, végétal, empyreumatique ou balsamique.<\/p><p><b>Rouge :<\/b> fruits rouges et notes végétales (laurier, thym, romarin, tabac) quand il est jeune ; fruits noirs, épices et notes animales avec l'âge.<\/p><p><b>Blanc :<\/b> discret, floral, fruité (agrumes), épicé (poivre) ou balsamique (résine).<\/p><p><b>Bouche :<\/b><\/p><p><b>Rosé :<\/b> sec, rond et structuré, mais frais et gouleyant, avec un équilibre délicat entre acidité, alcool et tanins.<\/p><p><b>Rouge :<\/b> léger et souple, ou plus rustique ; certains vins sont bien structurés et puissants.<\/p><p><b>Blanc :<\/b> structuré, avec une finale fraîche.<\/p><p><b>Potentiel de garde :<\/b><\/p><p><b>Rosé et blanc :<\/b> à boire jeunes.<\/p><p><b>Rouge :<\/b> 5 à 8 ans.<\/p><p><b>Température de service :<\/b><\/p><p><b>Rosé :<\/b> 10 à 12 °C<\/p><p><b>Blanc :<\/b> 10 à 12 °C<\/p><p><b>Rouge :<\/b> 14 °C<\/p><p><b>Accords mets-vins :<\/b> daube, civet, sauté d'agneau, grillades aux aromates, apéritif, charcuterie, entrées (tomates-mozzarella, fleurs de courgette), poissons (rouget, bouillabaisse), viandes rouges ou blanches, fromages (pâtes molles, banon, pélardon, chèvre), desserts (crème brûlée, fraises), entrée froide provençale, poisson grillé ou à la crème.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/281/cotes-de-provence"},"284":{"h":"<p><b>Couleurs produites :<\/b> rouge, rosé et blanc.<\/p><p><b>Cépages principaux :<\/b> carignan, cinsault, clairette, grenache, mourvèdre, sauvignon, shiraz, syrah et ugni blanc.<\/p><p><b>Robe<\/b><\/p><p><i>Rouge :<\/i> pourpre dans la jeunesse, puis tons rubis et grenat foncé avec la garde en bouteille.<\/p><p><i>Rosé :<\/i> pâle, de teinte églantine ou saumonée.<\/p><p><i>Blanc :<\/i> jaune paille clair.<\/p><p><b>Nez (arômes)<\/b><\/p><p><i>Rouge :<\/i> d'abord agrestes (cassis, framboise, mûre, pivoine, héliotrope), puis après 4 à 5 ans de bouteille truffe, sous-bois, réglisse, cannelle et musc.<\/p><p><i>Rosé :<\/i> fruits rouges ou couple pêche-abricot, avec parfois des nuances d'ananas, de fenouil ou de menthe.<\/p><p><i>Blanc :<\/i> soit fruité (pamplemousse, fruits secs), soit floral (tilleul, fleurs jaunes comme le genêt).<\/p><p><b>Bouche<\/b><\/p><p><i>Rouge :<\/i> tanins de mourvèdre qui s'assouplissent et s'arrondissent avec le temps, sur fond de réglisse ou cannelle, avec une note de truffe.<\/p><p><i>Rosé :<\/i> légers et frais, mais pouvant gagner en structure et en longévité grâce au mourvèdre.<\/p><p><i>Blanc :<\/i> très vifs et frais, parfois plus puissants et onctueux, de type « vins de bouche ».<\/p><p><b>Potentiel de garde<\/b><\/p><p><i>Rouge :<\/i> 10 à 15 ans et plus.<\/p><p><i>Rosé :<\/i> 1 à 3 ans.<\/p><p><i>Blanc :<\/i> 1 à 3 ans.<\/p><p><b>Température de service<\/b><\/p><p><i>Rouge :<\/i> 16 à 18 °C.<\/p><p><i>Rosé :<\/i> 8 à 10 °C.<\/p><p><i>Blanc :<\/i> 11 à 12 °C.<\/p><p><b>Accords mets-vins<\/b><\/p><p><i>Rouge :<\/i> gibier, daube, agneau grillé, dessert au chocolat.<\/p><p><i>Rosé (déduit, non indiqué explicitement) :<\/i> bouillabaisse, soupe de poisson, gambas et rougets grillés, tomate à l'ail, apéritif aux olives, anchoïade, pissaladière.<\/p><p><i>Blanc (déduit, non indiqué explicitement) :<\/i> poisson, fromages.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/284/bandol"},"290":{"h":"<p><b>Couleurs produites :<\/b><\/p><p><b>Rouge<\/b><\/p><p><b>Rosé<\/b><\/p><p><b>Blanc<\/b><\/p><p><b>Cépages :<\/b> Grenache, Malvoisie, Nielluccio (aussi appelé Niellucciu), Sangiovese, Sciaccarello (Sciaccarellu), Ugni blanc. La page cite aussi le Vermentino pour les blancs.<\/p><p><b>Robe :<\/b><\/p><p><b>Rouge :<\/b> rouge rubis profond, soutenue.<\/p><p><b>Rosé :<\/b> relativement soutenue, grâce au Nielluccio.<\/p><p><b>Blanc :<\/b> généralement peu colorée.<\/p><p><b>Nez (arômes) :<\/b><\/p><p><b>Rouge :<\/b> épicé, presque poivré, avec des fruits comme la framboise et le cassis, parfois des notes animales.<\/p><p><b>Rosé :<\/b> épices et fruits printaniers comme la fraise et la cerise.<\/p><p><b>Blanc :<\/b> très intense, avec des fleurs blanches et des fruits exotiques.<\/p><p><b>Bouche :<\/b><\/p><p><b>Rouge :<\/b> belle charpente, mais il faut attendre trois à quatre ans pour qu'il révèle ses qualités.<\/p><p><b>Rosé :<\/b> degré alcoolique élevé (apporté par le Grenache), frais et savoureux, à boire jeune.<\/p><p><b>Blanc :<\/b> sensation douce et soyeuse, gras, avec une acidité naturellement faible.<\/p><p><b>Potentiel de garde :<\/b><\/p><p><b>Rouge :<\/b> environ 5 ans.<\/p><p><b>Rosé :<\/b> à boire jeune.<\/p><p><b>Blanc :<\/b> 2 à 3 ans.<\/p><p><b>Température de service :<\/b><\/p><p><b>Rouge :<\/b> 16 à 19 °C<\/p><p><b>Rosé :<\/b> 10 à 12 °C<\/p><p><b>Blanc :<\/b> 10 à 12 °C<\/p><p><b>Accords mets-vins :<\/b><\/p><p><b>Rouge :<\/b> daube, fromages corses, tarte au brocciu.<\/p><p><b>Rosé :<\/b> salades, poisson grillé, cuisine orientale.<\/p><p><b>Blanc :<\/b> apéritif, poisson en sauce, fromages, desserts.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/290/patrimonio"},"291":{"h":"<p><b>Couleurs produites :<\/b> rouge uniquement.<\/p><p><b>Cépages :<\/b> côt (malbec, aussi appelé auxerrois), jurançon, merlot et tannat, la liste mentionnant aussi le malbec.<\/p><p><b>Robe :<\/b> entre rubis, pourpre et grenat, à reflets violacés, très sombre dans la jeunesse.<\/p><p><b>Nez :<\/b> fruits rouges et noirs (pruneau, mûre, cassis), avec confiture, épices (cannelle, poivre), cacao, sous-bois et une touche de truffe.<\/p><p><b>Bouche :<\/b> puissante et tannique, concentrée tout en restant élégante, équilibrée, grasse et longue. La finale évoque la réglisse, la torréfaction ou la violette. Le vin gagne en rondeur après deux ou trois ans.<\/p><p><b>Potentiel de garde :<\/b> 4 à 8 ans, et 10 ans ou plus pour les grands millésimes.<\/p><p><b>Température de service :<\/b> 17 à 18 °C.<\/p><p><b>Accords mets-vins :<\/b> charcuterie, confit de canard, gibier, cassoulet, champignons, et fromages comme le bleu d'Auvergne ou le roquefort.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/291/cahors"},"304":{"h":"<p><b>Couleurs produites :<\/b> blanc (vins tranquilles, moelleux, liquoreux ou secs).<\/p><p><b>Cépages :<\/b> courbu, gros manseng et petit manseng, ce dernier marquant surtout la personnalité des vins.<\/p><p><b>Robe :<\/b><\/p><p>Moelleux : or, allant du jaune doré aux reflets verts dans les vins jeunes à un vieil or pour les bouteilles longuement gardées.<\/p><p>Sec : pâle, mêlant jaune doré et vert.<\/p><p><b>Nez :<\/b> signature de miel, accompagnée d'épices (muscade, girofle), de fleurs blanches et de fruits confits. Le petit manseng apporte des fruits mûrs (pêche) et de la cannelle. Le sec reprend certaines notes miellées et épicées, moins marquées, avec des arômes floraux (genêt) et de fruits exotiques.<\/p><p><b>Bouche :<\/b><\/p><p>Moelleux : caractère propre à chaque producteur, avec un équilibre entre sucres résiduels et vivacité, une belle concentration et de la délicatesse.<\/p><p>Sec : fruité et élégant, légèrement perlant, à structure ronde et soyeuse, se terminant sur une note vive.<\/p><p><b>Potentiel de garde :<\/b> jusqu'à 20 ans pour les moelleux, environ 5 ans pour les secs.<\/p><p><b>Température de service :<\/b> 10 à 12 °C pour les blancs.<\/p><p><b>Accords mets-vins :<\/b><\/p><p>Les pages mentionnent des plats proposés pour le jurançon : cassolettes de moules au safran, colombo de porc et mousse aux fruits. Les listes d'appellations associées à ces recettes semblent être des données de remplissage et ne sont pas fiables.<\/p><p>Dans les fiches de dégustation, un liquoreux est associé à un fromage persillé, et un sec à des noix de Saint-Jacques poêlées.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/304/jurancon"},"307":{"h":"<p><b>Couleurs produites :<\/b> rouge uniquement.<\/p><p><b>Cépages :<\/b> tannat (dominant), cabernet franc, cabernet-sauvignon, fer-servadou, mansois et pinenc.<\/p><p><b>Robe :<\/b> très foncée, d'un « rubis sombre ».<\/p><p><b>Nez :<\/b> framboise comme note la plus caractéristique, accompagnée de fruits noirs ou rouges et de genièvre.<\/p><p><b>Bouche :<\/b> vinifiés avec une cuvaison courte, les madiran sont souples, frais, parfumés et fruités, à boire jeunes. La plupart, élevés en barrique, demandent quelques années de garde. Une fois mûrs, ils deviennent sensuels et charnus, avec des arômes d'épices, de fruits noirs et de pain grillé.<\/p><p><b>Potentiel de garde :<\/b> 5 à 10 ans.<\/p><p><b>Température de service :<\/b> 16 à 17 °C pour le rouge.<\/p><p><b>Accords mets-vins :<\/b> cassoulet, confit, magret de canard, gibier, fromages de brebis des Pyrénées et bleu d'Auvergne.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/307/madiran"},"311":{"h":"<p><b>Couleurs produites :<\/b> rouge, rosé et blanc (blanc sec).<\/p><p><b>Cépages :<\/b> cabernet franc, cabernet-sauvignon, côt (malbec), malbec, mérille, merlot, muscadelle, sauvignon, sémillon et ugni blanc.<\/p><p><b>Robe<\/b><\/p><p><b>Rouge :<\/b> couleur vive et brillante, d'intensité soutenue.<\/p><p><b>Rosé :<\/b> allant du gris au clairet.<\/p><p><b>Blanc sec :<\/b> pâle et limpide, avec des reflets tilleul quand il est jeune.<\/p><p><b>Nez (arômes)<\/b><\/p><p><b>Rouge :<\/b> bouquet simple et chaleureux. Les meilleurs peuvent présenter des notes de fruits rouges et noirs, comme la groseille, le cassis ou la griotte.<\/p><p><b>Rosé :<\/b> cassis, framboise, grenadine et violette.<\/p><p><b>Blanc sec :<\/b> gamme aromatique large selon la part de sauvignon : agrumes, fleurs séchées, boisé, épices.<\/p><p><b>Bouche<\/b><\/p><p><b>Rouge :<\/b> vin souple, à boire assez vite. L'élevage en barrique donne des vins plus structurés, aux arômes grillés.<\/p><p><b>Rosé :<\/b> agréable, souple et aromatique.<\/p><p><b>Blanc sec :<\/b> assez vif et aromatique, sans type unique défini en raison de la diversité des terroirs et des vinifications.<\/p><p><b>Potentiel de garde<\/b><\/p><p><b>Rouge :<\/b> 2 à 5 ans.<\/p><p><b>Rosé :<\/b> 2 ans.<\/p><p><b>Blanc sec :<\/b> jusqu'à 3 ans.<\/p><p><b>Température de service<\/b><\/p><p><b>Blanc :<\/b> 10 à 12 °C.<\/p><p><b>Rosé :<\/b> 10 à 12 °C.<\/p><p><b>Rouge :<\/b> 12 à 14 °C.<\/p><p><b>Accords mets-vins :<\/b> grillades, volaille rôtie, entrées, charcuterie, fruits de mer et poisson.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/311/bergerac"},"323":{"h":"<p><b>Couleurs produites :<\/b> rouge (largement majoritaire), rosé et blanc.<\/p><p><b>Cépages :<\/b> carignan, cinsault, clairette, counoise, grenache (blanc et noir), marsanne, mourvèdre, roussanne (aussi appelée bergeron), shiraz, syrah et viognier.<\/p><p><b>Robe :<\/b> rouge clair à rubis, plus profond quand la syrah domine ; rosé délicat aux reflets violets ; blanc jaune, limpide et brillant.<\/p><p><b>Nez :<\/b> rouges discrets aux petits fruits rouges, pouvant aller vers des notes animales, épicées ou de fruits mûrs ; rosés intenses de bonbon anglais, petits fruits rouges et violette ; blancs aux fleurs très fines.<\/p><p><b>Bouche :<\/b> rouges de sols légers (Puymeras, Nyons, Sabran, Bourg-Saint-Andéol) souples et coulants, et de zones plus chaudes (Domazan, Courthézon, Orange) aux tanins structurés mais souples ; rosés finissant sur une longue note de fruits rouges ; blancs ronds, pleins, équilibrés et persistants.<\/p><p><b>Potentiel de garde :<\/b> rouge 2 à 4 ans ; blanc 1 à 3 ans ; rosé à boire jeune.<\/p><p><b>Température de service :<\/b> blanc et rosé 10 à 12 °C ; rouge 14 à 16 °C.<\/p><p><b>Accords mets-vins :<\/b> viandes grillées (bœuf, agneau), fromages (neufchâtel, bleu de Gex, picodon), salade niçoise, charcuterie, poisson de mer à la crème.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/323/cotes-du-rhone"},"325":{"h":"<p><b>Couleurs produites :<\/b> rouge uniquement.<\/p><p><b>Cépages :<\/b> principalement syrah, avec un peu de viognier (moins de 20 %) ajouté en vinification. La page cite aussi le shiraz, qui désigne la même variété.<\/p><p><b>Robe :<\/b> colorée et soutenue, grenat dans la jeunesse, qui tire vers l'orangé avec le vieillissement.<\/p><p><b>Nez :<\/b> jeune, fruits noirs frais (mûre, myrtille, cassis) et épices douces. Le viognier apporte des notes florales de violette. En vieillissant, il évolue vers des fruits cuits ou confits (griotte, cerise à l'eau-de-vie) et des arômes empyreumatiques.<\/p><p><b>Bouche :<\/b> plus fine que celle d'autres vins septentrionaux de la région, élégante. Les tanins sont présents mais deviennent soyeux après quelques années. Le viognier peut renforcer le gras et la rondeur. L'élevage en bois affine les arômes.<\/p><p><b>Potentiel de garde :<\/b> 5 à 20 ans.<\/p><p><b>Température de service :<\/b> 16 à 18 °C.<\/p><p><b>Accords mets-vins :<\/b> terrine, petit gibier (faisan, canard), navarin d'agneau, pigeon aux épices, dinde aux marrons, fromages comme le munster ou le livarot.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/325/cote-rotie"},"326":{"h":"<p><b>Caractéristiques de l'appellation Condrieu (vin blanc)<\/b><\/p><p><b>Couleurs produites :<\/b> blanc uniquement.<\/p><p><b>Cépages :<\/b> viognier, le seul cépage autorisé.<\/p><p><b>Robe :<\/b> jaune paille à doré, avec de légers reflets verts. L'intensité augmente avec la maturité.<\/p><p><b>Nez :<\/b> jeune, il domine par les fruits frais (abricot, pêche) et des notes florales, comme la violette. Avec la maturité apparaissent des notes miellées, grillées ou minérales. Plus âgé, il évolue vers les fruits secs.<\/p><p><b>Bouche :<\/b> l'acidité est masquée par les autres sensations. Le vin offre une texture suave, grasse et ronde.<\/p><p><b>Potentiel de garde :<\/b> 1 à 5 ans.<\/p><p><b>Température de service :<\/b> 12 à 14 °C.<\/p><p><b>Accords mets-vins :<\/b> cuisses de grenouille, poisson de rivière, friture de goujons, quenelles de brochet, asperges à la sauce mousseline et tarte aux abricots. La page cite aussi des plats à base de poisson, de crustacés ou de porc au curry, comme les gambas ou le colombo de porc.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/326/condrieu"},"328":{"h":"<p><b>Couleurs produites :<\/b> rouge et blanc. Le rosé n'est pas mentionné.<\/p><p><b>Cépages :<\/b> marsanne, roussanne (ou bergeron), shiraz et syrah.<\/p><p><b>Robe :<\/b><\/p><p><i>Rouge :<\/i> assez soutenue, de teinte grenat dans la jeunesse, puis plus orangée avec le vieillissement.<\/p><p><i>Blanc :<\/i> claire, à reflets verts en début de vie, puis à reflets plus ou moins dorés après évolution.<\/p><p><b>Nez :<\/b><\/p><p><i>Rouge :<\/i> riche et fin, avec des arômes de fruits rouges frais quand il est jeune, parfois un cassis très marqué. Avec l'âge, des fruits mûrs voire cuits, accompagnés de notes épicées, poivrées.<\/p><p><i>Blanc :<\/i> élégant et subtil, avec des notes florales proches de fleurs mellifères, comme l'aubépine. Avec le temps, des arômes épicés apparaissent, plus marqués dans les vins élevés en fût de chêne.<\/p><p><b>Bouche :<\/b><\/p><p><i>Rouge :<\/i> tanins élégants et fins, avec une impression de rondeur et de gras. L'acidité est souvent discrète, ce qui donne une texture veloutée.<\/p><p><i>Blanc :<\/i> équilibre entre acidité et moelleux. Dans les meilleurs terroirs, le caractère gras et rond l'emporte sur la vivacité. Les vinifications traditionnelles accentuent souvent cet aspect grâce à la fermentation malolactique.<\/p><p><b>Potentiel de garde :<\/b> 3 à 10 ans.<\/p><p><b>Température de service :<\/b><\/p><p>Blanc : 12 à 14 °C<\/p><p>Rouge : 16 à 18 °C<\/p><p><b>Accords mets-vins :<\/b><\/p><p>Viandes blanches ou rouges grillées, lièvre à la royale.<\/p><p>Poissons en sauce.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/328/saint-joseph"},"329":{"h":"<p><b>Couleurs produites :<\/b> blanc et rouge.<\/p><p><b>Cépages :<\/b> principaux cépages cités : marsanne, roussanne (aussi appelée bergeron), shiraz et syrah. La syrah domine les rouges, la marsanne les blancs.<\/p><p><b>Robe :<\/b><\/p><p><i>Rouge :<\/i> violet rouge, proche de la couleur d'une cerise burlat bien mûre.<\/p><p><i>Blanc :<\/i> couleur claire et légère.<\/p><p><b>Nez (arômes) :<\/b><\/p><p><i>Rouge :<\/i> fruits rouges et noirs bien mûrs, notes fumées et grillées, sous-bois, tourbe et humus, épices, réglisse et fleurs comme la pivoine.<\/p><p><i>Blanc :<\/i> amande, fruit de la passion et fleurs blanches.<\/p><p><b>Bouche :<\/b><\/p><p><i>Rouge :<\/i> tanins ronds et fondus, finesse et élégance, moins puissants que ceux de l'hermitage mais plus souples dès la jeunesse.<\/p><p><i>Blanc :<\/i> fraîcheur recherchée dans les versions à boire jeunes, avec une acidité généralement discrète et un bon équilibre.<\/p><p><b>Potentiel de garde :<\/b> 2 à 5 ans.<\/p><p><b>Température de service :<\/b> blanc 12 à 14 °C ; rouge 16 à 18 °C.<\/p><p><b>Accords mets-vins :<\/b> charcuterie, cuisine assez relevée, crudités et poisson d'eau douce. La page propose aussi plusieurs recettes associées à l'appellation, mais sans précision de couleur.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/329/crozes-hermitage"},"330":{"h":"<p><b>Rouge<\/b><\/p><p><b>Couleurs produites :<\/b> rouge (et blanc, pour l'appellation dans son ensemble).<\/p><p><b>Cépages :<\/b> Syrah, principal cépage rouge (la page cite aussi la Shiraz, son synonyme).<\/p><p><b>Robe :<\/b> très soutenue et grenat dans la jeunesse, puis plus orangée avec l'âge.<\/p><p><b>Nez :<\/b> jeune, violette et fruits rouges. Avec le temps, fruits cuits (pruneau), épices, sous-bois et notes animales.<\/p><p><b>Bouche :<\/b> puissance tannique alliée à beaucoup de finesse.<\/p><p><b>Potentiel de garde :<\/b> 5 à 20 ans, jusqu'à 30 ans pour les grands millésimes.<\/p><p><b>Température de service :<\/b> 16 à 18 °C.<\/p><p><b>Accords mets-vins :<\/b> filet de bœuf à la provençale, cuisine relevée (la page ne précise pas la couleur associée à cet accord, je l'ai rattaché au rouge par inférence).<\/p><p><b>Blanc<\/b><\/p><p><b>Couleurs produites :<\/b> blanc (voir ci-dessus).<\/p><p><b>Cépages :<\/b> Marsanne et Roussanne (ou bergeron).<\/p><p><b>Robe :<\/b> jeune, claire avec des reflets verts, puis plus soutenue et dorée à maturité.<\/p><p><b>Nez :<\/b> jeune, très floral (fleurs blanches, aubépine). Avec la maturité, notes grillées, miel et cire.<\/p><p><b>Bouche :<\/b> peu marquée par l'acidité, très grasse et ample, avec un style particulier.<\/p><p><b>Potentiel de garde :<\/b> 3 à 5 ans, davantage pour les grands millésimes.<\/p><p><b>Température de service :<\/b> 12 à 14 °C.<\/p><p><b>Accords mets-vins :<\/b> poisson en sauce, volaille rôtie (rattachement au blanc par inférence).<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/330/hermitage"},"331":{"h":"<p><b>Couleurs produites :<\/b> rouge uniquement.<\/p><p><b>Cépages :<\/b> syrah, principal cépage et seul cépage typique de l'appellation. Le site mentionne aussi son synonyme shiraz.<\/p><p><b>Robe :<\/b> rouge très intense et profond, pouvant évoquer un « vin noir ». Avec l'âge, elle prend des nuances tuilées.<\/p><p><b>Nez :<\/b> jeune, il dégage des fruits rouges ou noirs (mûre, cerise), avec des notes de sous-bois, d'épices et de poivre, et reste discret. Après cinq à six ans, il gagne en complexité : cuir, sous-bois, tabac, parfois truffe.<\/p><p><b>Bouche :<\/b> équilibre entre puissance et structure. La syrah y est très expressive, avec une chaleur marquée parfois masquée par les tanins. Jeunes, les vins sont rustiques ; leurs tanins s'affinent après plusieurs années.<\/p><p><b>Potentiel de garde :<\/b> 5 à 20 ans.<\/p><p><b>Température de service :<\/b> 16 à 18 °C.<\/p><p><b>Accords mets-vins :<\/b> lièvre à la royale, gigue de chevreuil, bœuf en daube, côte de bœuf, et fromages comme le bleu des Causses.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/331/cornas"},"333":{"h":"<p><b>Couleurs produites :<\/b> rouge et rosé. Le rouge domine nettement, le rosé ne représentant qu'une très faible part de la production.<\/p><p><b>Cépages :<\/b> cinsault, grenache, mourvèdre, shiraz, syrah. Le grenache noir est le cépage principal de l'orientation viticole.<\/p><p><b>Robe :<\/b><\/p><p>Rouge : sombre et soutenue, parfois austère. Avec l'âge, elle prend des reflets tuilés.<\/p><p>Rosé : teinte également soutenue.<\/p><p><b>Nez :<\/b><\/p><p>Rouge : d'abord des fruits rouges et noirs (mûre, cassis), des fruits à noyau et du kirsch. Viennent ensuite des notes de torréfaction (café, cacao), d'épices, de réglisse et de fruits confits. Les millésimes anciens développent des notes animales (cuir, fourrure, gibier).<\/p><p>Rosé : fruits cuits et amande grillée.<\/p><p><b>Bouche :<\/b><\/p><p>Rouge : très charpentée, surtout jeune, avec des tanins qui demandent un long vieillissement. La puissance et l'alcool compensent une acidité modeste.<\/p><p>Rosé : capiteux et élégant.<\/p><p><b>Potentiel de garde :<\/b> rouge de 8 à 10 ans ; rosé de 1 à 3 ans.<\/p><p><b>Température de service :<\/b> rouge de 15 à 16 °C ; rosé autour de 10 °C.<\/p><p><b>Accords mets-vins :<\/b> gibier (lièvre, marcassin, canard), bœuf en daube, charcuterie et grillades.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/333/gigondas"},"334":{"h":"<p><b>Châteauneuf-du-Pape (reformulé)<\/b><\/p><p><b>Couleurs produites :<\/b> rouge et blanc.<\/p><p><b>Cépages principaux :<\/b> cinsault, clairette, grenache (noir et blanc), mourvèdre, muscardin, picardan, picpoul, piquepoul (picpoule), roussanne (bergeron), shiraz, syrah, terret et vaccarèse.<\/p><p><b>Robe<\/b><\/p><p><i>Rouge :<\/i> couleur toujours intense, rubis et brillante quand le vin est jeune, avec des nuances orangées dans les millésimes anciens.<\/p><p><i>Blanc :<\/i> couleur vive, du jaune clair au jaune plus soutenu, très brillante.<\/p><p><b>Nez (arômes)<\/b><\/p><p><i>Rouge :<\/i> puissant, fin et complexe. Fruits mûrs, truffe, champignon et sous-bois, avec des notes épicées et sauvages de garrigue.<\/p><p><i>Blanc :<\/i> jeune, fleurs blanches délicates, fruits (agrumes, abricot, poire) et touche exotique (mangue, fruit de la passion). Après environ cinq ans, il évolue vers le miel et la cire d'abeille.<\/p><p><b>Bouche<\/b><\/p><p><i>Rouge :<\/i> puissance et matière. Épices (réglisse, poivre, cannelle), fruits (cassis, fruits à l'eau-de-vie, coing, fruits cuits), notes sauvages, parfois animales, et longue persistance.<\/p><p><i>Blanc :<\/i> ampleur et rondeur, notes fleuries et fruitées, parfois fruits secs grillés et discrète touche boisée.<\/p><p><b>Potentiel de garde<\/b><\/p><p><i>Rouge :<\/i> 5 à 20 ans.<\/p><p><i>Blanc :<\/i> 1 à 10 ans.<\/p><p><b>Température de service<\/b><\/p><p><i>Rouge :<\/i> 16 à 18 °C.<\/p><p><i>Blanc :<\/i> 10 à 12 °C.<\/p><p><b>Accords mets-vins<\/b><\/p><p><i>Rouge :<\/i> plats de viande en sauce ou grillée, comme le bœuf en daube, le steak au poivre, le civet de lièvre, la gigue de chevreuil, ou encore le risotto aux champignons.<\/p><p><i>Blanc :<\/i> crustacés, saumon grillé, brandade de morue, côte de veau aux girolles.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/334/chateauneuf-du-pape"},"336":{"h":"<p><b>Couleur produite :<\/b> uniquement du rosé.<\/p><p><b>Cépages :<\/b> grenache, cinsault, mourvèdre et syrah, complétés par du carignan et parfois des cépages blancs. La fiche technique mentionne aussi calitor, clairette, picpoul, piquepoul et shiraz.<\/p><p><b>Robe :<\/b> rose pâle et éclatante quand le vin est jeune. Après un an, elle prend des reflets dorés pâles, puis évolue vers le cuivre et l'ambré.<\/p><p><b>Nez :<\/b> fleurs, petits fruits rouges, fruits à noyau et une touche d'amande fraîche. Après un an de garde, apparaissent des fruits mûrs, de l'amande grillée et des épices. Avec le temps, il s'orne de notes de madère et de réglisse.<\/p><p><b>Bouche :<\/b> chaleureuse, avec des saveurs de fruits à noyau, d'amande, d'épices et de pain grillé. Sa rondeur vient des cépages et d'une macération à froid de 12 à 48 heures. La persistance en bouche est longue.<\/p><p><b>Potentiel de garde :<\/b> 2 à 3 ans.<\/p><p><b>Température de service :<\/b> 10 °C.<\/p><p><b>Accords mets-vins :<\/b> apéritif, charcuterie, artichaut, barbecue et soufflé au jambon.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/336/tavel"},"345":{"h":"<p><b>Couleurs produites :<\/b> blanc, rosé et rouge.<\/p><p><b>Cépages :<\/b> carignan, grenache (blanc, gris et noir), macabeu (aussi appelé maccabéo) et malvoisie.<\/p><p><b>Robe :<\/b> les rimages sont d'un rubis profond. Les vins élevés passent du tuilé au brun acajou. Une oxydation poussée peut donner une teinte café ou des reflets verts, signe du caractère rancio.<\/p><p><b>Nez :<\/b> puissant. Les rimages évoquent le raisin mûr, la cerise, le kirsch, la mûre et les fruits rouges. Les vins élevés vont vers les fruits cuits et secs, avec des notes grillées, épicées, de café, de cuir et de noix.<\/p><p><b>Bouche :<\/b> les rimages sont fruités, charnus, avec des tanins puissants et une finale fraîche. Après élevage, on trouve pruneau, eau-de-vie, café torréfié, fruits secs, cacao, figue et tabac. L'alcool et les tanins s'équilibrent et la texture devient veloutée.<\/p><p><b>Potentiel de garde :<\/b> plusieurs décennies pour les VDN rouges et blancs. Les VDN rosés se boivent jeunes.<\/p><p><b>Température de service :<\/b> 14 à 15 °C pour les blancs, rosés et rouges.<\/p><p><b>Accords mets-vins :<\/b> apéritif ou dessert, en particulier avec le chocolat. Le vin accompagne aussi le foie gras, les fromages persillés, le café ou le cigare.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/345/banyuls"},"953":{"h":"<p><b>Couleurs produites :<\/b> blanc uniquement.<\/p><p><b>Cépages :<\/b> chardonnay.<\/p><p><b>Robe :<\/b> or pâle, tirant sur un or cendré, avec parfois des reflets verts.<\/p><p><b>Nez :<\/b> fleurs d'aubépine, acacia, chèvrefeuille et genêt ; citronnelle, pêche blanche et notes mentholées ; verveine, fougère, amande, pin et coing confit.<\/p><p><b>Bouche :<\/b> vive et fraîche, mais ronde et charmeuse. Le chardonnay y est particulièrement harmonieux.<\/p><p><b>Potentiel de garde :<\/b> 5 à 6 ans.<\/p><p><b>Température de service :<\/b> 11 à 13 °C.<\/p><p><b>Accords mets-vins :<\/b> cuisses de grenouilles, escargots, andouillette au vin blanc, jambon persillé, volaille de Bresse à la crème et fromages de chèvre.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/953/vire-clesse"},"457":{"h":"<p><b>Couleurs produites :<\/b> blanc et rosé.<\/p><p><b>Cépages :<\/b> pinot blanc, auxerrois, pinot gris, riesling, chardonnay et pinot noir. Le pinot noir sert aux rosés et, plus rarement, aux blancs de noirs. Le pinot blanc est le plus utilisé.<\/p><p><b>Robe :<\/b><\/p><p>Blanc : jaune pâle, animé de fines bulles.<\/p><p>Rosé : nuances framboise, avec une mousse très fine.<\/p><p><b>Nez (arômes) :<\/b><\/p><p>Blanc : agrumes, fleurs blanches, fruits blancs et jaunes, avec des notes briochées ou fumées.<\/p><p>Rosé : petits fruits rouges intenses.<\/p><p><b>Bouche :<\/b> généralement équilibrée, fraîche et délicate. Le pinot blanc apporte légèreté et fruité, le riesling de la vivacité, et les pinots gris et noir de la richesse et de l'ampleur.<\/p><p><b>Potentiel de garde :<\/b> à boire jeune. Aucune durée en années n'est indiquée.<\/p><p><b>Température de service :<\/b> blanc et rosé entre 6 et 8 °C.<\/p><p><b>Accords mets-vins :<\/b><\/p><p>Apéritif, desserts (sorbet aux fruits rouges, tarte aux framboises, charlotte aux fraises).<\/p><p>Apéritif, fruits de mer, poissons, viandes blanches, fromages à pâte molle et à croûte fleurie (brie), desserts.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/457/cremant-d-alsace"},"460":{"h":"<p><b>Couleurs produites :<\/b> blanc et rosé, tous deux effervescents.<\/p><p><b>Cépages :<\/b> cabernet franc, cabernet-sauvignon, chardonnay, chenin (pineau de la Loire), grolleau, groslot, pineau d'aunis, pinot (noir).<\/p><p><b>Robe :<\/b> blanc jaune plus ou moins pâle, avec des reflets argentés ou dorés. Rosé allant du saumon pâle au rose foncé tirant sur la framboise ou la cerise.<\/p><p><b>Nez :<\/b> blanc aux arômes complexes de fleurs blanches, de fruits à chair blanche ou jaune, de fruits secs, avec des notes briochées, beurrées et miellées. Rosé aux parfums de fraise, framboise, groseille et autres petits fruits rouges.<\/p><p><b>Bouche :<\/b> blanc ample, généreux et frais, aux saveurs fruitées. Rosé gourmand, frais et rond.<\/p><p><b>Potentiel de garde :<\/b> « À boire jeune » (pas de durée en années indiquée).<\/p><p><b>Température de service :<\/b> blanc et rosé entre 6 et 8 °C.<\/p><p><b>Accords mets-vins :<\/b> apéritif, gâteau au chocolat et tarte aux framboises ; apéritif, poissons, viandes blanches et crumble aux pommes. La page ne précise pas à quelle couleur correspond chaque suggestion.<\/p><p>Les fiches recettes associées à l'appellation (cake au saumon, clafoutis, far aux pruneaux, tiramisu, tarte au citron, etc.) contiennent un texte d'exemple sans contenu utile, je ne les retiens donc pas comme accords fiables.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/460/cremant-de-loire"},"462":{"h":"<p><b>Couleurs produites :<\/b> blanc uniquement.<\/p><p><b>Cépages :<\/b> melon de Bourgogne, indiqué comme cépage principal.<\/p><p><b>Robe :<\/b> pâle, à reflets vert doré. Elle peut montrer des bulles légères lorsque le vin a été élevé sur lie. Dans les secteurs de sols basiques, comme Vallet et Mouzillon, des reflets bronze peuvent apparaître.<\/p><p><b>Nez :<\/b> arômes fruités et muscatés, parfois dominants. Le cru Clisson rappelle les fruits mûrs, Gorges les notes minérales et Le Pallet les fleurs.<\/p><p><b>Bouche :<\/b> vin assez charpenté, alliant rondeur et fraîcheur minérale, avec une légère astringence. Clisson est concentré et riche en fruits mûrs ou cuits. Gorges est puissant en attaque, avec de l'acidité et une fine amertume. Le Pallet est suave et d'une belle finesse florale.<\/p><p><b>Potentiel de garde :<\/b> 2 à 5 ans, davantage pour les grands millésimes.<\/p><p><b>Température de service :<\/b> 8 à 11 °C.<\/p><p><b>Accords mets-vins :<\/b> langoustines grillées, poisson au beurre blanc, volaille en sauce, fromage de chèvre, Pont-l'Évêque et reblochon (version sur lie).<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/462/muscadet-sevre-et-maine"},"473":{"h":"<p><b>Couleurs produites :<\/b> Blanc uniquement, un vin blanc sec.<\/p><p><b>Cépages :<\/b> Le chenin, appelé aussi pineau de la Loire.<\/p><p><b>Robe :<\/b> Jaune pâle, avec des nuances allant du reflet vert des vins jeunes à l'or des millésimes chauds.<\/p><p><b>Nez :<\/b> Fleurs blanches, notamment l'acacia, accompagnées de notes minérales et parfois de tilleul et de camomille. Après aération, les fruits mûrs ou secs dominent.<\/p><p><b>Bouche :<\/b> Équilibrée, avec un bon compromis entre rondeur et fraîcheur, et entre structure et délicatesse.<\/p><p><b>Potentiel de garde :<\/b> 10 à 20 ans.<\/p><p><b>Température de service :<\/b> 10 à 12 °C.<\/p><p><b>Accords mets-vins :<\/b> Apéritif, andouillette au vin blanc, poissons cuisinés (lotte, carrelet) et viande blanche (poulet à l'angevine). La page cite aussi des recettes associées à l'appellation : blanquette de lotte en cassolette, écrevisses au gratin, endives au jambon et matelote au riesling.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/473/savennieres"},"483":{"h":"<p><b>Couleurs produites :<\/b> Rouge uniquement. La page ne mentionne ni rosé ni blanc pour cette appellation.<\/p><p><b>Cépages :<\/b> Le cabernet franc, aussi appelé breton, est le cépage principal. Il peut être complété par du cabernet-sauvignon.<\/p><p><b>Robe :<\/b> Rouge rubis franc, intense et brillant. Avec l'âge, elle prend des reflets plus sombres et tire vers le grenat.<\/p><p><b>Nez :<\/b> Dans les vins jeunes, dominent les fruits rouges et noirs (framboise, mûre, cassis, groseille), relevés d'épices (muscade, tabac, réglisse) et de notes végétales (menthe, fougère, bourgeon de cassis). On peut parfois sentir du poivron vert. Avec le vieillissement, apparaissent des notes épicées et torréfiées (fumé, grillé), puis des arômes plus profonds (ventre de lièvre, cuir frais, cave de tuffeau).<\/p><p><b>Bouche :<\/b> Tanins souples, qui expliquent la facilité de consommation des vins jeunes. La structure soutient la persistance aromatique, et la qualité des tanins favorise aussi une longue garde.<\/p><p><b>Potentiel de garde :<\/b> 10 ans.<\/p><p><b>Température de service :<\/b> Rouge, entre 12 et 14 °C.<\/p><p><b>Accords mets-vins :<\/b> Andouillette grillée, agneau, bœuf bourguignon, baeckeoffe, poisson (pour un vin jeune), soufflé au fromage, desserts aux fruits rouges et parfois au chocolat.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/483/saumur-champigny"},"490":{"h":"<p><b>Couleurs produites :<\/b> rouge et rosé.<\/p><p><b>Cépages :<\/b> cabernet franc et cabernet-sauvignon.<\/p><p><b>Robe :<\/b><\/p><p>Rouge jeune : brillante, aux nuances cerise, pourpre ou grenat, qui s'ambrent avec le temps.<\/p><p>Rosé : issu de la saignée des cuves rouges, il présente un rose soutenu.<\/p><p><b>Nez :<\/b><\/p><p>Rouge jeune : arômes de cerise, griotte, fraise et cassis, puis de framboise, parfois de réglisse ou de poivron vert. Le nom local du cabernet franc, « breton », désigne ce caractère végétal.<\/p><p>Après quelques années de cave : fruits cuits et épices.<\/p><p>En fin de garde : cuir, fourrure, sous-bois et notes de gibier.<\/p><p>Rosé : palette fraîche de fruits.<\/p><p><b>Bouche :<\/b><\/p><p>Vins de graves : arômes en bouche proches du nez, légèreté et pointe d'acidité finale.<\/p><p>Vins de tuf : tanins enrobés et charnus.<\/p><p>Rosé : structuré et frais, sans l'ampleur des rouges, adapté aux repas d'été.<\/p><p><b>Potentiel de garde :<\/b> 5 à 10 ans.<\/p><p><b>Température de service :<\/b><\/p><p>Rosé : 8 à 10 °C.<\/p><p>Rouge : 14 à 16 °C.<\/p><p><b>Accords mets-vins :<\/b> charcuterie, viande blanche, fromage de sainte-maure et salade de fruits rouges.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/490/bourgueil"},"491":{"h":"<p><b>Couleurs produites :<\/b> rouge (la plus connue de l'appellation), rosé et blanc.<\/p><p><b>Cépages :<\/b> cabernet franc, cabernet-sauvignon et chenin (aussi appelé pineau de la Loire).<\/p><p><b>Robe :<\/b><\/p><p>Rouge : rubis soutenu, généralement pas très foncé, plutôt rubis que pourpre ou grenat.<\/p><p>Rosé : rubis clair.<\/p><p>Blanc : jaune paille clair.<\/p><p><b>Nez (arômes) :<\/b><\/p><p>Rouges et rosés : fruits rouges et fruits à noyau, surtout cassis, framboise, cerise et pruneau, parfois groseille, mûre ou fraise des bois.<\/p><p>Blancs : agrumes, fleurs de giroflée, miel et coing.<\/p><p><b>Bouche :<\/b><\/p><p>Rouges : aromatiques, avec des tanins élégants.<\/p><p>Rosés : bien structurés, avec des arômes floraux persistants.<\/p><p>Blancs : souples, frais, avec une certaine rondeur.<\/p><p><b>Potentiel de garde :<\/b><\/p><p>Rouge : 5 à 10 ans.<\/p><p>Blanc : jusqu'à 5 ans.<\/p><p>Rosé : à boire jeune.<\/p><p><b>Température de service :<\/b><\/p><p>Blanc : 12 °C.<\/p><p>Rosé : 12 °C.<\/p><p>Rouge : 14 à 16 °C.<\/p><p><b>Accords mets-vins :<\/b> viandes rouges, gibier et fromages ; charcuterie, viandes blanches et fromages de chèvre (sainte-maure-de-touraine) ; poisson de rivière.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/491/chinon"},"496":{"h":"<p><b>Couleurs produites :<\/b> Blanc uniquement, en vins tranquilles (secs, demi-secs, moelleux) et effervescents.<\/p><p><b>Cépages :<\/b> Chenin, aussi appelé pineau de la Loire.<\/p><p><b>Robe :<\/b><\/p><p>Sec : pâle, avec des reflets verts.<\/p><p>Moelleux : jaune paille vif quand il est jeune, puis ambré en vieillissant. Certaines années, il est doré.<\/p><p>Effervescent : jaune soutenu, avec de fines bulles.<\/p><p><b>Nez (arômes) :<\/b><\/p><p>Sec : agrumes et fruits blancs comme la pomme et la pêche. Dans les millésimes très mûrs, fruits mûrs, amande et noisette.<\/p><p>Moelleux : jeune, fleurs (acacia, giroflée, rose), fruits frais et miel. Avec l'âge, confiture d'abricot ou de coing.<\/p><p>Effervescent : notes briochées, de noisette ou d'amande, souvent accompagnées de pomme verte.<\/p><p><b>Bouche :<\/b><\/p><p>Sec : pas de fermentation malolactique, donc une vivacité qui apporte de la fraîcheur.<\/p><p>Demi-sec et moelleux : équilibre entre douceur et vivacité, avec une finale longue.<\/p><p>Effervescent : élégant et frais, avec une rondeur qui tempère la vivacité.<\/p><p><b>Potentiel de garde :<\/b><\/p><p>Sec : environ 5 ans.<\/p><p>Moelleux : 10 ans et plus.<\/p><p>Effervescent : à boire jeune.<\/p><p><b>Température de service :<\/b> 10 à 11 °C pour les blancs.<\/p><p><b>Accords mets-vins :<\/b> La page ne détaille pas de section d'accords. Les notes de dégustation des coups de cœur suggèrent les fruits de mer, les saint-jacques et les poissons fins. Les liens de recettes (desserts aux fruits, fromages, volailles, porc) sont présents, mais leurs descriptions sont des textes de substitution et n'apportent pas d'information fiable.<\/p><p><b>Niveaux de sucre indiqués :<\/b> Sec, demi-sec et moelleux, ainsi que des effervescents (brut, par exemple).<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/496/vouvray"},"509":{"h":"<p><b>Couleurs produites :<\/b> Blanc uniquement.<\/p><p><b>Cépages :<\/b> Sauvignon, appelé aussi « blanc fumé », qui occupe environ 95 % du vignoble.<\/p><p><b>Robe :<\/b> Teinte dorée pâle.<\/p><p><b>Nez :<\/b> Arômes d'agrumes (orange, citron, pamplemousse), avec des touches de fougère et de menthe. Selon le terroir, on peut aussi trouver du cassis ou du buis (cris), de la tubéreuse ou du narcisse (marnes), des notes végétales ou une odeur de pierre à fusil (silex).<\/p><p><b>Bouche :<\/b> Sur silex, les vins sont fermes et structurés. Sur cris, ils sont élégants et parfumés, et leurs arômes se développent plus vite. Sur marnes, ils sont pleins et fermes, et évoluent plus lentement.<\/p><p><b>Potentiel de garde :<\/b> Environ 1 à 5 ans.<\/p><p><b>Température de service :<\/b> 12 °C.<\/p><p><b>Accords mets-vins :<\/b> Fruits de mer, tomates farcies, poisson fumé ou poisson en sauce (brochet de Loire), volaille et crottin de Chavignol.<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/509/pouilly-fume"},"511":{"h":"<p><b>Couleurs produites :<\/b> blanc uniquement.<\/p><p><b>Cépages :<\/b> sauvignon, seul cépage de l'appellation.<\/p><p><b>Robe :<\/b> dorée et pâle.<\/p><p><b>Nez :<\/b> notes de buis, de bourgeon de cassis et de fleurs blanches, sur des terroirs graveleux.<\/p><p><b>Bouche :<\/b> palette large allant des épices à la pomme mûre, en passant par le cassis et le miel. Fraîcheur et finesse, avec une structure souple.<\/p><p><b>Potentiel de garde :<\/b> 2 ans.<\/p><p><b>Température de service :<\/b> 12 °C.<\/p><p><b>Accords mets-vins :<\/b> fruits de mer, poissons (sole grillée, saumon à l'oseille), mouclade, et fromages de chèvre (crottin de Chavignol, pyramide de Valençay).<\/p>","u":"https://www.hachette-vins.com/tout-sur-le-vin/appellations-vins/511/quincy"}},"SRC":{"Bourgogne (rouge)":{"i":22},"Bourgogne (blanc)":{"i":22},"Chablis":{"i":169},"Chablis Premier Cru":{"i":170},"Meursault":{"i":224},"Puligny-Montrachet":{"i":226},"Chassagne-Montrachet (blanc)":{"i":233},"Gevrey-Chambertin":{"i":175},"Nuits-Saint-Georges":{"i":208},"Pommard":{"i":219},"Volnay":{"i":220},"Beaune (rouge)":{"i":217},"Santenay (rouge)":{"i":235},"Mercurey (rouge)":{"i":241},"Givry (rouge)":{"i":242},"Rully (blanc)":{"i":240},"Mâcon-Villages":{"i":245},"Viré-Clessé":{"i":953},"Saint-Véran":{"i":252},"Pouilly-Fuissé":{"i":248},"Crémant de Bourgogne":{"i":167},"Be function fichesOf(b){
  const d=nrmD(b.domaine);if(!d)return [];
  return S.domaines.concat(HV).filter(f=>nrmD(f.domaine)===d).map(f=>{let sc=1;
    if(f.appellation&&b.appellation&&appNrm(f.appellation)===appNrm(b.appellation))sc+=1;
    if(f.cuvee){if(nrm(f.cuvee)===nrm(b.name))sc+=2;else sc-=5;}
    if(f.vintage){if(String(f.vintage)===String(b.vintage))sc+=2;else sc-=5;}
    return{f:f,sc:sc};}).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).map(x=>x.f);
}
function feltOf(dom){
  const d=nrmD(dom),bs=S.bottles.filter(b=>nrmD(b.domaine)===d),nz={},bo={};let n=0,sum=0;const rows=[];
  bs.forEach(b=>(b.tastings||[]).forEach(t=>{n++;sum+=t.total;(t.nez||[]).forEach(x=>nz[x]=(nz[x]||0)+1);(t.bou||[]).forEach(x=>bo[x]=(bo[x]||0)+1);}));
  bs.forEach(b=>{const t=lastTasting(b);if(t)rows.push([titleOf(b)+(b.vintage?' '+b.vintage:''),t.total]);});
  const top=m=>Object.keys(m).sort((a,b)=>m[b]-m[a]).slice(0,6);
  return{n:n,avg:n?Math.round(sum/n):0,nez:top(nz),bou:top(bo),rows:rows};
}
